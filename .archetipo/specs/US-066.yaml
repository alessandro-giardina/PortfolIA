body: |-
  #### US-066: Escludere le posizioni chiuse dal grafico di composizione del portafoglio

  **Epic:** EP-005 | **Priorità:** HIGH | **Punti:** 1 | **Stato:** TODO
  **Bloccata da:** -

  **User Story**
  Come Alessandro, investitore-proprietario,
  voglio che il grafico «Composizione» nel Quadro Strumenti mostri soltanto i titoli che detengo attualmente,
  in modo da non essere confuso da un titolo venduto in passato che appare a valore zero mescolato tra le posizioni realmente aperte.

  **Dimostra**
  Dopo l'implementazione di questa spec, in un portafoglio con una posizione completamente venduta (quantità a zero) ma con un prezzo ancora in cache, il grafico «Composizione» e il relativo elenco non la includono più, e la didascalia sotto il grafico riporta correttamente solo le esclusioni dovute a prezzo mancante sulle posizioni aperte.

  **Criteri di Accettazione**
  - [ ] Il grafico «Composizione» e il suo elenco a fianco sono calcolati soltanto sulle posizioni aperte (quantità detenuta > 0); una posizione chiusa non compare mai, indipendentemente dal fatto che abbia un prezzo in cache
  - [ ] La didascalia «Calcolato su N posizioni con prezzo — M escluse per prezzo mancante» conta le esclusioni soltanto tra le posizioni aperte, senza confondere una posizione chiusa a valore zero con una posizione aperta di prezzo mancante
  - [ ] La tabella delle posizioni chiuse (EP-008) continua a mostrare la posizione venduta, invariata: la correzione riguarda solo il grafico di composizione
  - [ ] Un test copre un portafoglio con almeno una posizione chiusa che ha ancora un prezzo valorizzato in cache, verificando che non compaia nel grafico né nel conteggio della didascalia
