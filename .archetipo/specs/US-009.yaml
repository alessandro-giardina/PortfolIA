body: |-
  #### US-009: Registrare lo storico dei prezzi osservati e mostrarlo nella scheda titolo

  **Epic:** EP-002 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** US-007

  **User Story**
  Come Alessandro, investitore-proprietario,
  voglio che ogni prezzo rilevato durante gli aggiornamenti che faccio venga conservato in uno storico locale e mostrato nella scheda del titolo,
  in modo da vedere come si è mosso un titolo nel tempo senza che l'app faccia una sola richiesta in più alla fonte (FR-018, ADR-008).

  **Nota di scopo**
  Lo storico di PortfolIA non è una serie storica completa recuperata dalla fonte: è il registro delle rilevazioni che l'utente stesso provoca visitando un titolo o aggiornando un portafoglio. È rado per costruzione e parte dal momento in cui la funzionalità entra in esercizio. Questa scelta rende la buona cittadinanza vera per costruzione — nessuna richiesta aggiuntiva alla fonte — al prezzo di una copertura storica parziale, gestita con la trasparenza totale di ADR-003.

  **Dimostra**
  Dopo l'implementazione di questa spec, aggiornando due volte il prezzo di un titolo in giorni diversi e con quotazione diversa, la sua scheda mostra in fondo — sotto "Carichi registrati" — una tabella "Storico prezzi" con due righe in ordine temporale decrescente, ciascuna con prezzo, data di rilevamento e fonte.

  **Criteri di Accettazione**
  - [ ] Ogni rilevazione di prezzo andata a buon fine registra un'osservazione (ISIN, prezzo, istante di rilevamento, fonte) nello storico locale
  - [ ] La registrazione non genera alcuna richiesta aggiuntiva alla fonte: avviene solo lungo gli aggiornamenti già esistenti (ricerca titolo, scheda titolo, aggiornamento massivo dei titoli obsoleti)
  - [ ] Una rilevazione il cui prezzo coincide con un'osservazione già registrata per lo stesso ISIN nello stesso giorno (giorno civile di Roma) non produce una nuova riga; due giorni distinti generano due righe anche a prezzo invariato
  - [ ] Due rilevazioni dello stesso giorno con prezzi diversi restano entrambe registrate, come osservazioni distinte
  - [ ] La scheda del titolo mostra sotto "Carichi registrati" una tabella "Storico prezzi" con le osservazioni in ordine temporale decrescente
  - [ ] I titoli già presenti in archivio compaiono nello storico con il prezzo attualmente in cache come prima osservazione
  - [ ] Un titolo con una sola osservazione mostra comunque la tabella con quella riga; nessun valore è stimato o interpolato per i periodi non osservati
