body: |-
  #### US-016: Dichiarare titolo per titolo perché il grafico del portafoglio è parziale

  **Epic:** EP-006 | **Priorità:** MEDIUM | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** US-015

  **User Story**
  Come Giulia, investitrice prudente,
  voglio sapere quale titolo rende parziale il grafico e da quando l'archivio lo copre,
  in modo da capire di che cosa non ho ancora i dati e potervi rimediare, invece di dubitare di tutto il grafico (FR-012, ADR-003).

  **Nota di scopo**
  Un grafico aggregato può essere parziale per due ragioni diverse — un titolo entra con una quotazione riportata, oppure non ha alcun prezzo noto — e un avviso complessivo non dice quale titolo, né da quando, né che cosa farne. Questa spec chiude il cerchio con ciò che l'app già sa fare: quando la parzialità dipende da rilevazioni obsolete, il rimedio è l'aggiornamento in blocco già consegnato da US-035, che vive nella stessa scheda.

  **Dimostra**
  Dopo l'implementazione di questa spec, un portafoglio di tre titoli di cui uno mai rilevato mostra accanto al grafico l'elenco dei tre: due con la data d'inizio copertura e il numero di rilevazioni nella finestra, il terzo marcato come non valorizzato; l'avviso di parzialità del grafico rimanda a quel terzo titolo per nome, non a un conteggio anonimo.

  **Criteri di Accettazione**
  - [ ] Accanto al grafico un elenco riporta, per ciascun titolo detenuto nella finestra, da quando l'archivio ne ha un prezzo e quante rilevazioni cadono nella finestra selezionata
  - [ ] Un titolo che entra nei punti solo con una quotazione riportata è marcato come tale, con la data della quotazione usata
  - [ ] Un titolo detenuto nella finestra e privo di qualsiasi prezzo noto è elencato come non valorizzato, ed è nominato come ragione della parzialità del tratto
  - [ ] L'elenco riporta soltanto fatti d'archivio: nessuna stima, nessuna copertura dedotta (ADR-003)
  - [ ] Quando la parzialità dipende da rilevazioni obsolete, l'elenco rimanda al comando di aggiornamento in blocco già presente nel Riepilogo (US-035), senza descrivere un rimedio manuale alternativo
  - [ ] Un portafoglio interamente coperto nella finestra mostra l'elenco in forma piena e senza avvisi, non un riquadro vuoto
