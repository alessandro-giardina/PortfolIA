body: |-
  #### US-015: Mostrare il P&L del portafoglio accanto al suo grafico

  **Epic:** EP-006 | **Priorità:** HIGH | **Punti:** 5 | **Stato:** TODO
  **Bloccata da:** US-020

  **User Story**
  Come Alessandro, investitore-proprietario,
  voglio vedere sotto il grafico quanto il portafoglio si è mosso nel periodo che sto guardando, distinto da quanto ci ho versato dentro,
  in modo da non scambiare un versamento per un guadagno (FR-011, FR-012).

  **Nota di scopo**
  Questa spec sostituisce l'intento originario — una tabella del P&L su cinque orizzonti insieme — con la stessa idea nella forma già consegnata da US-038: due metriche sotto il grafico, una che dipende dall'orizzonte scelto e una che non ci dipende. Il P&L complessivo non viene ricalcolato: esiste già nel quadro del risultato di US-043 (realizzato + latente = totale), e due letture dello stesso fatto non possono divergere.
  Il fatto nuovo, che il titolo singolo non aveva, è che la differenza fra il primo e l'ultimo punto di una finestra di portafoglio non è tutta performance: dentro quella finestra possono cadere carichi e vendite. Dichiararla come «variazione» senza scomporla scriverebbe a schermo un rendimento falso.

  **Dimostra**
  Dopo l'implementazione di questa spec, su una finestra che contiene un carico da 5.000 € e in cui il valore è passato da 20.000 a 26.000 € le metriche mostrano +6.000 € di variazione del valore, scomposta in +5.000 € di capitale netto versato e +1.000 € di movimento di mercato; cambiando scala le tre cifre si aggiornano, mentre il P&L complessivo del quadro del risultato resta identico.

  **Criteri di Accettazione**
  - [ ] Sotto il grafico compaiono, etichettate distintamente, la variazione del valore nella finestra selezionata e la sua scomposizione in capitale netto versato (carichi meno vendite cadute nella finestra) e movimento di mercato, ciascuna in €
  - [ ] Vale l'identità variazione del valore = capitale netto versato + movimento di mercato, verificata da un test
  - [ ] Il movimento di mercato è espresso anche in percentuale, e la base del rapporto è dichiarata a schermo
  - [ ] Il P&L complessivo mostrato nel Riepilogo resta quello del quadro del risultato (US-043) e non è ricalcolato qui: non dipende dall'orizzonte e non cambia al cambiare della scala
  - [ ] Una finestra con meno di due punti dichiara «dato non disponibile» per la variazione, mai zero, con la stessa soglia già in uso per il titolo
  - [ ] Una finestra in cui non tutti i titoli detenuti sono valorizzati dichiara la variazione parziale e nomina il perimetro su cui è calcolata
  - [ ] Test puri coprono i calcoli, incluso il caso di un carico e una vendita entrambi dentro la finestra
