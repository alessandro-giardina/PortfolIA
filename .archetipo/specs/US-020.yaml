body: |-
  #### US-020: Selezionare la scala temporale del grafico del portafoglio

  **Epic:** EP-006 | **Priorità:** HIGH | **Punti:** 3 | **Stato:** TODO
  **Bloccata da:** US-019

  **User Story**
  Come Alessandro, investitore-proprietario,
  voglio cambiare la scala temporale del grafico del portafoglio fra ultimo mese, ultimo anno, ultimi 5 anni, ultimi 10 anni e tutto lo storico,
  in modo da analizzare l'andamento del conto sull'orizzonte che mi interessa (FR-016).

  **Nota di scopo**
  Le scale sono le stesse cinque della scheda titolo, prese dalla definizione condivisa già consegnata da US-037 e non ricopiate: una sola idea di orizzonte in tutta l'app. Ne segue uno scostamento consapevole dalla formulazione originaria di FR-016, che elencava «giorno precedente»: su uno storico rado per costruzione (FR-018) un orizzonte di un giorno dichiarerebbe «dato non disponibile» quasi sempre, e US-037 lo aveva già escluso per il titolo.
  Una differenza sostanziale rispetto al titolo però c'è, ed è la ragione per cui questa spec non è gratuita: per un aggregato la copertura ha due dimensioni indipendenti — quanto la finestra è coperta *nel tempo* e quanti *titoli* erano valorizzati — e possono essere una piena e l'altra parziale.

  **Dimostra**
  Dopo l'implementazione di questa spec, selezionando «ultimi 10 anni» su un portafoglio la cui prima rilevazione è di due anni fa il grafico dichiara da quando i dati esistono anziché suggerire dieci anni di copertura; selezionando «ultimo mese» su un portafoglio senza rilevazioni recenti si ottiene «dato non disponibile» invece di un riquadro vuoto.

  **Criteri di Accettazione**
  - [ ] L'utente può scegliere fra cinque scale — ultimo mese, ultimo anno, ultimi 5 anni, ultimi 10 anni, tutto lo storico — che sono la definizione condivisa già in uso nella scheda titolo, non una seconda copia
  - [ ] «Tutto lo storico», dal primo carico del portafoglio a oggi, è la scala predefinita all'apertura del Riepilogo
  - [ ] Il grafico si aggiorna coerentemente con la scala selezionata
  - [ ] Una scala priva di punti nell'intervallo dichiara «dato non disponibile» invece di mostrare un grafico vuoto (ADR-003)
  - [ ] Una scala più lunga della storia disponibile dichiara da quando i dati esistono, senza lasciar intendere una copertura piena
  - [ ] La copertura è dichiarata su entrambe le dimensioni — tempo e perimetro dei titoli — e i due verdetti restano leggibili separatamente
