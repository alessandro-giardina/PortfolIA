body: |
  #### US-051: Quadro strumenti — riepilogo del portafoglio

  **Epica:** EP-009 | **Priorità:** MEDIUM | **Punti:** 5 | **Stato:** TODO
  **Bloccato da:** US-050

  **User Story**
  Come utente di PortfolIA che preferisce un'interfaccia più leggibile e con cifre in primo piano,
  voglio che la schermata «Riepilogo» del portafoglio sia disponibile anche nel design «Quadro strumenti»,
  così che le informazioni chiave (valore, capitale investito, differenza, titoli da aggiornare) siano leggibili a colpo d'occhio.

  **Dimostra**
  Dopo l'implementazione, commutando su «Quadro strumenti» la schermata Riepilogo mostra: barra laterale con navigazione, card KPI (valore attuale, capitale investito, differenza, titoli da aggiornare, senza prezzo), grafico dell'andamento del portafoglio (lo stesso `GraficoPortafoglio` ridipinto con i token del design), tabella dei titoli iscritti, composizione — secondo il mockup `docs/mockups/US-051/index.html`. Tutti i dati provengono dagli stessi hook estratti in US-049.

  **Criteri di accettazione**
  - [ ] Nel design «quadro», il riepilogo mostra le card KPI con cifre grandi (≥ 34px), etichette compatte, e segnalazione dei titoli da aggiornare e senza prezzo
  - [ ] La barra laterale del mockup è presente e permette la navigazione fra le schermate disponibili
  - [ ] Il grafico dell'andamento del portafoglio (`GraficoPortafoglio`) è reso con colori e tipografia coerenti al design «quadro», senza duplicare il componente
  - [ ] La tabella dei titoli iscritti include le colonne del mockup e le righe sono cliccabili per aprire la scheda titolo
  - [ ] Commutando fra «mastro» e «quadro» i dati restano invariati: la logica è condivisa
  - [ ] Il toggle tema chiaro/scuro è funzionante nel design «quadro» come nel mockup
  - [ ] I `data-testid` dei punti di verifica principali sono presenti anche nel markup del design «quadro»

  ## Rework Feedback

  <!-- Added by request-changes. archetipo-plan converts each item into a Fix task. -->

  - **client/src/views/RiepilogoQuadro.tsx:134** — Sostituire il blocco «registro» stile libro mastro (VOL. I — ANNO MMXXVI / Portafoglio n. NNN / Aperto il ...), oggi renderizzato verbatim anche nel design quadro tramite `colonna-registro` in Quadro.tsx:186, con un blocco `.titolo-pagina` posizionato in cima al contenuto (prima della griglia KPI), come nel mockup docs/mockups/US-051/index.html righe 86-96: `h1` col nome del portafoglio in grande e `p.sottotitolo` con «N posizioni · aperto il DD MMM AAAA» (senza la parte «valuta di conto EUR» presente nel mockup, non richiesta). La semantica da libro mastro (VOL./ANNO/numero progressivo) resta solo nel design mastro (Foglio), non va portata nel guscio quadro.
  - **client/src/views/RiepilogoQuadro.tsx:221** — La sezione «Composizione» (oggi resa verticale in Composizione.tsx, montata dentro `griglia-doppia` insieme al grafico) va trasformata in layout orizzontale e riordinata: l'ordine finale delle tre sezioni deve essere 1) «Titoli iscritti a conto» (oggi al rigo ~270), 2) «Composizione» (orizzontale), 3) «Andamento del portafoglio». L'obiettivo è recuperare spazio orizzontale per le sezioni sottostanti, oggi troppo schiacciate.
  - **client/src/views/RiepilogoQuadro.tsx:267** — Spostare il pannello «Titoli iscritti a conto» prima della sezione «Composizione» nell'ordine verticale della pagina (vedi commento sulla riga 221 per l'ordine completo delle tre sezioni).
