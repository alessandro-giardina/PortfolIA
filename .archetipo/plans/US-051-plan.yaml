  - id: TASK-06
    title: Composizione del portafoglio — ciambella e legenda
    description: |-
      Creare `client/src/domain/composizione.ts` con una funzione **pura** che, date le `EnrichedPositionSummary`, restituisce le sole posizioni con `currentValue !== null`, la quota di ciascuna, la percentuale e l'offset dell'arco per il tracciamento SVG (`stroke-dasharray` / `stroke-dashoffset`), più il totale valorizzato e il conteggio delle posizioni incluse ed escluse.

      Creare `client/src/components/Composizione.tsx` che la disegna secondo il mockup: ciambella SVG con al centro l'etichetta «Valorizzato» e la cifra, ed elenco `.elenco-quote` con punto colorato, nome, ISIN, valore e percentuale. `data-testid="composizione-portafoglio"`. La chiosa del pannello dichiara su quante posizioni è calcolata («sulle N posizioni con prezzo»): la posizione senza prezzo è esclusa **e detta**, non omessa in silenzio. Nessuna chiamata API: il dato è già in `enrichedPositions`.
