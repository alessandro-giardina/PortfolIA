spec_code: US-051
body: "# US-051: Quadro strumenti — riepilogo del portafoglio — Piano di implementazione\n\n**Prodotto da:** squadra di pianificazione ARchetipo\n**Data:** 19 ago 2026\n\n---\n\n## Specifica\n\n**Epica:** EP-009 — Direzione visiva commutabile\n**Priorità:** MEDIUM | **Punti:** 5 | **Bloccato da:** US-050 (in REVIEW)\n\n**User Story**\nCome utente di PortfolIA che preferisce un'interfaccia più leggibile e con cifre in primo piano,\nvoglio che la schermata «Riepilogo» del portafoglio sia disponibile anche nel design «Quadro strumenti»,\ncosì che le informazioni chiave (valore, capitale investito, differenza, titoli da aggiornare) siano leggibili a colpo d'occhio.\n\n**Criteri di accettazione**\n- Card KPI con cifre grandi (≥ 34px), etichette compatte, segnalazione dei titoli da aggiornare e senza prezzo\n- Barra laterale presente e navigabile fra le schermate disponibili\n- `GraficoPortafoglio` reso con colori e tipografia del design «quadro», **senza duplicare il componente**\n- Tabella dei titoli iscritti con le colonne del mockup, righe cliccabili verso la scheda titolo\n- Commutando fra «mastro» e «quadro» i dati restano invariati: la logica è condivisa\n- Toggle tema chiaro/scuro funzionante nel design «quadro»\n- I `data-testid` dei punti di verifica principali presenti anche nel markup «quadro»\n\n---\n\n## Soluzione tecnica\n\nIl mockup non è una riverniciatura: introduce una **struttura di pagina diversa** (barra laterale di navigazione, testata con briciole, card KPI, pannelli affiancati). Nessun foglio di stile può ricavarla dal markup del Libro Mastro, che è un foglio unico con testata, colonna registro e linguette. La commutazione avviene quindi **al livello del guscio e della vista**, non del dato: gli hook estratti in US-049 (`usePortafoglio`, `useDatiPortafoglio`, `useFormCarico`, `useModificaPosizione`) restano l'unica sorgente, e i due design ne sono due rese.\n\n### Decisioni architetturali\n\n1. **Le linguette diventano dati, non JSX.** Oggi `PortfolioDetailPage` costruisce le linguette come markup del mastro (`<a className=\"attiva\">`). Diventano un array descrittivo — `{ chiave, etichetta, stato: 'attiva' | 'cliccabile' | 'disabilitata', onClick? , to? }` — e ciascun guscio lo rende a modo suo: linguette di cartella nel mastro, voci della barra laterale nel quadro. È il perno che rende la barra laterale del quadro navigabile senza duplicare la logica di quale scheda sia attiva, e serve identicamente a US-052÷055.\n\n2. **`Guscio` sceglie, `Foglio` e `Quadro` rendono.** Un componente sottile legge `useDesign()` e monta `Foglio` (esistente, invariato) oppure `Quadro` (nuovo). Le pagine non contengono il ternario: lo contiene il guscio, una volta sola per tutta l'epica. `Quadro.tsx` replica la struttura del mockup — `.guscio` > `.barra-laterale` (marchio, navigazione, piede) + `.principale` (`.testata` con briciole e azioni, `.contenuto`) — e ospita il commutatore di design di US-050 e il nuovo commutatore di tema.\n\n3. **La vista di riepilogo si sdoppia, il dato no.** Il blocco `scheda === 'riepilogo'` di `PortfolioDetailPage.tsx` (≈ 300 righe dentro un file da 1170) viene estratto **senza modifiche** in `views/RiepilogoMastro.tsx`; accanto nasce `views/RiepilogoQuadro.tsx`. Entrambe ricevono per props lo stesso oggetto già calcolato da `useDatiPortafoglio` — non rifanno alcun conto. Il criterio «commutando i dati restano invariati» si legge nella firma: le due viste non hanno accesso a nulla che possa divergere.\n\n4. **Il grafico si ridipinge in CSS, non si riscrive.** `GraficoPortafoglio` è SVG in React, colorato per intero da classi e da `var(--seppia)`, `var(--rosso-margine)`, `var(--ottone)`, `var(--carminio)`, `var(--inchiostro)`, `var(--carta-chiara)`. US-050 ha racchiuso `ledger.css` sotto `:root[data-design='mastro']`, quindi sotto `quadro` **né quelle variabili né quelle regole esistono**: il componente monterebbe scolorito. `quadro.css` deve perciò (a) ridefinire quel vocabolario di variabili con i valori del nuovo design e (b) riscrivere le regole di classe del grafico (`.grafico-cornice`, `.tracciato .*`, `.barra-scala`, `.barra-perimetro`, `.doppio-regolo`, `.avviso-rado`) nella veste «quadro». Il file `.tsx` non si tocca: è così che il criterio «senza duplicare il componente» viene soddisfatto. La stessa via vale per `MetrichePortafoglio`, `AggiornaObsoleti`, `QuadroRisultato` e `CellaTitolo`.\n\n5. **Il tema chiaro/scuro è una seconda dimensione, indipendente dal design.** `useTema` rispecchia `useDesign`: attributo `data-tema` su `<html>`, preferenza in `localStorage('portfolia-tema')`, predefinito `scuro`, applicato dallo script inline sincrono di `client/index.html` per non lasciar lampeggiare il fondo sbagliato al primo paint. Vive fuori dallo scope del design perché US-052÷055 lo erediteranno, e perché in futuro il mastro potrebbe volerne uno proprio.\n\n6. **La composizione è UI nuova, ma non è dato nuovo.** La ciambella del mockup si calcola dalle sole `enrichedPositions` con `currentValue !== null` — nessun endpoint, nessuna query. La matematica delle fette (quota, percentuale, offset dell'arco) sta in `client/src/domain/composizione.ts`, funzione pura, così che `Composizione.tsx` resti disegno; il rigore sui dati mancanti è dichiarato in chiaro («sulle 4 posizioni con prezzo»), come nel resto dell'app.\n\n7. **`data-testid`: parità, non invenzione.** La vista quadro porta gli stessi identificatori della vista mastro — `valore-totale-portafoglio`, `tabella-riepilogo`, `riepilogo-${isin}`, `prezzo-attuale-${isin}`, `rilevamento-${isin}`, `marca-rilevamento-${isin}`, `diff-${isin}`, `riepilogo-vuoto`, `riepilogo-tutte-chiuse`, `tabella-posizioni-chiuse`, `posizione-chiusa-${isin}`, `badge-riaperta-${isin}`, `quadro-risultato` — più i propri per ciò che nel mastro non esiste: `barra-laterale`, `toggle-tema`, `kpi-valore-attuale`, `kpi-capitale-investito`, `kpi-differenza`, `kpi-da-aggiornare`, `kpi-senza-prezzo`, `composizione-portafoglio`. La parità è ciò che permette al test «stessi dati, veste diversa» di leggere gli stessi punti nei due design.\n\n### Assunzioni dichiarate\n\nIl mockup mostra il riepilogo del portafoglio come lo si progetterebbe oggi da zero; la schermata reale porta però due blocchi consegnati da user story precedenti che il mockup non raffigura. Toglierli commutando design sarebbe una **perdita di informazione**, non una scelta di stile, quindi entrambi vengono resi anche nel quadro, come pannelli nella veste nuova:\n\n- **`QuadroRisultato`** (US-043 — P&L realizzato + latente = totale). Attenzione al nome: è il *quadro del risultato*, non il *design quadro*. Sono omonimi e non hanno relazione.\n- **La sezione «Gestione del conto»** (rinomina ed estinzione del portafoglio).\n\nSe invece li vuoi fuori dal design quadro, è una riga da togliere in `RiepilogoQuadro.tsx` — ma va deciso, non lasciato cadere.\n\n### Rischi\n\n- **Variabili orfane.** Ogni `var(--x)` che `quadro.css` dimentica di ridefinire non si vede come errore: il colore semplicemente svanisce. Mitigazione: TASK-07 parte dall'elenco esaustivo delle variabili citate nei `.tsx` (`grep -o \"var(--[a-z-]*)\" client/src/**/*.tsx`), non dal colpo d'occhio.\n- **Il file `@import` dei font.** `quadro.css` ha bisogno dei tre font del mockup (Manrope, Space Grotesk, IBM Plex Mono) e `@import` deve stare in cima al file, prima di ogni regola — inclusa la `:root[data-design='quadro']` che oggi ci sta già.\n- **Regressione silenziosa sul mastro.** L'estrazione di TASK-01 è un *puro spostamento*: nessuna riga di JSX cambia. La rete di sicurezza è la suite E2E esistente, che gira col design predefinito `mastro` e deve restare verde senza toccare un solo test (TASK-12).\n\n---\n\n## Strategia di test\n\nIl progetto non ha un runner di test unitari lato client (`npm run test` gira su `server/tests`); la superficie di verifica del client è Playwright, e questa spec è interamente client. La strategia è quindi E2E, più `npm run check` come cancello di lint/typecheck.\n\n- **La verifica portante è comparativa**, non descrittiva: lo stesso portafoglio, letto nei due design, deve dare le stesse cifre negli stessi `data-testid`. È l'unico modo di provare il criterio «la logica è condivisa» senza prendersi sulla parola l'architettura.\n- **Nessun test esistente viene modificato.** Il design predefinito resta `mastro`, quindi la suite corrente è il controllo di non regressione così com'è.\n- **Ogni file spec possiede le proprie chiavi** in `e2e/support/titoli.ts` (regola R1): due file, due ISIN distinti, entrambi seminati dal proprio file. La pulizia passa dalla fixture `archivio`, mai da `try/finally`.\n- `data-design` e `data-tema` vivono in `localStorage`, che Playwright azzera a ogni contesto: ogni test parte da `mastro` + `scuro` senza bisogno di ripristini.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (già in uso; `playwright.config.ts`, `e2e/support/fixtures.ts`)\n**Registrazione video:** solo lo scenario dimostrativo, in `docs/test-results/US-051/`\n\n| Scenario | Flusso utente |\n|---|---|\n| Guscio e KPI | L'utente apre un portafoglio con 3 titoli seminati (uno senza prezzo, uno con rilevamento stantio), commuta su «Quadro strumenti»: compaiono barra laterale, briciole e le cinque card KPI; le cifre di «Valore attuale», «Capitale investito» e «Senza prezzo» corrispondono ai titoli seminati |\n| Stessi dati, veste diversa **(demo, con video)** | L'utente legge `valore-totale-portafoglio`, `diff-${isin}` e `prezzo-attuale-${isin}` nel design mastro, commuta su quadro senza ricaricare, rilegge gli stessi `data-testid`: le stringhe coincidono carattere per carattere |\n| Riga → scheda titolo | Nel design quadro l'utente fa click su una riga della tabella dei titoli iscritti: si apre la scheda del titolo giusto e il guscio resta quello quadro (barra laterale ancora presente) |\n| Tema chiaro/scuro | Nel design quadro l'utente preme il commutatore di tema: `data-tema` passa a `chiaro`, il fondo cambia; dopo un `reload` il tema resta `chiaro` e il design resta `quadro` |\n| Navigazione della barra laterale | Dalla barra laterale l'utente apre «Portafogli»: atterra su `/`; «Carico titoli» porta alla scheda di carico dello stesso portafoglio, con la voce di navigazione segnata come attiva |\n| Composizione | Il pannello «Composizione» dichiara su quante posizioni è calcolato e la somma delle percentuali di legenda vale 100 %; la posizione senza prezzo **non** compare fra le fette |\n| Grafico ridipinto | Nel design quadro il grafico dell'andamento è montato (`svg.tracciato` presente, stesso numero di punti del mastro) e nessuno dei suoi tratti resta senza colore risolto |\n\n**Ripartizione in file** (`launchOptions.slowMo` non è restringibile a un `describe`, cfr. CLAUDE.md):\n\n- `e2e/US-051__quadro-riepilogo.spec.ts` — tutti gli scenari tranne la demo\n- `e2e/US-051__quadro-riepilogo-demo.spec.ts` — il solo scenario «stessi dati, veste diversa», con `test.use({ launchOptions: { slowMo } })` e `page.video().saveAs('docs/test-results/US-051/...')` in `afterEach`, dopo `page.close()`\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono in `docs/mockups/US-051/` (`index.html` + `shared.css` + `app.js`).\n> Provengono da `docs/mockups/quadro-strumenti/`, spostata e divisa: la scheda titolo è ora in `docs/mockups/US-052/`, che è la sua user story. Due difetti tipografici misurati in headless sono stati corretti in entrambe le copie di `shared.css` — le cifre KPI sporgevano di 14px oltre il padding della carta, e `line-height: 1.05` tagliava 3–5px dell'asta delle cifre. Il dettaglio è nel README della cartella. **`quadro.css` va portato dal `shared.css` corretto, non da quello originale.**\n\n_Piano prodotto da ARchetipo Planning — 19 ago 2026_\n"
tasks:
  - id: TASK-01
    title: Estrarre il riepilogo mastro in una vista e rendere le linguette dati
    description: |-
      Spostare **senza modifiche** il blocco `scheda === 'riepilogo'` di `client/src/pages/PortfolioDetailPage.tsx` (righe ~215-540) in `client/src/views/RiepilogoMastro.tsx`, che riceve per props quanto già calcolato da `useDatiPortafoglio`/`usePortafoglio` (`enrichedPositions`, `posizioniAperte`, `posizioniChiuse`, `ultimaVenditaPerIsin`, `enrichedLoading`, `series`, `seriesLoading`, `isinInLavorazione`, `id`, `ricalcolaSilenzioso`, `setIsinInLavorazione`, `apriSchedaTitolo` e i campi di rinomina/estinzione). Nessun conto si sposta nella vista.

      Trasformare inoltre le linguette da JSX del mastro a **descrizione dati**: un array `{ chiave: 'riepilogo'|'carico'|'titolo'|'portafogli', etichetta: string, stato: 'attiva'|'cliccabile'|'disabilitata', onClick?: () => void, to?: string }[]` costruito in `PortfolioDetailPage`. `Foglio.tsx` accetta l'array e ne rende le `.linguette` esattamente come oggi — stesse classi, stesso markup, stesso comportamento. È il perno che permetterà alla barra laterale del quadro di navigare senza duplicare la logica di scheda attiva.

      Verifica: la suite E2E esistente resta verde senza modificare un solo test.
    type: Impl
    status: DONE
    body: |-
