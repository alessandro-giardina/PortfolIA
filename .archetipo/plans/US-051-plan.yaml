    ref: TASK-02
  - id: TASK-03
    title: Commutatore di tema chiaro/scuro (data-tema + localStorage)
    description: |-
      Creare `client/src/hooks/useTema.ts` speculare a `useDesign`: espone `{ tema, commutaTema }`, alterna `'scuro' | 'chiaro'` su `document.documentElement.dataset.tema` e salva in `localStorage('portfolia-tema')`; stato inizializzato in modo pigro dal dataset. Predefinito `scuro`.

      Estendere lo script inline sincrono di `client/index.html` (quello di US-050) perché imposti anche `dataset.tema` prima del primo paint, evitando il lampeggio del fondo.

      Montare in `Quadro.tsx` il bottone `.icona-bottone[data-azione="tema"]` del mockup — le due icone SVG sole/luna, `aria-label` esplicito, `data-testid="toggle-tema"`. Il tema è una dimensione **indipendente** dal design: `data-tema` sta su `<html>` accanto a `data-design`, non dentro il suo scope.
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
      Creare `client/src/hooks/useTema.ts` speculare a `useDesign`: espone `{ tema, commutaTema }`, alterna `'scuro' | 'chiaro'` su `document.documentElement.dataset.tema` e salva in `localStorage('portfolia-tema')`; stato inizializzato in modo pigro dal dataset. Predefinito `scuro`.

      Estendere lo script inline sincrono di `client/index.html` (quello di US-050) perché imposti anche `dataset.tema` prima del primo paint, evitando il lampeggio del fondo.

      Montare in `Quadro.tsx` il bottone `.icona-bottone[data-azione="tema"]` del mockup — le due icone SVG sole/luna, `aria-label` esplicito, `data-testid="toggle-tema"`. Il tema è una dimensione **indipendente** dal design: `data-tema` sta su `<html>` accanto a `data-design`, non dentro il suo scope.
    ref: TASK-03
  - id: TASK-04
    title: quadro.css — token, temi, guscio, KPI, pannelli, tabelle
    description: |-
      Sostituire il segnaposto di `client/src/quadro.css` portando le regole da **`docs/mockups/US-051/shared.css` (versione corretta)**, non dall'originale: le cifre KPI sono ora fluide (`clamp(26px, 2.35vw, 34px)` / `clamp(31px, 3.05vw, 44px)`), la traccia della griglia parte da 248px e `line-height` delle cifre è 1.2 — le tre correzioni ai difetti di sfondamento e taglio delle aste.

      Struttura del file:
      1. `@import` dei tre font (Manrope, Space Grotesk, IBM Plex Mono) **in cima**, prima di ogni regola;
      2. `:root[data-design='quadro'] { ... }` — token del tema scuro (predefinito) + tutte le regole di classe, annidate come fa `ledger.css` per il mastro;
      3. `:root[data-design='quadro'][data-tema='chiaro'] { ... }` — i soli token che cambiano, come nel mockup.

      Copertura di questa task: guscio e barra laterale, testata e briciole, `.griglia-kpi`/`.carta-kpi`, `.pannello`/`.testa-pannello`/`.corpo-pannello`, `.griglia-doppia`, `table.dati` e `.tabella-scroll`, `.pillola`, `.avviso`, `.bottone`, `.segmentato`, `.entra` (con il rispetto di `prefers-reduced-motion`). Il ridipingimento dei componenti condivisi è TASK-07.
    type: Impl
    status: DONE
    dependencies:
      - TASK-02
    body: |-
