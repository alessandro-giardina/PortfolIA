  - id: TASK-05
    title: Vista RiepilogoQuadro — card KPI, tabella titoli, posizioni chiuse, gestione
    description: |-
      Creare `client/src/views/RiepilogoQuadro.tsx` con la **stessa firma di props** di `RiepilogoMastro`: riceve i risultati degli hook e non ricalcola nulla. Rende, secondo `docs/mockups/US-051/index.html`:

      - le cinque card KPI — Valore attuale (`kpi-valore-attuale`, cifra `.grande`, con il conteggio «N di M posizioni valorizzate»), Capitale investito (`kpi-capitale-investito`), Differenza (`kpi-differenza`, con la percentuale), Da aggiornare (`kpi-da-aggiornare`, ambra) e Senza prezzo (`kpi-senza-prezzo`). Il riquadro del valore totale conserva `data-testid="valore-totale-portafoglio"` sulla card del valore attuale;
      - l'avviso dei titoli obsoleti, montando `AggiornaObsoleti` esistente;
      - la griglia `.griglia-doppia`: pannello «Andamento del portafoglio» con `GraficoPortafoglio` (stesso componente, stessa prop `sottoIlGrafico` con `MetrichePortafoglio`) e pannello «Composizione» (TASK-06);
      - il pannello «Titoli iscritti a conto» con `table.dati`, `data-testid="tabella-riepilogo"`, righe cliccabili (`role="button"`, `tabIndex`, Invio/Spazio) e i `data-testid` per riga in parità con il mastro: `riepilogo-${isin}`, `prezzo-attuale-${isin}`, `rilevamento-${isin}`, `marca-rilevamento-${isin}`, `diff-${isin}`, `badge-riaperta-${isin}`; totale in `tfoot`;
