  - id: TASK-02
    title: 'Guscio commutabile: componente Guscio + shell Quadro'
    description: |-
      Creare `client/src/components/Guscio.tsx`: legge `useDesign()` e monta `Foglio` (mastro, invariato) o `Quadro` (nuovo). Le pagine montano `Guscio`, non più `Foglio` direttamente: il ternario del design vive in un punto solo per tutta l'epica EP-009.

      Creare `client/src/components/Quadro.tsx` sulla struttura di `docs/mockups/US-051/index.html`: `.guscio` > `aside.barra-laterale` (`.marchio` con il segno SVG, `nav.gruppo-nav` con le voci derivate dall'array linguette di TASK-01, `.piede-laterale`) + `main.principale` (`header.testata` con `nav.briciole` e `.azioni-testata`, poi `.contenuto`). La barra laterale porta `data-testid="barra-laterale"`.

      Il commutatore di design di US-050 si sposta qui dentro nella veste quadro (pillola `.bottone.nudo` in `.azioni-testata`, come previsto dal piano di US-050) e resta dov'è nel `Foglio`.
    type: Impl
    status: DONE
    dependencies:
      - TASK-01
    body: |-
      Creare `client/src/components/Guscio.tsx`: legge `useDesign()` e monta `Foglio` (mastro, invariato) o `Quadro` (nuovo). Le pagine montano `Guscio`, non più `Foglio` direttamente: il ternario del design vive in un punto solo per tutta l'epica EP-009.

      Creare `client/src/components/Quadro.tsx` sulla struttura di `docs/mockups/US-051/index.html`: `.guscio` > `aside.barra-laterale` (`.marchio` con il segno SVG, `nav.gruppo-nav` con le voci derivate dall'array linguette di TASK-01, `.piede-laterale`) + `main.principale` (`header.testata` con `nav.briciole` e `.azioni-testata`, poi `.contenuto`). La barra laterale porta `data-testid="barra-laterale"`.

