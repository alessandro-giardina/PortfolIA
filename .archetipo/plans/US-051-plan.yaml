  - id: TASK-07
    title: quadro.css — ridipingere i componenti condivisi senza duplicarli
    description: |-
      `ledger.css` è racchiuso da US-050 sotto `:root[data-design='mastro']`: sotto `quadro` le sue regole e le sue variabili **non esistono**, e i componenti condivisi monterebbero scoloriti. Nessun `.tsx` va toccato — la ripittura è tutta in `quadro.css`.

      Procedere da un elenco esaustivo, non a colpo d'occhio: `grep -o 'var(--[a-z0-9-]*)' client/src/**/*.tsx | sort -u` dà il vocabolario che i componenti citano inline (almeno `--seppia`, `--rosso-margine`, `--ottone`, `--carminio`, `--inchiostro`, `--carta-chiara`, `--blu-riga`). Ridefinirle tutte dentro `:root[data-design='quadro']` con i valori del nuovo design, in modo che ogni `var()` risolva.

      Riscrivere poi nella veste quadro le regole di classe di: `GraficoPortafoglio` (`.grafico-cornice`, `.tracciato .*`, `.barra-scala`, `.barra-perimetro`, `.doppio-regolo`, `.avviso-rado`, `.dichiarazione-vuota`, `.timbro-riporto`, `.segno-parziale`), `MetrichePortafoglio`, `AggiornaObsoleti`, `QuadroRisultato` (`.quadro-risultato`, `.voce-pl`, `.cifra-pl`, `.operatore`) e `CellaTitolo`. Un `var()` dimenticato non dà errore: sparisce e basta — verificare a video, non solo a lettura.
    type: Impl
    status: DONE
    dependencies:
      - TASK-04
