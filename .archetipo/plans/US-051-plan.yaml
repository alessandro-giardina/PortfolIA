  - id: TASK-08
    title: Navigazione della barra laterale
    description: |-
      Cablare le voci della barra laterale sull'array linguette di TASK-01: «Portafogli» → `/`, «Riepilogo» → scheda riepilogo, «Carico titoli» → scheda carico, «Ricerca titoli» → `/ricerca`, «Scheda titolo» → scheda titolo, disabilitata finché nessun ISIN è selezionato. La voce corrente porta `aria-current="page"` e la classe `.attiva`.

      Le pagine `/` e `/ricerca` restano nel guscio mastro finché non arrivano US-053 e US-055: la navigazione deve funzionare comunque — è quanto chiede il criterio «fra le schermate disponibili» — e la preferenza `data-design` sopravvive al cambio di rotta perché vive su `<html>` e in `localStorage`.
