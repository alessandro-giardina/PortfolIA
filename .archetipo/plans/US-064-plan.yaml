spec_code: US-064
body: |
  # US-064: Rimuovere ovunque i riferimenti a FR e ADR dal testo mostrato all'utente — Piano di Implementazione

  **Generato da:** Team di Planning ARchetipo
  **Data:** 2026-08-21

  ---

  ## Spec

  **Epica:** EP-009 — Direzione visiva commutabile
  **Priorità:** MEDIUM | **Punti:** 5

  **User Story**
  Come utente di PortfolIA, voglio che nessuna schermata mostri sigle come «FR-025» o «ADR-009», così che il testo dell'app non faccia riferimento a documenti interni di progetto (requisiti funzionali, decisioni architetturali) che non ho mai visto e a cui non ho motivo di accedere.

  **Criteri di accettazione**
  - Nei nove file elencati nel Contesto, ogni nota che oggi comincia con una sigla FR-xxx (`.nota`/`.chiosa` con «FR-xxx · ...») è riformulata mantenendo la spiegazione ma senza la sigla iniziale
  - Ogni nota che oggi chiude la frase con «(ADR-xxx)» resta invariata nel resto del contenuto, senza il riferimento tra parentesi
  - Lo `span.rimando` di `QuadroRisultato.tsx` e la regola CSS dedicata `.quadro-risultato .capo-quadro .rimando` sono rimossi, senza lasciare un vuoto innaturale accanto al titolo «Quadro del risultato»
  - Una ricerca testuale su tutto `client/src` per i pattern `FR-\d{3}` e `ADR-\d{3}` non restituisce alcun risultato al di fuori di commenti di codice (`//`, `/* */`, `{/* */}`)
  - I test E2E esistenti sulle schermate toccate passano senza modifiche
  - `npm run check` è verde

  ---

  ## Technical Solution

  Il lavoro è puramente testuale: nessuna nuova struttura, nessun nuovo componente, nessuna nuova rotta. La ricognizione preliminare (`grep -rnE "FR-[0-9]{3}|ADR-[0-9]{3}" client/src`) conferma che tutte le occorrenze **fuori dai commenti di codice** cadono esattamente nei nove file già elencati nel Contesto della spec; tutte le altre occorrenze (in `ledger.css`, `quadro.css`, JSDoc, commenti `//` e `{/* */}` di altri componenti come `GraficoPortafoglio.tsx`, `MetricheTitolo.tsx`, `CellaTitolo.tsx`, ecc.) sono commenti per sviluppatori e restano fuori scope per esplicita clausola del criterio di accettazione.

  Due pattern testuali distinti, già distinti nel testo della spec:

  1. **Note `.nota`/`.chiosa` che iniziano con la sigla** (formato «FR-xxx · spiegazione telegrafica»): si toglie il prefisso «FR-xxx · » (o «FR-xxx · FR-yyy · ADR-zzz · », quando le sigle sono concatenate) e si verifica che la frase residua resti grammaticalmente autonoma. In tutti i nove casi la spiegazione dopo il primo «·» è già una frase di senso compiuto (es. «dati della posizione nel portafoglio», «la vendita è una nuova iscrizione, non la rettifica di un carico»): non serve riscrittura semantica, solo la rimozione del prefisso.
  2. **Riferimenti «(ADR-xxx)» a fine frase o a fine inciso**: la frase che li precede è già autosufficiente (è la clausola esplicita del criterio di accettazione), quindi si rimuove solo la parentesi, senza toccare il resto della frase. Attenzione alla punteggiatura residua: dove «(ADR-xxx)» chiude il periodo la frase deve terminare comunque con un punto (es. GraficoTitolo.tsx:790 e :1928 hanno già il punto fermo dopo la chiusura tonda, va solo tolta la parentesi mantenendo il punto).

  **Caso speciale — `QuadroRisultato.tsx`:** qui la nota non va riformulata ma **rimossa del tutto**. Il suo contenuto («realizzato + latente = totale») è già ridondante con il layout visivo del componente, che secondo il suo stesso JSDoc «scrive la somma e non la sottintende, con gli operatori veri fra le tre caselle» — l'utente vede già `realizzato + latente ═ totale` nella disposizione delle tre caselle sottostanti. Rimuovere lo `span.rimando` insieme alla sua regola CSS (`.quadro-risultato .capo-quadro .rimando`, presente identica in `ledger.css:3441` e `quadro.css:913`, una per ciascun design) non lascia un vuoto innaturale: `.capo-quadro` è già `display:flex; justify-content:space-between` fra `h2` e `.rimando` — con un solo figlio rimasto (`h2`), il flexbox lo allinea naturalmente a sinistra senza spazio vuoto a destra, nessuna modifica di layout aggiuntiva è necessaria.

  **File toccati (9, invarianti secondo il Contesto della spec) più le due regole CSS gemelle:**
  - `client/src/components/QuadroRisultato.tsx` — rimozione span + JSDoc riga 88 lasciata intatta (è un commento)
  - `client/src/ledger.css` (riga 3441) e `client/src/quadro.css` (riga 913) — rimozione regola `.rimando`
  - `client/src/views/CaricoMastro.tsx` (righe 132, 296)
  - `client/src/views/CaricoQuadro.tsx` (righe 148, 323)
  - `client/src/components/SchedaTitolo.tsx` (righe 136, 404, 525)
  - `client/src/views/SchedaTitoloQuadro.tsx` (righe 265, 341, 463)
  - `client/src/views/RiepilogoMastro.tsx` (righe 87, 145, 312)
  - `client/src/components/GraficoTitolo.tsx` (righe 790, 1723, 1928) — solo parentesi ADR, condiviso da entrambi i design
  - `client/src/components/ModuloScarico.tsx` (riga 198)
  - `client/src/views/ModuloScaricoQuadro.tsx` (righe 71-74)

  Nessuna modifica lato server, nessuna modifica di schema, nessuna nuova dipendenza. Il rischio principale è di sbagliare un'occorrenza per copia-incolla imprecisa (specialmente le entità HTML `&middot;`/`&mdash;` in `SchedaTitolo.tsx`/`CaricoMastro.tsx`/`GraficoTitolo.tsx` contro il carattere Unicode diretto `·`/`—` nei corrispondenti file `*Quadro.tsx`): ogni file mantiene la propria convenzione di escaping già in uso, non se ne introduce una nuova.

  ---

  ## Test Strategy

  Non c'è comportamento nuovo da testare: è una spec di sola riformulazione testuale, senza logica, senza nuovi stati, senza nuove interazioni utente. La strategia di verifica è quindi basata su regressione e su un controllo testuale esplicito, non su nuovi scenari e2e:

  - **Verifica statica (grep):** eseguire `grep -rnE "FR-[0-9]{3}|ADR-[0-9]{3}" client/src` a fine lavoro e confermare che ogni riga rimanente sia un commento (`//`, `/* ... */`, `{/* ... */}`) — è il criterio di accettazione stesso, va eseguito letteralmente come gate finale, non solo verificato "a occhio".
  - **Regressione E2E (nessuno spec nuovo):** i design Mastro e Quadro hanno già suite Playwright che attraversano le nove schermate toccate (tra le altre: `e2e/US-018__dettaglio-titolo.spec.ts`, `e2e/US-042__registra-vendita-lifo.spec.ts`, `e2e/US-042__vendita-rifiuti.spec.ts`, `e2e/US-051__quadro-riepilogo.spec.ts`, `e2e/US-043__mostra-pnl-realizzato-e-latente-varianti.spec.ts`, `e2e/US-055__quadro-ricerca-titoli.spec.ts`, oltre alle spec di carico/scarico). Ricerca preliminare confermata: **nessuna** di queste spec asserisce il testo letterale «FR-xxx»/«ADR-xxx» né la frase completa delle note toccate — assertano semmai `data-testid` o porzioni di testo che restano invariate. Non serve quindi modificare alcuno spec esistente; la sua riuscita immutata è essa stessa la prova di non-regressione.
  - **Nessun nuovo spec e2e da scrivere:** lo scenario "Dimostra" del Contesto («navigando tutte le schermate nessuna sigla compare più») è un controllo di assenza testuale su contenuto statico, meglio coperto dal grep del criterio di accettazione che da un'asserzione Playwright dedicata — non introduce un incremento di comportamento filmabile che giustifichi un nuovo `.spec.ts` con relativo video demo.
  - **Gate finale:** `npm run check` (lint + typecheck + typecheck:e2e + check:chiavi + test:e2e-support + test) deve restare verde; nessuna delle note toccate compare in test unitari server (`server/tests/`), quindi nessuna modifica attesa lì.

  ---

  _Piano generato via ARchetipo Planning — 2026-08-21_
