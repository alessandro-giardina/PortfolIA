schema: archetipo/plan/v2
spec_code: US-039
body: "# US-039: Commutare il grafico fra prezzo unitario e valore della posizione — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 11 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-007 — P&L e grafico del singolo titolo\n**Priorità:** MEDIUM | **Punti:** 3\n**Bloccata da:** US-036 (in REVIEW: serie, scala e grafico esistono già; questa spec **rimisura** la stessa serie, non ne compone una seconda)\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio poter commutare il grafico del titolo fra l'andamento del prezzo unitario e quello del valore della mia posizione, in modo da vedere sia come si è mosso il mercato sia quanto vale nel tempo il pacchetto che detengo.\n\n**Criteri di Accettazione**\n- [ ] Un comando commuta la curva fra prezzo unitario e valore della posizione, mantenendo invariata la scala temporale selezionata\n- [ ] Il prezzo unitario resta la vista predefinita\n- [ ] Nella vista valore, la quantità applicata a ogni data è quella effettivamente detenuta a quella data: i carichi successivi non retroagiscono sul passato\n- [ ] Ogni gradino verticale dovuto a un nuovo carico è dichiarato come capitale versato, distinto dalla performance\n- [ ] La linea del prezzo medio di carico ha senso solo nella vista prezzo unitario e non compare come riferimento nella vista valore\n\n---\n\n## Soluzione tecnica\n\nLa spec **non aggiunge un secondo grafico**: aggiunge una seconda *domanda* sugli stessi punti. Gli istanti sono identici nelle due viste — sono i carichi e le rilevazioni che US-036 ha già fuso in `componiSerieTitolo` — e cambia solo che cosa si legge sull'ordinata: il prezzo di una quota, oppure il controvalore delle quote effettivamente detenute a quella data. Da qui discende la prima decisione di struttura: la serie valore si compone **dalla serie prezzo**, non da carichi e rilevazioni riletti una seconda volta. Due composizioni indipendenti potrebbero divergere sull'ordine o sui punti scartati, e le due viste mostrerebbero due storie diverse dello stesso titolo.\n\nIl difetto che questa spec esiste per rendere impossibile è **la quantità retroattiva**: moltiplicare l'intera serie per `totalQuantity` è la scorciatoia ovvia, dà una curva plausibile e afferma una cosa falsa — che nel 2021 possedessi già le quote comprate nel 2023. Per questo la quantità è una funzione dell'istante, `quantitaDetenutaA(loads, at) = Σ quantity dei carichi con loadDate ≤ at`, e non un numero unico applicato a tutta la serie.\n\n### Il dominio: `shared/domain/serieValore.ts`\n\nModulo nuovo, puro come i due fratelli (`serieTitolo.ts`, `metricheTitolo.ts`): nessuna rete, nessun archivio, nessun orologio. Si affaccia da `shared/types/index.ts` come gli altri.\n\n- `VistaGrafico = 'prezzo' | 'valore'`, `VISTE_GRAFICO` (identificativi stabili, etichette italiane, didascalia dell'asse) e `VISTA_PREDEFINITA = 'prezzo'`. Vivono nel dominio per la stessa ragione di `SCALE_TEMPORALI`: il criterio 2 è un fatto, non una preferenza del componente, e il test lo legge dalla costante invece di riscriverlo.\n- `quantitaDetenutaA(loads, at)`: la quantità detenuta a un istante. Confronta la `loadDate` **ancorata a mezzanotte UTC** con la stessa regola di `componiSerieTitolo` — un secondo modo di leggere una data civile farebbe cadere un carico dal lato sbagliato del proprio giorno.\n- `componiSerieValore({ punti, loads })` → `SerieValore`. Riceve la serie **intera** (non ritagliata) e i carichi, e restituisce `PuntoValore[]` più i fatti che la resa deve dichiarare: quanti gradini contiene, quanti punti sono stati esclusi perché anteriori alla prima detenzione, l'istante della prima detenzione, la quantità finale.\n\n`PuntoValore` estende `PuntoSerie` (`at`, `price`, `origin`) e vi aggiunge `quantita`, `prezzoUnitario` e `gradino: GradinoCarico | null`. Il campo dell'ordinata **conserva il nome `price`** e porta il valore della posizione: è il campo che la proiezione legge e su cui `ritagliaSerie` e `calcolaScalaSerie` lavorano, e un secondo nome sdoppierebbe quelle funzioni in due varianti gemelle. Il significato è dichiarato sul tipo e non resta mai ambiguo a schermo — la didascalia dell'asse, i `<title>` dei punti e gli attributi `data-*` dicono tutti che quella cifra è un controvalore.\n\n### Il gradino: due punti allo stesso istante\n\nUn carico successivo al primo produce **due punti sullo stesso `at`**: il valore con la quantità precedente e il valore con quella nuova, entrambi al prezzo di carico del giorno. La loro differenza è `loadPrice × quantity` del nuovo carico — cioè, alla cifra, il denaro versato. Non è un'approssimazione né una convenzione grafica: è un'identità, ed è ciò che rende il criterio 4 dimostrabile con un test aritmetico invece che con un'ispezione visiva.\n\nTre conseguenze, tutte deliberate:\n\n- **il primo carico non è un gradino, è l'origine.** Prima di esso la posizione non esisteva, e un punto a valore 0 il giorno prima schiaccerebbe per sempre il dominio Y sullo zero, comprimendo ogni movimento successivo per mostrare un salto che è solo l'inizio della storia;\n- **il tratto verticale del gradino è pieno, non tratteggiato** — l'unico dell'intero disegno. Il tratteggio di US-036 dichiara che *fra due punti l'archivio non possiede alcun prezzo*; fra i due capi di un gradino non passa alcun giorno, quindi non c'è nulla da ignorare e il tratteggio direbbe il falso;\n- **la serie valore non si riordina.** Si costruisce con una sola passata sulla serie prezzo, già ordinata; riordinare con il comparatore di `componiSerieTitolo` scioglierebbe il pari merito fra i due capi del gradino secondo il prezzo, che oggi dà l'ordine giusto solo per coincidenza (un carico aggiunge sempre quantità, quindi il valore sale).\n\n### I punti che la vista valore non può mostrare\n\n`priceHistory` è per **ISIN**, non per posizione: una rilevazione può precedere il primo carico — registrata mentre il titolo stava in un altro portafoglio, o creata dal backfill di US-009 dalla riga di cache. A quella data la quantità detenuta è 0, ma «la posizione valeva zero» è un'affermazione, non un'assenza: quei punti vengono **esclusi** dalla serie valore e il loro numero viene dichiarato sotto il tracciato (ADR-003), invece di essere disegnati su una retta piatta a zero.\n\nStesso principio per il titolo **senza alcun carico**: la vista valore non ha nulla da tracciare e lo dichiara a parole. Il bottone resta **attivo e selezionabile**, come il bottone di scala vuota di US-037: un bottone spento non spiega perché è spento.\n\n### Due generalizzazioni minime in `serieTitolo.ts`\n\nNessuna riscrittura: due allargamenti retrocompatibili, entrambi verificati da test di regressione.\n\n- `ritagliaSerie` diventa **generica** su `P extends PuntoSerie` e restituisce `P[]`: il ritaglio è un filtro sugli istanti e non ha ragione di perdere i campi in più del punto valore. Il ritaglio si applica **dopo** la composizione della serie valore, mai prima: calcolare le quantità sui soli carichi caduti in finestra rifarebbe il difetto della retroattività in forma ritagliata — una finestra che comincia dopo il primo carico ne dimenticherebbe le quote.\n- `calcolaScalaSerie` accetta `prezzoMedio: number | null` e una nuova opzione `ancoraAZero?: boolean`. Il `null` è il criterio 5 reso vero **nel dominio** e non solo nella resa: nella vista valore il prezzo medio non entra nemmeno nel calcolo degli estremi Y, quindi la riga non è «nascosta», è priva di posto dove stare. `ancoraAZero` fissa `yMin = 0` nella sola vista valore, perché tagliare la base di una grandezza assoluta ingrandirebbe di nascosto proprio il gradino che la spec chiede di misurare.\n\n### Il commutatore, e ciò che non deve toccare\n\nIl comando è una **seconda traversa sopra quella della scala** (mockup `docs/mockups/US-039/`): due bottoni veri dentro un gruppo con etichetta, `aria-pressed` sul selezionato, `data-testid=\"vista-grafico\"` e `vista-prezzo`/`vista-valore`, con `data-vista` sulla radice del grafico. Lo stato vive in `GraficoTitolo` accanto a quello della scala, e questo rende veri per costruzione due criteri: la vista predefinita è il prezzo perché lo stato nasce da `VISTA_PREDEFINITA`, e all'apertura di un altro titolo si azzera perché `SchedaTitolo` monta il grafico con `key={detail.isin}`. Il criterio 1 — la scala non cambia — è vero perché i due stati sono indipendenti e nessuno dei due scrive sull'altro; il test lo asserisce comunque, perché è esattamente l'accoppiamento che una futura «semplificazione» introdurrebbe.\n\n**`sottoIlGrafico` continua a ricevere il ritaglio della serie prezzo in entrambe le viste.** La render prop di US-038 alimenta `calcolaVariazionePeriodo`, che misura il **prezzo unitario** fra due rilevazioni e si dichiara tale a schermo («sul prezzo unitario · 1 quota»): passarle i punti della serie valore ne cambierebbe silenziosamente il significato, e la bilancia mostrerebbe una differenza di controvalore sotto un'etichetta che promette un prezzo. Commutare la vista non deve muovere di un centesimo né il P&L da carico né la variazione di periodo, ed è un'asserzione della suite.\n\n### Il divieto che i mockup infrangono per didattica\n\n`index.html` e `casi-limite.html` disegnano **barrata** la curva che si otterrebbe con la quantità retroattiva (€ 11.680,00 al posto di € 4.672,00) e la retta piatta a zero del titolo senza carichi. È un espediente efficace su una pagina che spiega, ma in applicazione scriverebbe sullo schermo proprio i valori che i criteri 3 e 4 vietano, e nessuna asserzione potrebbe distinguerli da valori affermati. **In pagina restano la dichiarazione e la ragione, non il fantasma** — la stessa divergenza deliberata già registrata su US-038 per il «−€ 0,00» barrato.\n\n### Fuori perimetro\n\nNessuna modifica al server, allo schema, agli endpoint. Nessuna nuova richiesta alla fonte: come US-037, commutare la vista è **rimisurare un array già in memoria**. Nessuna libreria di grafici. Il grafico del **portafoglio** (EP-006) non è toccato.\n\n---\n\n## Strategia di test\n\nIl peso sta sui test unitari del dominio, perché i quattro criteri sostanziali sono aritmetici prima che visivi: la quantità a una data, l'identità gradino = capitale versato, l'esclusione dei punti anteriori, l'assenza del prezzo medio dal dominio Y. Un difetto di retroattività produce una curva **plausibile**, e nessuna ispezione a occhio lo troverebbe.\n\n- `server/tests/serieValore.test.ts` (nuovo): `quantitaDetenutaA` prima del primo carico, fra due carichi, dopo l'ultimo, esattamente **il giorno** di un carico (estremo incluso) e con più carichi nello stesso giorno; i carichi successivi che **non** retroagiscono, scritto come il caso a due carichi della spec; il gradino che vale esattamente `loadPrice × quantity` e i suoi due capi allo stesso `at` nell'ordine giusto; il primo carico che apre la serie senza gradino; le rilevazioni anteriori al primo carico escluse e contate; il titolo senza carichi che dà serie vuota con la ragione dichiarata; le guardie sui valori non finiti; l'ordine dei punti mai riordinato.\n- `server/tests/serieValore.test.ts`, composizione con il ritaglio: una finestra che **comincia dopo il primo carico** deve applicare la quantità piena (il difetto di retroattività nella sua forma ritagliata).\n- `server/tests/serieTitolo.test.ts` (esteso): `ritagliaSerie` generica conserva i campi del punto valore; `calcolaScalaSerie` con `prezzoMedio: null` esclude la riga dal dominio Y; `ancoraAZero` fissa `yMin = 0` senza rompere l'ampiezza non nulla; **regressione**: con i parametri di prima gli estremi restano identici a quelli di US-036/US-037.\n- Nessun test tocca la rete o l'archivio: tutte le funzioni ricevono `now` come argomento.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts` alla radice, specifiche in `e2e/`, fixture `archivio` obbligatoria — mai `try/finally`).\n**Registrazione video:** solo lo scenario dimostrativo (campo *Dimostra* della spec), salvato con `page.video().saveAs('docs/test-results/US-039/demo-vista-valore.webm')` in un `afterEach` dopo `page.close()`; gli altri scenari girano senza video, in un file sorello (regola della coppia `US-026__*`, perché `launchOptions.slowMo` non è limitabile a un `describe`).\n**Dati:** due nuove costanti in `e2e/support/titoli.ts` — `TITOLO_US_039` e `TITOLO_US_039_VARIANTI`, ISIN mai usati altrove e aggiunti a `ISIN_CON_OSSERVAZIONI_E2E` per la bonifica. Premesse in **giorni indietro da adesso**, mai date fisse: una data scritta a mano invecchia e fra sei mesi la finestra smetterebbe di contenere ciò che il test crede di averci messo. Seme con `fetched_at` di adesso, così la guardia di buona cittadinanza impedisce un recupero reale che aggiungerebbe una rilevazione a oggi.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Il gradino del secondo carico è capitale versato (**demo**) | L'utente apre un portafoglio con un titolo caricato due volte a prezzi e quantità diversi (≈1700 e ≈900 giorni fa, il secondo caso della spec), entra nella scheda, scorre fino al grafico: la vista attiva è **Prezzo unitario** e la riga d'ottone del prezzo medio è tracciata. Sceglie una scala che non è la predefinita, poi commuta su **Valore della posizione**: la scala resta quella scelta, l'asse cambia didascalia, compare il gradino verticale sul secondo carico con la sua quota e il cartellino «capitale versato», e la cifra dichiarata coincide con `prezzo di carico × quantità` del secondo carico letta dalla tabella «Carichi registrati». La riga del prezzo medio è sparita e la legenda dichiara perché. |\n| I carichi successivi non retroagiscono | Con gli stessi carichi, in vista valore si legge il punto immediatamente **precedente** al secondo carico: il suo `data-quantita` è la quantità del solo primo carico e il suo valore è `prezzo × quella` quantità, non `× totalQuantity`. Il punto successivo al gradino porta invece la quantità piena. |\n| Commutare non muove la scala né le metriche | Si sceglie «Ultimo anno», si cattura la stringa del P&L da carico e quella della variazione di periodo, si commuta avanti e indietro fra le due viste: `data-scala` non cambia, il bottone di scala resta premuto, e le due cifre della bilancia sono **le stesse stringhe** di prima (confronto fra testi, non fra numeri equivalenti). |\n| La vista prezzo è quella predefinita e vi si torna | Riaprendo la scheda di un altro titolo la vista riparte da **Prezzo unitario**; commutando indietro dalla vista valore ricompaiono la riga d'ottone e la didascalia del prezzo per quota. |\n| Titolo senza carichi e rilevazioni anteriori | Con un titolo che ha rilevazioni ma nessun carico, la vista valore dichiara «dato non disponibile» invece di tracciare una retta a zero, e il bottone resta selezionabile. Con rilevazioni anteriori al primo carico, il conteggio dei punti esclusi è dichiarato e nessun punto compare a valore zero. |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono in `docs/mockups/US-039/` — `index.html` (vista valore, il gradino dichiarato), `vista-prezzo.html` (la stessa scheda nella vista predefinita) e `casi-limite.html` (rilevazioni anteriori al carico, titolo senza carichi), con `README.md` che ne motiva le scelte.\n\n_Piano generato con ARchetipo Planning — 11 agosto 2026_\n"
