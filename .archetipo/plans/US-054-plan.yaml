  - id: TASK-06
    title: Creare CaricoQuadro.tsx e completare il dispatcher
    description: 'Creare `client/src/views/CaricoQuadro.tsx` che consuma le `CaricoProps` di TASK-02 e rende: il titolo di pagina; i banner di esito come `.avviso.sereno` (carico iscritto, scarico iscritto) e `.avviso.critico` col conteggio delle voci non valide e l''elenco degli errori; il modulo di carico in un `.pannello.modulo-iscrizione` con `.griglia-campi` — ISIN, data di carico, prezzo, quantità, più la denominazione in `.sola-lettura` quando arriva dalla ricerca — e gli errori inline in `.errore-campo-quadro`; il montaggio di `ModuloScaricoQuadro` (TASK-05); le tre `.carta-residuo` del residuo dopo la vendita, ciascuna col valore precedente barrato; la tabella «Titoli iscritti a conto» e la tabella «Registro delle iscrizioni» su `table.dati` dentro `.tabella-scroll`, con `.marca-iscrizione` su ogni riga, `tr.riga-nuova` per l''iscrizione appena fatta, `tr.lotto-esaurito` per il carico consumato, i comandi `.impedito` col `.perche-impedito` accanto, e la rettifica in linea su `.campo-inline` dentro `tr.in-rettifica`; `.placeholder-quadro` per entrambe le tabelle vuote. Usare `importo`, `prezzo` e `quantita` già in uso invece di riscrivere formattatori. Mantenere gli stessi `data-testid` del mastro (elenco nella decisione architetturale 8 del piano). Completare in `PortfolioDetailPage.tsx` il ternario su `useDesign()` per la scheda `carico`, gemello di quelli già presenti per `riepilogo` e `titolo`. Riferimento visivo: `docs/mockups/US-054/carico-scarico.html`.'
