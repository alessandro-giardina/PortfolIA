    title: Estrarre useFormScarico da ModuloScarico
    description: 'Creare `client/src/hooks/useFormScarico.ts` con lo stato, la validazione di forma e il `POST` che oggi vivono dentro `ModuloScarico.tsx`: i quattro campi (`isin`, `saleDate`, `salePrice`, `quantity`) coi loro setter, `erroriCampo`, `errore`, `inCorso`, `validaForma`, `iscrivi`, `ripulisci` e il derivato `scelto` (il titolo scelto oppure il primo dell''elenco). È l''hook che US-049 ha saltato, perche'' ha estratto la logica delle tre pagine e non quella di questo componente. Esportare il tipo condiviso `ScaricoProps = ReturnType<typeof useFormScarico>`. `ModuloScarico.tsx` resta la resa mastro e consuma l''hook: nessun cambiamento di copy, classi, `data-testid` o comportamento osservabile. Attenzione al `return` anticipato per `titoli.length === 0`: l''hook va chiamato sempre (regole di React) e il ramo «senza giacenze» resta nella resa, non nell''hook. Non spostare nell''hook il giudizio sulla disponibilita'' alla data: resta del server.'
