  - id: TASK-05
    title: Creare ModuloScaricoQuadro.tsx
    description: 'Creare `client/src/views/ModuloScaricoQuadro.tsx`, gemella di `ModuloScarico.tsx` sul modello di `CreaPortafoglioQuadro`/`CreatePortfolioForm` (US-053): consuma le `ScaricoProps` di `useFormScarico` (TASK-01) e rende nel linguaggio del quadro il pannello `.modulo-iscrizione.verso-scarico` con `.filo-verso`, la testa con `.pillola.verso-scarico` e `.sigla-modulo`, la `.griglia-campi` coi quattro campi (select del titolo con `.giacenza-scelta` accanto, data, prezzo, quantità in `type="text"`/`inputMode="decimal"` come il mastro — un `type="number"` cambierebbe il trattamento della virgola secondo la localizzazione, e US-048 dipende da quel comportamento), gli errori inline in `.errore-campo-quadro`, il rifiuto del server in `.avviso.critico`, `.nota-modulo` e `.piede-modulo` col bottone `.carminio`. Il ramo «senza giacenze» (`titoli.length === 0`) è reso qui come `.placeholder-quadro`, non nell''hook. Monta `FasciaLifo` **invariato** (già vestito da TASK-03), passandogli `scelto.carichi`, `scelto.vendite` e la data del modulo quando è una data ISO valida: la stessa attribuzione LIFO del mastro, perché è lo stesso componente sugli stessi dati. Mantenere i `data-testid` del mastro (`scarico-titolo`, `scarico-data`, `scarico-prezzo`, `scarico-quantita`, `scarico-giacenza`, `btn-iscrive-scarico`, `scarico-errore`, `scarico-err-*`, `scarico-senza-giacenze`): le due rese non sono mai montate insieme.'
