  - id: TASK-03
    title: Aggiungere la sezione 15h «FasciaLifo» a quadro.css
    description: 'Vestire `FasciaLifo` nel design quadro **senza toccarne il TSX**, come già fatto per `MetricheTitolo` (15g) e `GraficoTitolo` (15f): aggiungere in `client/src/quadro.css`, dentro `:root[data-design=''quadro'']`, la sezione 15h con regole sulle classi mastro del componente — `.fascia-lifo`, `.capo`, `.freccia-lifo`, `.lotti`, `.lotto` (con `.intatto`), `.targa`, `.barra`, `.quota` nelle varianti `consumata`/`residua`/`futura`, `.esito`, `.legenda-lifo` e `.identita-costo`. Riferimento visivo: `docs/mockups/US-054/carico-scarico.html` e la sezione 23 del suo `shared.css` (nel mockup le classi si chiamano `.fascia-lifo-quadro` &c. perché il mockup è autosufficiente; qui le regole vanno sui nomi mastro). Due vincoli verificati a schermo: centrare le quote con flexbox (`display:flex; align-items:center; justify-content:center`) e **non** con `place-items:center` su una griglia — un flex item con `flex-basis: 0` risolve la centratura di griglia contro una larghezza non ancora definita e spinge l''etichetta fuori dalla barra, dove `overflow:hidden` se la mangia (`ledger.css:3221` usa già flexbox); e ancorare ogni regola sotto `.fascia-lifo`, perché nomi come `.capo`, `.targa`, `.barra` ed `.esito` sono troppo generici per stare da soli.'
    type: Impl
    status: DONE
    body: 'Vestire `FasciaLifo` nel design quadro **senza toccarne il TSX**, come già fatto per `MetricheTitolo` (15g) e `GraficoTitolo` (15f): aggiungere in `client/src/quadro.css`, dentro `:root[data-design=''quadro'']`, la sezione 15h con regole sulle classi mastro del componente — `.fascia-lifo`, `.capo`, `.freccia-lifo`, `.lotti`, `.lotto` (con `.intatto`), `.targa`, `.barra`, `.quota` nelle varianti `consumata`/`residua`/`futura`, `.esito`, `.legenda-lifo` e `.identita-costo`. Riferimento visivo: `docs/mockups/US-054/carico-scarico.html` e la sezione 23 del suo `shared.css` (nel mockup le classi si chiamano `.fascia-lifo-quadro` &c. perché il mockup è autosufficiente; qui le regole vanno sui nomi mastro). Due vincoli verificati a schermo: centrare le quote con flexbox (`display:flex; align-items:center; justify-content:center`) e **non** con `place-items:center` su una griglia — un flex item con `flex-basis: 0` risolve la centratura di griglia contro una larghezza non ancora definita e spinge l''etichetta fuori dalla barra, dove `overflow:hidden` se la mangia (`ledger.css:3221` usa già flexbox); e ancorare ogni regola sotto `.fascia-lifo`, perché nomi come `.capo`, `.targa`, `.barra` ed `.esito` sono troppo generici per stare da soli.'
    ref: TASK-03
  - id: TASK-04
    title: Aggiungere la sezione 22 «Carico titoli» a quadro.css
    description: 'Aggiungere in coda a `client/src/quadro.css`, dentro `:root[data-design=''quadro'']`, la sezione 22 con le classi **proprie** della scheda carico nel quadro — nomi nuovi e non riuso di `.riquadro-modulo`/`.riga-modulo`/`.campo`/`.unita` del mastro, sia perché i moduli si biforcano (i due design dispongono i campi in modo diverso) sia perché `.unita` esiste già nel quadro dentro `MetricheTitolo` (`.bilancia .unita`, 15g) e una regola non ancorata la investirebbe. Le classi, come nel mockup: `.griglia-campi`/`.campo-modulo`/`.guscio-campo`/`.unita-campo` (l''unità di misura dentro il campo, accanto alla cifra e non due righe sopra) con `.con-errore` e la variante `.sola-lettura` per la denominazione che arriva dalla ricerca; `.filo-verso` e `.pillola.verso-carico`/`.pillola.verso-scarico` per il verso dell''operazione — l''unica cosa che i due moduli distinguono, in `--accento` per il carico e `--rosso-mastro` per lo scarico; `.sigla-modulo`, `.nota-modulo`, `.piede-modulo`, `.giacenza-scelta`; `.marca-iscrizione` nelle tre varianti `carico`/`scarico`/`esaurito`; `tr.riga-nuova`, `tr.lotto-esaurito`, `tr.in-rettifica`, `.campo-inline`, `.perche-impedito`, `.azioni-riga`, `.bottone.minuto`/`.carminio`/`.impedito`; `.griglia-residuo` e `.carta-residuo` con `.cifra-residuo`/`.prima-dopo`/`.chiuso`. Riusare senza aggiungere: `.pannello`/`.testa-pannello`/`.corpo-pannello`, `.avviso` con `.sereno` e `.critico`, `table.dati` con `.voce-titolo`/`.cifra`/`tfoot`, `.placeholder-quadro`, `.pillola`, `.et-sezione`, `.tabella-scroll` (la tabella del registro ha otto colonne e deve poter scorrere). Riferimento visivo: `docs/mockups/US-054/carico-scarico.html`, sezioni 22 e 24 del suo `shared.css`.'
