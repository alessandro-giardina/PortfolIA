  - id: TASK-08
    title: Test E2E — carico e scarico nel quadro
    description: 'Dichiarare in `e2e/support/titoli.ts` le chiavi `TITOLO_US_054` e `TITOLO_US_054_DEMO`, ciascuna col proprio `file` proprietario (entrambi i file iscrivono posizioni sull''ISIN, quindi nessuno dei due è un `lettoDa`: la premessa del prezzo va costruita, ed è il difetto che US-040 ha bonificato). Creare `e2e/US-054__quadro-carico-scarico.spec.ts` con gli scenari funzionali: parità delle validazioni fra i due design sullo stesso input non valido (con nessuna richiesta al server), precompilazione da «Aggiungi a portafoglio» e conservazione di ciò che è digitato attraverso la commutazione di design, scarico parziale con le tre carte del residuo e la riga marcata nel registro, la fascia dei lotti nel quadro con l''identità `costo attribuito + costo residuo = costo dei carichi`, il lotto dichiarato «non attribuibile» con una data di vendita anteriore, il portafoglio senza giacenze, rettifica e rimozione di un carico non consumato più i comandi impediti col «perché» su un carico consumato, le due tabelle vuote su un portafoglio nuovo, e la verifica che la sezione «Posizioni chiuse» sia resa nel quadro (criterio 4, già consegnato da US-051 — verificare, non duplicare). Creare `e2e/US-054__quadro-carico-scarico-demo.spec.ts` col solo scenario dimostrativo (commutazione a «Quadro strumenti», compilazione del modulo di carico, conferma e riga nuova nel registro), `test.use({ video, slowMo })` a livello di file e video salvato in `docs/test-results/US-054/` da un `afterEach` dopo `page.close()`. Usare il fixture `archivio` per ogni dato di test, mai `try/finally`. Eseguire l''intera suite e verificare che i sedici file spec del mastro elencati nei rischi del piano passino senza modifiche ai loro test.'
