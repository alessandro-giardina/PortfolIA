schema: archetipo/plan/v2
spec_code: US-054
body: "# US-054: Quadro strumenti — iscrizione carichi e scarichi — Piano di implementazione\n\n**Generato da:** Team di Pianificazione ARchetipo\n**Data:** 2026-08-20\n\n---\n\n## Spec\n\n**Epica:** EP-009 — Direzione visiva commutabile\n**Priorità:** MEDIUM | **Punti:** 5\n**Bloccato da:** US-050 (`DONE`) — anche US-049, da cui dipende US-050, è `DONE`.\n\n**User Story**\nCome utente di PortfolIA che preferisce il design «Quadro strumenti», voglio che i moduli di iscrizione dei carichi e di registrazione degli scarichi siano disponibili nel nuovo design, così che le operazioni di carico e vendita siano leggibili e utilizzabili nella stessa veste delle altre schermate.\n\n**Criteri di accettazione**\n- [ ] Nel design «quadro», il modulo di iscrizione carico mostra campi ISIN, data di carico, prezzo di carico e quantità nella veste del nuovo design\n- [ ] Il registro cronologico dei carichi e degli scarichi è leggibile e coerente con il design\n- [ ] Il modulo scarico (`ModuloScarico`) è reso nel design «quadro» con la stessa struttura funzionale\n- [ ] La sezione posizioni chiuse e la fascia LIFO (`FasciaLifo`) sono rese nel design «quadro»\n- [ ] Le validazioni dei campi, i messaggi di errore e di conferma funzionano come nel design «mastro»\n- [ ] I dati provengono dagli stessi hook estratti in US-049\n\n---\n\n## Soluzione tecnica\n\nQuinta applicazione del meccanismo di US-051/052/053/055, sulla schermata che finora ne è rimasta fuori — e la più grande: la scheda «Carico titoli» vive **inline** in `PortfolioDetailPage.tsx`, dove occupa circa 570 delle sue 855 righe. Diventa la coppia `CaricoMastro`/`CaricoQuadro`, e la pagina resta il dispatcher sottile che già è per la scheda Riepilogo e per la scheda Titolo. Nessun tocco al server, nessun endpoint nuovo, nessuna seconda interpretazione dei dati.\n\nLa sola decisione veramente aperta è che fare dei due componenti condivisi che questa scheda monta — `ModuloScarico` e `FasciaLifo` — e la risposta non va inventata: il progetto ha già due precedenti distinti, e questo piano segue entrambi.\n\n### Decisioni architetturali\n\n1. **I moduli si biforcano, i diagrammi si ristilizzano.** In EP-009 esistono due precedenti, ed è la *natura* del componente a scegliere quale si applica. I **moduli** si sono biforcati in una vista quadro che condivide la logica: `CreaPortafoglioQuadro.tsx` è la gemella di `CreatePortfolioForm.tsx`, entrambe su `useCreaPortafoglio` (US-053). I **componenti di sola resa** sono rimasti condivisi e stilizzati in `quadro.css`, sezione 15: `MetricheTitolo`, `GraficoTitolo`, `AggiornaObsoleti`, `PortfolioSelectDialog`. Un modulo è fatto di etichette, unità di misura e disposizione dei campi — cose che i due design dicono in modo diverso; un diagramma è una figura, e forkarlo significherebbe due disegni della stessa attribuzione, cioè il primo posto in cui divergere in silenzio. Quindi: `ModuloScarico` si biforca, `FasciaLifo` no.\n\n2. **`useFormScarico`: l'hook che US-049 ha saltato.** `ModuloScarico.tsx` è oggi l'unico modulo dell'app che tiene ancora dentro di sé stato, validazione di forma e `POST` — US-049 ha estratto gli hook delle tre *pagine*, non di questo componente. Perché la vista quadro possa esistere senza duplicare il validatore (criterio 5: «le validazioni funzionano come nel mastro»), lo stato va prima estratto in `client/src/hooks/useFormScarico.ts`: i quattro campi, `erroriCampo`, `errore`, `inCorso`, `validaForma`, `iscrivi`, `ripulisci` e il derivato `scelto` (il titolo scelto, o il primo dell'elenco). `ModuloScarico.tsx` resta la resa mastro e non cambia di un pixel; `ModuloScaricoQuadro.tsx` è la gemella. Un solo validatore, un solo `fetch`, due rese — che è esattamente ciò che US-049 esiste per rendere possibile.\n\n   Nota su ciò che l'hook **non** deve fare: la disponibilità alla data resta un giudizio del server (l'attribuzione LIFO dipende da tutte le vendite già iscritte). L'estrazione sposta il codice, non la responsabilità.\n\n3. **`FasciaLifo` resta un componente solo, ristilizzato.** Nessuna riga di TSX cambia. Le sue classi mastro (`.fascia-lifo`, `.capo`, `.freccia-lifo`, `.lotti`, `.lotto`, `.targa`, `.barra`, `.quota` con `consumata`/`residua`/`futura`, `.esito`, `.legenda-lifo`) vengono vestite sotto `:root[data-design='quadro']` nella sezione 15h — la stessa tecnica con cui `MetricheTitolo` è diventata la bilancia a due piatti del quadro (sezione 15g). Il criterio non è riscritto in nessuno dei due design: `rigiocaRegistro` è la funzione pura che il server usa per iscrivere una vendita, e la fascia la legge sia nel mastro sia nel quadro.\n\n   Riferimento visivo: `docs/mockups/US-054/carico-scarico.html`, sezione 23 del suo `shared.css` — con l'avvertenza che nel mockup le classi si chiamano `.fascia-lifo-quadro` &c. perché il mockup è autosufficiente: in produzione le regole vanno sui nomi mastro sopra elencati. **Un dettaglio verificato a schermo durante il mockup:** le quote dentro la barra vanno centrate con flexbox (`display:flex; justify-content:center`) e non con `place-items: center` su una griglia — un item flessibile con `flex-basis: 0` risolve la centratura di griglia contro una larghezza non ancora definita e spinge l'etichetta fuori dalla barra, dove `overflow: hidden` se la mangia. `ledger.css` (riga 3221) usa già flexbox: il quadro faccia lo stesso.\n\n4. **Gli hook restano nella pagina; le viste ricevono props.** `usePortafoglio`, `useDatiPortafoglio`, `useFormCarico` e `useModificaPosizione` sono già chiamati in `PortfolioDetailPage` e ci restano: il ternario sul design scambia la *vista*, non il proprietario dello stato. Non è una preferenza di stile, è un requisito funzionale — commutare design con il modulo mezzo compilato non deve azzerarlo, e `useFormCarico` porta un `useEffect` di mount che consuma il `prefill` di navigazione con `window.history.replaceState`: un rimontaggio lo perderebbe per sempre, rompendo US-025. Il tipo condiviso `CaricoProps` raggruppa i quattro oggetti restituiti (`carico`, `dati`, `modifica`, più `id`/`ultimaVendita`) invece di quaranta props sciolte, sul modello di `RicercaProps` in US-055.\n\n5. **Cosa va in `CaricoMastro` e cosa nella pagina.** Si spostano verbatim in `client/src/views/CaricoMastro.tsx`: i banner (`.avviso-successo` con `.timbro-ok`, `.banner-errore` con `.timbro-ko`, `submit-errore`), le intestazioni `.sezione-titolo`, il `.riquadro-modulo` del carico con i suoi quattro `.riga-modulo`, il montaggio di `ModuloScarico`, il `.riquadro-residuo`, la tabella `Titoli iscritti a conto`, la tabella `Registro delle iscrizioni` con le righe di rettifica in linea di US-013, e i `.divisore-sezione`. Restano nella pagina `<Guscio>`, `linguette`, `registro`, gli stati `loading`/`error`/`notFound` e il ternario delle tre schede: è ciò che i due design condividono.\n\n6. **La sezione «Posizioni chiuse» è già consegnata — va verificata, non riscritta.** Il criterio 4 accorpa due cose in stati diversi: `RiepilogoQuadro.tsx` rende già la sezione delle posizioni chiuse dal design quadro (`tabella-posizioni-chiuse`, riga 401 e seguenti, US-051/TASK-05), mentre `FasciaLifo` nel quadro non esiste ancora. US-054 aggiunge quindi solo la fascia, e chiude il criterio con uno scenario E2E che *verifica* la resa delle posizioni chiuse invece di duplicarla. Ricostruirla qui creerebbe una seconda tabella per gli stessi dati.\n\n7. **Sezione 22 di `quadro.css`, con nomi propri.** Poiché i moduli si biforcano (decisione 1), la vista quadro non eredita `.riquadro-modulo`/`.riga-modulo`/`.campo`/`.unita` e la sezione 22 può usare nomi propri — che è anche l'unico modo sicuro: `.unita` esiste già nel quadro dentro `MetricheTitolo` (`.bilancia .unita`, sezione 15g), e una regola `.unita` non ancorata la investirebbe. Le classi nuove sono quelle del mockup: `.griglia-campi`/`.campo-modulo`/`.guscio-campo`/`.unita-campo` per i due moduli, `.filo-verso` e `.pillola.verso-carico|verso-scarico` per il verso dell'operazione, `.nota-modulo`/`.piede-modulo`, `.marca-iscrizione` con le tre varianti, `tr.riga-nuova`/`tr.lotto-esaurito`/`tr.in-rettifica`, `.campo-inline`, `.perche-impedito`, `.azioni-riga`, `.bottone.minuto|carminio|impedito`, e `.griglia-residuo`/`.carta-residuo` per il residuo dopo la vendita.\n\n   Riusate senza aggiunte: `.pannello`/`.testa-pannello`/`.corpo-pannello` (sezione 6), `.avviso` con `.sereno` e `.critico` (10), `table.dati` con `.voce-titolo`/`.cifra`/`tfoot` (11), `.placeholder-quadro` (16), `.pillola` (9), `.et-sezione` (5), `.tabella-scroll` — la tabella del registro ha otto colonne e deve poter scorrere.\n\n8. **Gli stessi `data-testid` nelle due viste.** Le due rese non sono mai montate insieme, quindi riusare gli stessi identificatori non crea ambiguità e rende gli scenari di parità scrivibili senza un secondo vocabolario: `input-isin`, `input-data`, `input-prezzo`, `input-quantita`, `btn-iscrive`, `err-*`, `banner-errore`, `avviso-successo`, `scarico-titolo`, `scarico-data`, `scarico-prezzo`, `scarico-quantita`, `btn-iscrive-scarico`, `scarico-giacenza`, `fascia-lifo`, `lotto-*`, `esito-lotto-*`, `identita-costo`, `tabella-posizioni`, `tabella-registro-carichi`, `posizione-*`, `scarico-*`, `residuo-lotto-*`, `btn-modifica-*`, `btn-rimuovi-*`, `perche-impedito-*`, `riquadro-residuo`, `residuo-quantita`, `residuo-prezzo-medio`, `residuo-controvalore`. È la stessa scelta di `btn-aggiungi-portafoglio` in US-055 e di `tabella-posizioni-chiuse` in US-051.\n\n### Rischi e mitigazioni\n\n- **Il rischio principale è l'estrazione, non la vista nuova.** Sedici file spec del design mastro selezionano sui `data-testid` della scheda carico/scarico: US-011, US-012, US-013, US-025, US-026 (×2), US-027, US-031, US-033 (×2), US-042 (×2), US-046 (×2), US-047, US-048. TASK-01 e TASK-02 devono essere spostamenti **verbatim**: stessi testi, stesse classi, stessi `data-testid`, stesso ordine dei nodi. Nessun rinominare e nessun ritoccare copy in quei due task.\n- **`ModuloScarico` ha un `return` anticipato.** Con `titoli.length === 0` il componente esce prima di dichiarare gli hook di stato — comportamento che l'estrazione deve preservare spostando il ramo «senza giacenze» nella *resa*, non nell'hook: un `return` prima di `useState` non è replicabile in un hook senza violare le regole di React. `useFormScarico` va quindi chiamato sempre, e sono le due viste a decidere se mostrare il modulo o il messaggio.\n- **Divergenza silenziosa fra le due rese dei moduli.** Mitigata dalle decisioni 2 e 4: un solo `useFormCarico`, un solo `useFormScarico`, un solo `rigiocaRegistro`. Il criterio 5 si verifica in E2E confrontando i messaggi di errore prodotti dai due design sullo stesso input non valido.\n- **La quantità frazionaria.** US-047 e US-048 hanno stabilito che carico e scarico ammettono sei decimali, con la virgola normalizzata a punto. La vista quadro usa `type=\"text\"` con `inputMode=\"decimal\"` per la quantità, come il mastro: un `type=\"number\"` cambierebbe il comportamento della virgola secondo la localizzazione del browser.\n\n---\n\n## Strategia di test\n\nLa spec è interamente UI e interazione: la strategia E2E è obbligatoria e copre da sola i criteri di accettazione. Nessuna riga di server cambia, quindi nessun test unitario nuovo lato server; nessuna logica pura nuova lato client, quindi nessun test Vitest nuovo in `client/` — l'estrazione di `useFormScarico` sposta codice già coperto dagli scenari E2E di US-042/US-048. `npm run check` resta il cancello di non regressione, `check:chiavi` compreso.\n\n### Test E2E\n\n**Framework:** Playwright (già in uso nel progetto).\n**Video demo:** registrato per il solo scenario dimostrativo, salvato in `docs/test-results/US-054/`. Lo scenario demo vive in un file separato perché `launchOptions` (`slowMo`) non è scopabile a un `describe` — stessa coppia di file di US-051/052/053/055.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Carico iscritto nel quadro (demo) | Dalla scheda «Carico titoli» in design mastro l'utente commuta su «Quadro strumenti» senza ricaricare, compila ISIN, data, prezzo e quantità nella veste nuova, invia, e vede il banner di conferma e la riga nuova comparire nel registro |\n| Parità delle validazioni | Sullo stesso input non valido (ISIN corto, prezzo negativo, quantità a sette decimali) i due design mostrano gli stessi tre messaggi di errore, inline e nel sommario, e nessuna richiesta parte verso il server |\n| Precompilazione da ricerca titoli | Da «Aggiungi a portafoglio» (US-025) in design quadro, la scheda carico si apre con ISIN e prezzo precompilati e la denominazione in sola lettura; commutare design a modulo compilato non perde ciò che è stato digitato |\n| Scarico iscritto nel quadro | Con una giacenza a registro, l'utente scarica una parte delle quote e vede il banner di scarico, le tre carte del residuo con il valore precedente barrato, e la riga di scarico marcata nel registro |\n| La fascia dei lotti nel quadro | La fascia è resa nella veste del quadro con i lotti dal più recente al più antico, le quote consumate e residue nella stessa proporzione del mastro, e l'identità `costo attribuito + costo residuo = costo dei carichi` |\n| Lotto fuori data | Scritta nel modulo una data di vendita anteriore a un carico, quel lotto è dichiarato «non attribuibile» invece di sparire dalla fascia |\n| Registro senza giacenze | Su un portafoglio senza quantità residua, il quadro dichiara che non c'è nulla da scaricare invece di mostrare campi inerti |\n| Rettifica e rimozione nel quadro | La riga di un carico non consumato si rettifica dentro la tabella (data, prezzo, quantità) e si rimuove; la riga di un carico consumato da una vendita mostra i comandi impediti e il «perché» accanto a essi |\n| Posizioni chiuse (verifica US-051) | La sezione delle posizioni chiuse è resa nel design quadro nella scheda Riepilogo — verifica del criterio 4, che US-051 ha già consegnato: nessuna seconda tabella per gli stessi dati |\n| Registro e tabelle vuote | Su un portafoglio nuovo, entrambe le tabelle mostrano il placeholder del quadro invece di un'intestazione senza righe |\n| Non regressione mastro | I sedici file spec elencati fra i rischi passano senza modifiche ai test: lo spostamento del markup in `CaricoMastro.tsx` e l'estrazione di `useFormScarico` non cambiano nulla di osservabile |\n\n### Registro delle chiavi E2E\n\nI due nuovi file spec richiedono **una chiave propria ciascuno** in `e2e/support/titoli.ts` — `TITOLO_US_054` per il file funzionale e `TITOLO_US_054_DEMO` per quello dimostrativo — con il campo `file` che ne dichiara il proprietario. Nessuna chiave esistente va condivisa: entrambi i file iscrivono posizioni sugli ISIN, e iscrivere una posizione **non** è una lettura (il riepilogo ne rileva il prezzo con una LEFT JOIN, quindi la premessa esiste e va costruita — è il difetto che US-040 ha bonificato). Il seme fresco serve anche a evitare che il passaggio dalla ricerca paghi il recupero reale da 8-12 secondi. `npm run check:chiavi` verifica entrambe le regole.\n\n### Mockup di riferimento\n\n\U0001F3A8 Mockup generato in `docs/mockups/US-054/` — `carico-scarico.html` con i sette stati della schermata (registro vuoto, precompilato da ricerca, modulo rifiutato, carico iscritto, scarico iscritto, rettifica in linea, senza giacenze) ispezionabili da un commutatore, più `shared.css`/`app.js`/`README.md` propri, coerenti con `docs/mockups/US-051/`, `US-052/`, `US-053/` e `US-055/`. Le cifre del mockup sono aritmeticamente coerenti (tre carichi di 12+20+18 quote, una vendita di 7 attribuita LIFO al lotto più recente, `72,87 + 432,21 = 505,08`) perché chi lo legge possa rifare i conti.\n\nAttenzione a due differenze di numerazione fra mockup e produzione, volute: il mockup raccoglie tutto in sezioni 22-24 perché è autosufficiente, mentre `quadro.css` mette `FasciaLifo` in **15h** (dove vivono i componenti condivisi col mastro) e il resto in **22**.\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-054/`\n\n_Piano generato via ARchetipo Planning — 2026-08-20_"
