spec_code: US-052
body: "# US-052: Quadro strumenti — scheda titolo — Piano di implementazione\n\n**Prodotto da:** squadra di pianificazione ARchetipo\n**Data:** 20 ago 2026\n\n---\n\n## Specifica\n\n**Epica:** EP-009 — Direzione visiva commutabile\n**Priorità:** MEDIUM | **Punti:** 5 | **Bloccato da:** US-050\n\n**User Story**\nCome utente di PortfolIA che preferisce il design «Quadro strumenti»,\nvoglio che la scheda di dettaglio di un titolo sia disponibile nel nuovo design,\ncosì che posizione, grafico, metriche, carichi, vendite e storico prezzi siano leggibili nella stessa veste del riepilogo.\n\n**Criteri di accettazione**\n- Nel design «quadro», la scheda titolo mostra posizione, P&L latente, P&L realizzato, e indicazione della quantità residua dopo le vendite\n- Il grafico del titolo (`GraficoTitolo`) è reso con colori e tipografia coerenti al design «quadro», senza duplicare il componente\n- Le due viste (prezzo unitario / valore della posizione) e le quattro scale temporali funzionano come nel design «mastro»\n- Carichi registrati, vendite registrate, fascia LIFO e storico prezzi sono visibili e coerenti con il mockup\n- La navigazione di ritorno al riepilogo funziona dalla barra laterale\n- I `data-testid` dei punti di verifica principali sono presenti anche nel markup del design «quadro»\n- Commutando fra «mastro» e «quadro» i dati restano invariati\n\n### Nota su un criterio rivisto in pianificazione\n\nIl criterio «carichi registrati, **vendite registrate, fascia LIFO** e storico prezzi» non trova corrispondenza né nel mastro attuale né nel mockup approvato: `SchedaTitolo.tsx` (mastro) non mostra oggi alcuna tabella delle vendite né la fascia LIFO in lettura — `FasciaLifo.tsx` compare solo dentro `ModuloScarico.tsx` (scheda «Carico titoli», contestuale a una vendita da registrare), e il mockup `docs/mockups/US-052/scheda-titolo.html` mostra solo «Carichi registrati» e «Storico prezzi». Il P&L realizzato, invece, **è** già visibile in `PositionDetail` e in questa pianificazione trova posto nella card KPI «Differenza» come nel mastro (che rimanda al riquadro sotto il grafico).\n\nConfrontata con l'utente in fase di pianificazione, la decisione è di **non pianificare** le due sotto-voci «vendite registrate» e «fascia LIFO» in questa spec: si tratta di una formulazione imprecisa dei criteri, non di un requisito da onorare a ogni costo. Il piano copre quindi fedelmente ciò che mastro e mockup mostrano oggi — posizione a conto (con P&L da carico e la quantità residua che il mastro già esprime tramite `totalQuantity`), grafico a due viste/quattro scale, anagrafica, carichi registrati, storico prezzi — lasciando **vendite registrate** e **fascia LIFO** come lettura di sola consultazione a una eventuale story futura, dove si potrebbe anche decidere di estenderle al mastro per mantenere la parità fra i due design.\n\n---\n\n## Soluzione tecnica\n\nL'epica EP-009 ha già posato l'infrastruttura di commutazione con US-050 (attributo `data-design`, `useDesign`) e US-051 (`Guscio`/`Foglio`/`Quadro`, linguette come dati, `quadro.css` con token e componenti condivisi ridipinti). US-052 la estende alla scheda titolo seguendo esattamente lo stesso schema — nessuna nuova architettura, solo la sua terza applicazione.\n\n### Decisioni architetturali\n\n1. **Il dato si solleva in un hook, la vista si sdoppia.** A differenza del riepilogo (che riceveva già i dati calcolati da `useDatiPortafoglio`), `SchedaTitolo.tsx` oggi possiede **tutto** il proprio stato — lettura del dettaglio, richiesta di aggiornamento, guardia di conferma, esito — internamente. Prima di potersi sdoppiare in due rese va estratto in `client/src/hooks/useSchedaTitolo.ts`, sullo stesso modello di `usePortafoglio`/`useDatiPortafoglio`: riceve `portfolioId`, `isin`, `onDatiAggiornati`, restituisce `{ detail, loading, error, esito, conferma, appenaAggiornato, aggiornaDati }`. `SchedaTitolo.tsx` (mastro) diventa un consumatore puro dell'hook, a markup **invariato** — è un puro spostamento, verificabile dalla suite E2E esistente (US-018, US-030, US-036÷039, US-042) che deve restare verde senza toccare un solo test.\n\n2. **`SchedaTitoloQuadro.tsx` nasce come vista gemella, non come ramo dentro `SchedaTitolo`.** Sul modello di `RiepilogoMastro`/`RiepilogoQuadro`, nasce `client/src/views/SchedaTitoloQuadro.tsx` che consuma lo stesso `useSchedaTitolo` e rende la struttura del mockup `docs/mockups/US-052/scheda-titolo.html`. `PortfolioDetailPage.tsx` sceglie fra le due con lo stesso ternario `design === 'quadro' ? ... : ...` già in uso per il riepilogo (righe ~206-258) — nessun nuovo punto di scelta nell'app.\n\n3. **`GraficoTitolo` e `MetricheTitolo` si ridipingono, non si duplicano.** Esattamente come `GraficoPortafoglio`/`MetrichePortafoglio` in US-051/TASK-07: nessun `.tsx` viene toccato, tutta la differenza sta in `quadro.css`. Buona parte del vocabolario CSS del grafico (`.barra-scala`, `.scala-temporale`, `.tracciato .*`, `.grafico-cornice`, `.dichiarazione-vuota`, `.avviso-rado`) è **già** stata scritta da US-051/TASK-07 perché `GraficoPortafoglio` e `GraficoTitolo` condividono i nomi di classe. Restano scoperte le classi che solo `GraficoTitolo` porta (il commutatore di vista `.barra-vista`/`.commutatore-vista`/`.ordinata-attiva`/`.sigillo-indipendenza`, US-039) e l'intera «bilancia» delle due misure di `MetricheTitolo` (`.bilancia`, `.piatto`, `.fulcro`, e tutto ciò che vive dentro un piatto). La task dedicata parte da un grep dei nomi di classe usati nei due componenti, non da un elenco scritto a mano in fase di piano — lo stesso metodo di US-051/TASK-07.\n\n4. **Le card KPI e le tabelle riusano CSS già scritto da US-051, non lo duplicano.** «Posizione a conto» del mockup è, nel markup, la stessa `griglia-kpi`/`carta-kpi` già stilata da US-051/TASK-04; «Carichi registrati» e «Storico prezzi» sono `table.dati` dentro `.pannello`, anch'essi già pronti. Mancano invece: l'intestazione del titolo (`.testa-titolo`, `.stemma`, `.anagrafe`, `.marcature`, `.prezzo-vivo`), la griglia dell'anagrafica (`.griglia-def`/`.voce-def`), le varianti di pillola per ISIN/fonte, e un contenitore a due colonne per affiancare Carichi e Storico — che nel mockup si chiama `.griglia-doppia`, la stessa classe che US-051/TASK-14 aveva **rimosso** da `quadro.css` perché nessun `.tsx` la referenziava più dopo il riordino del riepilogo. Questa spec la ripristina per un uso reale e distinto: non è una regressione di quella rework, è un nuovo consumatore della stessa idea di layout.\n\n5. **Le due classi di segno che qui contano sono `guadagno`/`perdita`, non `positivo`/`negativo`.** `RiepilogoQuadro.tsx` ha una propria funzione locale che produce `positivo`/`negativo`; `SchedaTitolo.tsx`, `MetricheTitolo.tsx` e — di conseguenza — `SchedaTitoloQuadro.tsx` chiamano invece `classeSegno` (`domain/formattazione.ts`), che produce `guadagno`/`perdita`. Sono famiglie di classi indipendenti: `quadro.css` oggi definisce `guadagno`/`perdita` solo dentro selettori specifici di `QuadroRisultato` (`.cifra-pl.guadagno`, `.percentuale.guadagno`, …). Le nuove regole per la card «Differenza» e per i due piatti della bilancia vanno aggiunte accanto, non sostituendo le prime.\n\n6. **La riga di provenienza e il comando «Aggiorna dati» restano nel corpo della pagina, non salgono nella testata condivisa.** Il mockup li disegna come pillola + bottone nella `.testata` del guscio, ma `Quadro.tsx`/`Guscio.tsx` non hanno oggi uno slot per azioni specifiche di pagina, e aprirne uno per questa sola spec sarebbe un'estensione dell'infrastruttura condivisa non richiesta dai criteri. La riga di provenienza (`riga-fonte`/`fonte-dato`), l'esito dell'aggiornamento e la guardia di conferma restano quindi nel contenuto, appena sotto l'intestazione del titolo — stessa posizione relativa del mastro, stessi `data-testid`. È una scelta dichiarata, non un'omissione.\n\n7. **Parità dei `data-testid`, non invenzione — stesso principio di US-051/TASK-05.** `SchedaTitoloQuadro` porta gli stessi identificatori del mastro: `scheda-titolo`, `dettaglio-quantita`, `dettaglio-prezzo-medio`, `dettaglio-valore-attuale`, `dettaglio-differenza`, `segna-rimando-differenza`, `anagrafica-titolo`, `fonte-dato`, `btn-aggiorna-dati`, `esito-aggiornamento`, `avviso-conferma-aggiornamento`, `istante-rilevazione`, `tabella-carichi-titolo`, `carico-titolo-${id}`, `tabella-storico-prezzi`, `osservazione-${indice}`, `storico-prezzi-vuoto`, `avviso-storico-rado`, `nota-storico-prezzi`, `sezione-grafico-titolo` — più quelli che `GraficoTitolo`/`MetricheTitolo` portano già di per sé, essendo lo stesso componente. È ciò che rende verificabile per costruzione il criterio «commutando i dati restano invariati».\n\n### Rischi\n\n- **Variabili/classi orfane nel grafico.** Stesso rischio già noto da US-051: una `var(--x)` o una regola di classe dimenticata in `quadro.css` non dà errore, il colore semplicemente sparisce. Mitigazione: procedere per grep esaustivo (TASK-03), verificare a video.\n- **`.griglia-doppia` ripristinata a metà.** Va riletta la rework di US-051/TASK-14 prima di ripristinare la regola, per capire se il breakpoint e i vicini selettori (`.griglia-doppia +` combinatori) vanno riscritti da zero o solo riattivati.\n- **Deriva dei `data-testid`.** Con due componenti scritti a mano (mastro e quadro) che devono restare identici sui punti di verifica, un rinominamento in uno dei due senza l'altro passerebbe inosservato a lint/typecheck: la rete di sicurezza è solo il test E2E comparativo di TASK-08.\n\n---\n\n## Strategia di test\n\nCome per US-051, la superficie di verifica di questa spec è interamente client: Playwright come test portante, `npm run check` come cancello di lint/typecheck.\n\n- **Verifica comparativa**, non descrittiva: lo stesso titolo, letto nei due design, deve dare le stesse cifre sugli stessi `data-testid` — unico modo di provare «i dati restano invariati» senza fidarsi a parole dell'architettura.\n- **Nessun test esistente viene modificato**: il design predefinito resta `mastro`, quindi la suite attuale (US-018, US-030, US-036÷039, US-042) resta il controllo di non regressione così com'è.\n- **Chiavi ISIN proprie del file** in `e2e/support/titoli.ts` (regola R1): il file di questa spec non eredita le chiavi di US-051 né di alcuna spec di dettaglio titolo esistente.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright\n**Registrazione video:** solo lo scenario dimostrativo, in `docs/test-results/US-052/`\n\n| Scenario | Flusso utente |\n|---|---|\n| Stessi dati, veste diversa **(demo, con video)** | L'utente apre un titolo con più carichi e più rilevazioni dal riepilogo in design mastro, legge quantità/prezzo medio/valore attuale/differenza e i valori del grafico; commuta su «Quadro strumenti» senza ricaricare; rilegge gli stessi `data-testid` nella scheda titolo quadro: le stringhe coincidono carattere per carattere |\n| Vista e scale del grafico | Nel design quadro l'utente commuta tra «Prezzo unitario» e «Valore della posizione» e fra le quattro scale temporali: il grafico (`svg.tracciato`, `data-punti`, `data-copertura`) e le due misure della bilancia rispondono come nel mastro, a parità di titolo |\n| Anagrafica, carichi, storico | Il pannello anagrafica mostra tutti i campi ufficiali dichiarati dalla fonte; le tabelle «Carichi registrati» e «Storico prezzi» mostrano le stesse righe del mastro, affiancate secondo il mockup |\n| Aggiornamento dati | Dalla riga di provenienza l'utente chiede l'aggiornamento: gli stati «in corso» / «riuscito» / «fallito» e la guardia di conferma compaiono con lo stesso testo del mastro |\n| Ritorno al riepilogo | Dalla barra laterale l'utente apre «Riepilogo»: il guscio quadro resta montato e la scheda torna alla vista di riepilogo |\n\n**Ripartizione in file:**\n\n- `e2e/US-052__quadro-scheda-titolo.spec.ts` — tutti gli scenari tranne la demo\n- `e2e/US-052__quadro-scheda-titolo-demo.spec.ts` — lo scenario «stessi dati, veste diversa», con `test.use({ launchOptions: { slowMo } })` e `page.video().saveAs('docs/test-results/US-052/...')` in `afterEach`, dopo `page.close()`\n\n---\n\n> \U0001F3A8 Il mockup di questa spec è già disponibile in `docs/mockups/US-052/` (`scheda-titolo.html` + `shared.css` + `app.js`), preparato in una sessione precedente insieme a quello di US-051. Non viene rigenerato da questa pianificazione. Il mockup non mostra le sezioni «vendite registrate» e «fascia LIFO» — coerentemente con la nota sui criteri d'accettazione qui sopra, il piano non le introduce.\n\n_Piano prodotto da ARchetipo Planning — 20 ago 2026_\n"
tasks:
  - id: TASK-01
    title: 'Estrarre useSchedaTitolo: il dato si solleva, il mastro resta invariato'
    description: |-
      Creare `client/src/hooks/useSchedaTitolo.ts` estraendo da `client/src/components/SchedaTitolo.tsx` tutto lo stato oggi interno al componente: lettura del dettaglio (`leggiDettaglio`, l'effetto che lo richiama a ogni cambio di `isin`), la richiesta di aggiornamento (`aggiornaDati`, con i suoi rami non-trovato/fonte-muta/errore/guardia/riuscito) e gli stati `esito`/`conferma`/`appenaAggiornato`. L'hook riceve `{ portfolioId, isin, onDatiAggiornati }` e restituisce `{ detail, loading, error, esito, conferma, appenaAggiornato, aggiornaDati }` — la stessa forma che `SchedaTitolo.tsx` già usa internamente, solo spostata.

      Rifattorizzare `SchedaTitolo.tsx` perché consumi l'hook: **nessuna riga di JSX o di logica di rendering cambia**, cambia solo la provenienza dello stato. È un puro spostamento, come l'estrazione di `RiepilogoMastro` in US-051/TASK-01.

      Verifica: la suite E2E esistente (US-018, US-030, US-036, US-037, US-038, US-039, US-042 e ogni altro test che tocchi la scheda titolo) resta verde senza modificare un solo test.
