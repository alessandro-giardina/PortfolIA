  - id: TASK-02
    title: quadro.css — intestazione del titolo, anagrafica, layout a due colonne
    description: |-
      Aggiungere a `client/src/quadro.css` le regole per ciò che il mockup `docs/mockups/US-052/scheda-titolo.html` mostra e che US-051 non ha ancora scritto: `.testa-titolo` (con `.stemma`, `.anagrafe`, `.marcature`, `.prezzo-vivo`), le varianti di pillola per ISIN e fonte (`.pillola.isin`, `.pillola.fonte`, `.pillola.di-backup`), la griglia dell'anagrafica ufficiale (`.griglia-def`/`.voce-def`), e un contenitore a due colonne per affiancare «Carichi registrati» e «Storico prezzi» — nel mockup è `.griglia-doppia`, la stessa classe che US-051/TASK-14 ha rimosso da questo file perché nessun `.tsx` la referenziava più: va riletta quella rework (in `.archetipo/plans/US-051-plan.yaml`, TASK-14) prima di ripristinarla, per riprendere lo stesso breakpoint verso il layout a una colonna sotto ~640px.

      Estendere inoltre `.carta-kpi .cifra`/`.piede` con le classi `guadagno`/`perdita` prodotte da `classeSegno` (`domain/formattazione.ts`): oggi `quadro.css` definisce quella coppia di classi solo dentro selettori di `QuadroRisultato`, mentre la card «Differenza» della scheda titolo (TASK-04) e la bilancia delle metriche (TASK-03) ne hanno bisogno a livello generico.
