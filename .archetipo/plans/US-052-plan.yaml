  - id: TASK-04
    title: SchedaTitoloQuadro — intestazione, posizione a conto, provenienza
    description: |-
      Creare `client/src/views/SchedaTitoloQuadro.tsx`, che consuma `useSchedaTitolo` (TASK-01) esattamente come `SchedaTitolo.tsx` e non ricalcola nulla. Rendere, secondo `docs/mockups/US-052/scheda-titolo.html`:

