  - id: TASK-03
    title: quadro.css — ridipingere GraficoTitolo e MetricheTitolo senza duplicarli
    description: |-
      Procedere da un elenco esaustivo, non a colpo d'occhio: `grep -o 'className={\?"[a-z0-9 -]*"' client/src/components/GraficoTitolo.tsx client/src/components/MetricheTitolo.tsx` (o equivalente) dà i nomi di classe citati dai due componenti; confrontarli con ciò che `quadro.css` già definisce dalla sezione «15e. GraficoPortafoglio» di US-051/TASK-07 (`.barra-scala`, `.scala-temporale`, `.tracciato .*`, `.grafico-cornice`, `.dichiarazione-vuota`, `.avviso-rado`, condivise perché `GraficoTitolo` porta gli stessi nomi) per isolare ciò che manca davvero.

      Restano scoperte almeno: il commutatore di vista di US-039 (`.barra-vista`, `.commutatore-vista`, `.ordinata-attiva`, `.sigillo-indipendenza`) e l'intera bilancia di `MetricheTitolo` (`.bilancia`, `.piatto` con il suo modificatore `.assente`, `.fulcro`, `.testa-piatto`, `.et-piatto`, `.unita`, `.cifre`, `.importo`/`.percento` con `guadagno`/`perdita`, `.provenienza`, `.et-prov`, `.passo`/`.passi`, `.freccia`, `.coda`, `.rimando-differenza`, `.orizzonte-piatto`, `.segna-orizzonte.fisso`/`.mobile`, `.timbro-piatto`, `.perche-assente`, `.elenco-perche`, `.postilla-bilancia`) e le classi del ramo «vista senza serie» di US-039 (`.dichiarazione-vuota` con `.riga-intervallo`, `.ragione-vista-valore`, `.spiegazione`, `.dove-esiste`, `.tasto-citato`, `.invito-scala`) se non già coperte.

      Nessun file `.tsx` viene toccato: la differenza è tutta in `quadro.css`, verificata a video (un `var()` o una classe dimenticata non danno errore, spariscono).
