schema: archetipo/plan/v2
spec_code: US-030
body: "# US-030: Aggiornare i dati di un titolo dalla sua scheda — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 08.VIII.2026\n\n---\n\n## Spec\n\n**Epica:** EP-005 — Visualizzazione dei titoli\n**Priorità:** MEDIUM | **Punti:** 5\n**Bloccata da:** US-018 (DONE)\n\n**User Story**\nCome Alessandro, investitore-proprietario,\nvoglio aggiornare i dati di un titolo direttamente dalla sua scheda, accanto all'indicazione della fonte e dell'istante di rilevazione,\nin modo da rinfrescare prezzo e anagrafica senza passare dalla Ricerca titoli, sapendo da quale fonte arriva il dato nuovo.\n\n**Criteri di Accettazione**\n- [ ] AC-1 — Nella riga di provenienza della Scheda Titolo, accanto a «Fonte» e «Rilevato il», è presente un comando per aggiornare i dati del titolo\n- [ ] AC-2 — Quando per l'ISIN è registrata una fonte, il tentativo parte da quella fonte e l'altra viene interrogata solo se la prima non risponde o non trova il titolo\n- [ ] AC-3 — Quando per l'ISIN non è registrata alcuna fonte, l'ordine dei tentativi è Borsa Italiana e poi MorningStar\n- [ ] AC-4 — Dopo un aggiornamento riuscito la scheda mostra i dati aggiornati, la fonte che ha effettivamente risposto e il nuovo istante di rilevazione\n- [ ] AC-5 — Se il recupero precedente è troppo ravvicinato, l'aggiornamento non contatta la fonte: avviso di buona cittadinanza con possibilità di procedere comunque\n- [ ] AC-6 — Scheda e Ricerca titoli condividono lo stesso archivio e la stessa guardia, in entrambe le direzioni\n- [ ] AC-7 — Se nessuna delle due fonti risponde, i dati in archivio restano invariati e l'esito negativo è dichiarato senza valori inventati\n\n---\n\n## Soluzione tecnica\n\nLa spec non introduce un percorso di recupero nuovo: chiede di **raggiungere dalla Scheda Titolo il percorso che già esiste**, quello di `GET /api/securities/:isin`, e di renderlo consapevole della fonte da cui il titolo proviene. Da qui la decisione portante del piano: **nessun endpoint di refresh dedicato**. L'AC-6 non è un comportamento da implementare due volte e poi tenere allineato — è una conseguenza del riusare la stessa rotta, la stessa tabella `securities` e la stessa `classifyRefetch`. Un `POST .../refresh` su `positions` significherebbe duplicare la guardia, cioè creare esattamente la divergenza che l'AC-6 vieta.\n\nCiò che manca davvero al server è **l'ordine dei tentativi**. Oggi `fetchWithFallback` in `server/src/api/securities.ts` è cablata su Borsa Italiana → MorningStar; l'AC-2 chiede che riparta dalla fonte già registrata in `securities.data_source`, informazione che la rotta **ha già letto** (la riga `cached` viene interrogata prima della guardia, per entrambi i rami `force` e non-`force`). Il cambiamento è quindi locale: una sequenza ordinata di tentativi invece di una coppia fissa.\n\n- **Server — `fetchWithFallback` diventa ordinata.** Prende la fonte preferita come parametro e costruisce la sequenza dei tentativi: `['morningstar','borsaitaliana']` quando in cache risulta MorningStar, `['borsaitaliana','morningstar']` in ogni altro caso — fonte non registrata compresa, che è precisamente l'AC-3. La `dataSource` restituita e persistita è quella della fonte che **ha risposto**, non della prima tentata: un titolo registrato su MorningStar che torna reperibile su Borsa Italiana finisce in archivio come `borsaitaliana`. La semantica d'esito resta quella attuale — `found` vince; altrimenti `not-found` se l'ultimo tentativo non ha trovato il titolo; `error` se nessuno ha risposto — e sul ramo `error` la rotta **non scrive nulla**, che è già oggi l'invariante su cui poggia l'AC-7.\n- **Client — la riga di provenienza diventa una riga d'azione.** `SchedaTitolo` guadagna il comando «⟳ Aggiorna dati» dentro `.riga-fonte` (vedi `docs/mockups/US-030/`), che chiama `GET /api/securities/:isin` e, sulla risposta con `confirmation`, mostra lo stesso `.avviso-conferma` della Ricerca titoli con il testo servito dal server, ripetendo la chiamata con `?force=true` su «Procedi comunque».\n- **Dopo il successo si ricarica il dettaglio, non si ricalcola.** La risposta del lookup porta l'anagrafica e il prezzo, ma non `currentValue`, `difference` e `differencePercent`: quelle formule vivono nel server (US-018, TASK-04) e ricalcolarle nel client le duplicherebbe. `SchedaTitolo` rilegge quindi `GET /api/portfolios/:id/positions/:isin/detail` e riparte da lì. Costa un secondo giro di rete e vale il fatto che la formula resti in un posto solo.\n- **La scheda non si svuota durante l'attesa.** Lo stato di aggiornamento è distinto dal `loading` del primo caricamento: i valori d'archivio restano a schermo, dichiarati come tali, perché con la fonte di backup l'attesa arriva a 8-12 secondi e una scheda vuota per tutto quel tempo sarebbe una regressione rispetto a US-018.\n- **Il riepilogo si riallinea.** Un prezzo nuovo cambia anche il valore totale del portafoglio: dopo un aggiornamento riuscito `SchedaTitolo` richiama un callback opzionale che in `PortfolioDetailPage` invoca `fetchEnriched()` — già una `useCallback` — così tornando alla scheda Riepilogo non si trova un totale vecchio.\n- **Nessun default di comodo sulla provenienza.** `SecurityLookupResponse.dataSource` è opzionale e `SecuritySearchPage` interpreta l'assenza come `'borsaitaliana'`; la Scheda Titolo non deve seguirla. `null`/assente resta «fonte non registrata», come stabilito in US-018: attribuire d'ufficio la fonte primaria sarebbe un dato inventato (FR-021).\n\n---\n\n## Strategia di test\n\nLa divisione del lavoro segue la testabilità: **gli ordini di interrogazione e le invarianti d'archivio vanno in Vitest**, dove gli adapter sono iniettabili (`SecuritiesDeps`) e il tempo è deterministico (`deps.now`); l'**E2E copre il gesto dell'utente** sulla riga di provenienza. Nessun test della suite contatta la fonte reale — la regola già in vigore in `e2e/support/titoli.ts`.\n\n- **Vitest — ordine dei tentativi (AC-2, AC-3):** fonte in cache `morningstar` → MorningStar interrogato per primo e Borsa Italiana mai chiamata; `morningstar` in cache ma MorningStar in `not-found` → ripiego su Borsa Italiana con `data_source` riscritta a `borsaitaliana`; nessuna fonte registrata (`data_source` NULL) e cache miss → ordine Borsa Italiana poi MorningStar.\n- **Vitest — archivio invariato (AC-7):** con una riga in cache e ambo gli adapter in `error`, la risposta è 502 e `price`, `data_source` e `fetched_at` della riga sono identici a prima: nessuna scrittura parziale.\n- **Vitest — guardia condivisa (AC-5, AC-6):** con una riga recente, la chiamata senza `force` restituisce `confirmation` senza interrogare alcun adapter (nessuno dei due spy chiamato); con `?force=true` la fonte è interrogata e `fetched_at` avanza, così che la chiamata successiva senza `force` ritorni a chiedere conferma. È lo stesso codice che serve entrambe le pagine: verificarlo una volta lo verifica per tutte e due.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, fixture `archivio` in `e2e/support/`)\n**Registrazione video:** solo lo scenario dimostrativo, salvato in `docs/test-results/US-030/` con `page.video().saveAs()` in `afterEach` dopo `page.close()`; gli altri scenari girano senza video, in un file fratello (la coppia `US-026__*` è il precedente).\n\nCome si ottiene determinismo senza rinunciare all'onestà del video: la chiamata al lookup viene servita con `route.fulfill()` **una volta sola** (`times: 1`), e prima del click il test ri-semina la riga in cache con il prezzo nuovo, la fonte nuova e `fetched_at` corrente — cioè con l'effetto che la fonte avrebbe prodotto. Il dettaglio riletto dopo l'aggiornamento arriva quindi dal server vero, su dati veri; l'unica cosa simulata è la risposta della fonte esterna. Dal secondo click in poi lo stub non c'è più e la guardia che scatta è quella reale, sullo stato reale dell'archivio. Nota operativa: il test **non** deve premere «Procedi comunque», che a stub scaduto contatterebbe la rete per 8-12 secondi.\n\n| Scenario | Flusso utente |\n|---|---|\n| Aggiornamento dalla scheda (demo, con video) | Portafoglio e carichi creati via fixture `archivio`; titolo seminato con prezzo vecchio, `data_source: 'borsaitaliana'` e `fetched_at` di una sessione di borsa passata → l'utente apre il portafoglio, clicca la riga del titolo, apre la Scheda titolo e legge la rilevazione vecchia → premendo «Aggiorna dati» la scheda mostra prezzo, valore attuale e differenza nuovi, il timbro «Fonte di backup», MorningStar come fonte e il nuovo istante → premendolo di nuovo compare l'avviso di buona cittadinanza con «Procedi comunque» e «Annulla», e l'utente annulla → passando alla Ricerca titoli e cercando lo stesso ISIN l'avviso compare anche lì, con l'istante dell'aggiornamento fatto dalla scheda (AC-1, AC-4, AC-5, AC-6) |\n| Nessuna fonte risponde | Titolo seminato con prezzo e fonte noti; lookup servito con 502 → premendo «Aggiorna dati» la scheda dichiara l'esito negativo, fonte e istante di rilevazione restano i precedenti e `archivio.leggiTitolo()` conferma la riga identica: nessun valore riscritto né inventato (AC-7) |\n| Titolo senza fonte registrata | ISIN rimosso dalla cache con `archivio.rimuoviTitolo` → la scheda dichiara «Fonte non registrata» e offre comunque il comando; dopo il recupero (lookup servito come trovato su Borsa Italiana, riga ri-seminata) il timbro diventa «Fonte primaria» e l'anagrafica è compilata senza passare dalla Ricerca titoli (AC-3) |\n| Guardia dalla Ricerca titoli verso la scheda | Titolo seminato con `fetched_at` corrente → l'utente apre la Scheda titolo e preme «Aggiorna dati»: l'avviso compare al primo colpo, perché la rilevazione appena registrata dalla ricerca è la stessa che la scheda legge (AC-6, direzione opposta) |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-030/`\n\n_Piano generato con ARchetipo Planning — 08.VIII.2026_\n"
