schema: archetipo/plan/v2
spec_code: US-019
body: "# US-019: Visualizzare il grafico del valore del portafoglio nel tempo — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 13 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-006 — Grafico andamento del portafoglio\n**Priorità:** HIGH | **Punti:** 5\n**Bloccata da:** — (EP-007 e EP-008 sono chiuse: `serieTitolo.ts`, `serieValore.ts`, `quantitaDetenutaA` con le vendite e `GraficoTitolo` esistono e sono in esercizio)\n\n**User Story**\nCome Giulia, investitrice prudente, voglio vedere nella scheda Riepilogo un grafico del valore complessivo del portafoglio nel tempo, in modo da cogliere a colpo d'occhio l'andamento del conto senza leggerlo titolo per titolo (FR-015).\n\n**Criteri di Accettazione**\n- [ ] Nella scheda Riepilogo compare un grafico del valore complessivo del portafoglio nel tempo, reso con la stessa grafica del grafico del titolo e senza alcuna libreria di grafici\n- [ ] La serie ha un punto a ogni data d'evento dell'archivio — rilevazione, carico, vendita — e nessun punto dove non cade alcun evento\n- [ ] Il valore di ogni punto applica la quantità detenuta *a quella data*, calcolata con la funzione già consegnata da US-045: carichi e vendite successivi non retroagiscono sul passato\n- [ ] Ogni titolo che entra in un punto con una quotazione anteriore alla data del punto è dichiarato, con la data della quotazione usata e la sua età in giorni\n- [ ] Il punto dichiara quanti titoli sono valorizzati su una rilevazione del giorno e quanti su una quotazione riportata\n- [ ] La copertura piena comincia dalla prima data in cui ogni titolo detenuto ha un prezzo noto; il tratto precedente è dichiarato parziale e nomina quanti titoli non sono ancora valorizzati, invece di disegnare un portafoglio che sembra valere meno\n- [ ] I dati di tutti i titoli arrivano in un solo giro di richieste al server, e la costruzione del grafico non genera alcuna richiesta alla fonte\n- [ ] Test puri coprono l'aggregazione con titoli che entrano ed escono dal portafoglio nel tempo e con rilevazioni a date disallineate\n\n---\n\n## Soluzione tecnica\n\nIl grafico del portafoglio non è un secondo grafico: è la stessa curva del valore già consegnata da US-039, misurata su un perimetro di più ISIN. Tutto ciò che serve esiste già ed è provato — la composizione della serie dai soli dati d'archivio (`componiSerieTitolo`), la quantità detenuta a una data al netto delle vendite (`quantitaDetenutaA`, US-045), le scale temporali condivise (`SCALE_TEMPORALI`), la resa SVG scritta a mano (`GraficoTitolo`). Questa spec aggiunge **un solo fatto nuovo**: l'aggregazione di più titoli su un asse comune quando le loro date di rilevazione non coincidono, cioè ADR-010. Il resto si riusa.\n\n### La decisione centrale: che cos'è «ultimo prezzo noto»\n\nUn prezzo noto è una **rilevazione realmente registrata** (`price_observations`), riportata in avanti fino alla data del punto. Il prezzo di *carico* **non** conta come quotazione di mercato. È la lettura letterale della regola d'aggregazione della spec («è una rilevazione realmente registrata, riportata in avanti e dichiarata come tale») e di ADR-010 («la sua ultima rilevazione registrata non successiva alla data del punto»), ed è la sola lettura che tiene in vita il criterio 6: se il carico contasse come quotazione, ogni titolo detenuto avrebbe per costruzione un prezzo noto dal giorno del proprio carico, la copertura sarebbe sempre piena e il «tratto precedente dichiarato parziale» non esisterebbe mai — un criterio di accettazione vero per vacuità.\n\nNe segue una conseguenza da conoscere e non da «sistemare»: al netto del backfill d'avvio (US-009, che genera una rilevazione dalla riga di cache di ogni titolo già interrogato), un titolo caricato e mai interrogato alla fonte **non è valorizzabile**, e la sua presenza in conto tiene parziale ogni punto in cui è detenuto. È esattamente lo stato che il criterio 6 descrive e che US-016 completerà nominando il titolo.\n\nNe segue anche che il valore del portafoglio a una data di carico può differire dalla somma delle curve dei singoli titoli letta a quella stessa data, dove il carico *è* un punto con il proprio prezzo (US-039). Le due letture rispondono a due domande diverse — «che cosa l'archivio sa di questo titolo» contro «che cosa il conto valeva sul mercato» — e la seconda non può usare come quotazione un prezzo che nessuno ha rilevato.\n\n### Il nuovo modulo di dominio: `shared/domain/serieValorePortafoglio.ts`\n\nQuarto modulo di dominio condiviso accanto a `serieTitolo.ts`, `serieValore.ts` e `lottiLifo.ts`, con la stessa disciplina: funzioni **pure**, nessuna rete, nessun archivio, nessun orologio (l'istante corrente arriva come argomento). Si affaccia da `shared/types/index.ts` come i tre fratelli.\n\nIngresso — un titolo è il proprio registro più le proprie rilevazioni, nei tipi già ritagliati dai moduli esistenti (`CaricoValore`, `VenditaValore` da `serieValore.ts`; `RilevazioneSerie` da `serieTitolo.ts`): nessun tipo nuovo dove uno esatto esiste già.\n\n```ts\nexport interface TitoloPortafoglio {\n  isin: string;\n  name: string | null;                          // per la resa; il calcolo non lo legge\n  loads: readonly CaricoValore[];\n  sales: readonly VenditaValore[];\n  observations: readonly RilevazioneSerie[];\n}\n```\n\nUscita — il punto porta **il valore e i fatti che lo giustificano**, perché i criteri 4, 5 e 6 chiedono dichiarazioni che solo il dominio può calcolare senza rifare l'aritmetica nella resa:\n\n```ts\nexport type StatoContributo = 'del-giorno' | 'riportato' | 'non-valorizzato';\n\nexport interface ContributoTitolo {\n  isin: string;\n  quantita: number;                 // detenuta *a quella data* (US-045)\n  prezzo: number | null;            // ultimo prezzo noto; null = non valorizzato\n  quotazioneAt: number | null;      // istante della rilevazione usata (unix ms)\n  etaGiorni: number | null;         // giorni civili fra la quotazione e il punto\n  stato: StatoContributo;\n  valore: number | null;            // prezzo × quantita, null se non valorizzato\n}\n\nexport type CoperturaPerimetro = 'piena' | 'parziale' | 'assente';\n\nexport interface PuntoPortafoglio extends PuntoSerie {\n  /** `price` è Σ dei contributi valorizzati: è il valore del **portafoglio**\n   *  soltanto quando `copertura === 'piena'`. */\n  contributi: ContributoTitolo[];\n  titoliDetenuti: number;\n  titoliDelGiorno: number;\n  titoliRiportati: number;\n  titoliNonValorizzati: number;\n  copertura: CoperturaPerimetro;\n}\n\nexport interface SerieValorePortafoglio {\n  punti: PuntoPortafoglio[];\n  /** Primo istante in cui ogni titolo detenuto ha un prezzo noto; `null` se mai. */\n  primaCoperturaPiena: number | null;\n  ragioneVuota: 'senza-titoli' | 'senza-eventi' | null;\n}\n```\n\n`PuntoPortafoglio` **estende `PuntoSerie` e conserva il nome `price`** per la stessa ragione per cui lo fa `PuntoValore` (US-039): è il campo su cui `ritagliaSerie` e `calcolaScalaSerie` lavorano, e un secondo nome sdoppierebbe quelle due funzioni in varianti gemelle. `ritagliaSerie` è già generica su `P extends PuntoSerie` — nessuna modifica serve.\n\nLe tre funzioni pure del modulo:\n\n1. **`dateEventoPortafoglio(titoli)`** — gli istanti d'evento dell'archivio: `istanteDataCivile(loadDate)` per ogni carico, `istanteDataCivile(saleDate)` per ogni vendita, `observedAt × 1000` per ogni rilevazione. Deduplica **per istante** (non per giorno civile): due rilevazioni di ISIN diversi nello stesso giorno a secondi diversi sono due eventi, come già nella serie del titolo. `origin` del punto è l'evento che lo ha generato, con la stessa precedenza dei carichi a pari istante. Le date malformate e le quantità non finite vengono **scartate**, non corrette: la disciplina dei tre moduli esistenti.\n\n2. **`prezzoNotoA(observations, at)`** — l'ultima rilevazione con istante `<= at`, con il suo istante. È il cuore di ADR-010 e la sola funzione autorizzata a «riportare in avanti». Non interpola, non estrapola oltre la data e non ripiega su un valore di comodo: assente significa `null`.\n   L'**età** si misura in **giorni civili** fra il giorno della quotazione e il giorno del punto (via `giornoCivilePunto` e `istanteDataCivile`), non come differenza di millisecondi divisa per 86.400.000: le ore residue di due istanti reali darebbero 21 o 23 giorni dove il calendario dice 22, e la cifra è scritta a schermo.\n   `stato` è `'del-giorno'` quando i due giorni civili coincidono, `'riportato'` altrimenti.\n\n3. **`componiSerieValorePortafoglio({ titoli, now })`** — una passata sugli istanti d'evento ordinati; per ciascuno, per ogni titolo: `quantitaDetenutaA(loads, sales, at)` (la funzione di US-045, invariata) e `prezzoNotoA`. Un titolo con quantità `<= 0` **non è nel perimetro** di quel punto — non è ancora entrato, oppure è uscito con una vendita totale — e non conta né fra i detenuti né fra i non valorizzati: è il criterio «titoli che entrano ed escono dal portafoglio nel tempo». `copertura` è `'piena'` con zero titoli non valorizzati, `'assente'` con zero titoli valorizzati e almeno un titolo detenuto, `'parziale'` nel mezzo. `primaCoperturaPiena` è il primo istante a copertura piena.\n   Due zeri da non confondere, ed entrambi hanno un nome: un punto con **nessun titolo detenuto** (tutto venduto) ha `copertura: 'piena'` e `price: 0` — zero **misurato**, la stessa disciplina del riquadro del valore attuale in US-044; un punto con titoli detenuti e nessun prezzo noto ha `copertura: 'assente'` e il valore **non è affermabile**.\n   Il riporto si risolve con un puntatore per titolo che avanza sulle rilevazioni ordinate, non con una ricerca per ogni coppia (punto, titolo): la scansione resta lineare.\n\n### L'evento «vendita» sull'asse dei tempi\n\n`OriginePunto` diventa `'carico' | 'vendita' | 'rilevazione'`. È una modifica di tipo condiviso, deliberata e piccola: il compilatore enumera da sé ogni punto da aggiornare, perché le mappe interessate sono `Record<OriginePunto, …>`.\n\n- `serieTitolo.ts`: `PRECEDENZA_ORIGINE` acquisisce `vendita: 1` (rilevazione passa a `2`; l'ordine relativo fra carico e rilevazione non cambia, quindi nessuna serie esistente si riordina); `giornoCivilePunto` tratta `'vendita'` come `'carico'` — è una data civile ancorata a mezzanotte UTC e va letta con i campi UTC.\n- `GraficoTitolo.tsx`: le quattro mappe `NOME_ORIGINE`, `NOME_ORIGINE_VALORE`, `TITOLO_ORIGINE`, `TITOLO_ORIGINE_VALORE` acquisiscono la voce. `componiSerieTitolo` non emette mai `'vendita'`, quindi il ramo è irraggiungibile dalla scheda titolo: la voce esiste per l'esaustività del tipo, e va scritta in modo corretto («vendita registrata») invece che con un segnaposto.\n\nL'alternativa — un tipo d'origine locale al modulo del portafoglio — è stata scartata: `calcolaScalaSerie` legge `origin === 'carico'` per collocare l'estremo sinistro, quindi il punto aggregato deve comunque essere un `PuntoSerie` legittimo, e due vocabolari d'origine su un campo solo sono la premessa di una divergenza.\n\n### Un solo giro di richieste: `GET /api/portfolios/:id/series`\n\nIl criterio 7 vieta il difetto ovvio: `N` chiamate a `…/positions/:isin/detail`, una per titolo. Nuova rotta di sola lettura, allo stesso livello di `…/sales`:\n\n```ts\nexport interface PortfolioSeriesEntry {\n  isin: string;\n  name: string | null;\n  loads: { loadDate: string; loadPrice: number; quantity: number }[];\n  sales: { saleDate: string; quantity: number }[];\n  observations: PriceObservation[];\n}\n// Reply: PortfolioSeriesEntry[], ordinato per ISIN\n```\n\nImplementazione: `leggiRegistriPortafoglio(portfolioId)` e `ordinaPerIsin` esistono già e danno carichi e vendite per ISIN in una passata; `leggiAnagrafiche` dà i nomi; le rilevazioni arrivano da **una** query `inArray(priceObservations.isin, isins)` ordinata per `observed_at` crescente, raggruppata in memoria. Tre letture SQL, zero chiamate alla fonte: nel file della rotta non entra alcun import di `market/`, ed è la stessa disciplina della rotta `…/detail` («un recupero a freddo costa 8-12 secondi e scavalcherebbe la guardia di buona cittadinanza»).\n\n`/series` è registrata sotto `/api/portfolios/:id/` e non sotto `…/positions/`, così non entra in concorrenza con `…/positions/:isin/detail` e l'ordine di registrazione non diventa un vincolo implicito in più. Portafoglio inesistente → 404 con la stessa forma delle altre rotte; portafoglio senza titoli → `[]`, che significa «nessun titolo», non un errore.\n\nLe rilevazioni arrivano in ordine **crescente** — l'opposto di `PositionDetail.priceHistory`, che è discendente perché la tabella di US-009 legge prima l'ultima. Il riporto in avanti scandisce in avanti, e ordinare alla fonte del dato evita un `sort` nel client su ogni ricomposizione.\n\n### Il componente: `client/src/components/GraficoPortafoglio.tsx`\n\nStessa grafica del grafico del titolo, secondo i mockup `docs/mockups/US-019/`: `viewBox` e riquadro identici, `path` scritti a mano, classi di `ledger.css`, **nessuna libreria di grafici e nessuno script remoto**. Riusa dal dominio `calcolaFinestra`, `ritagliaSerie`, `calcolaScalaSerie` (con `ancoraAZero: true` e `prezzoMedio: null` — il valore del portafoglio è una grandezza assoluta e un prezzo per quota non individua alcun livello sulla sua ordinata).\n\nCome `GraficoTitolo`, **non fa alcuna richiesta**: tutto arriva per prop (`titoli`, `now`, `simboloValuta`), e nel file non esiste codice che possa contattare la rete.\n\nDue cose della scheda titolo non compaiono, ed è il perimetro della spec:\n\n- il **commutatore prezzo/valore** (US-039): per un portafoglio il prezzo unitario non ha significato;\n- il **selettore della scala** (US-037): è US-020, bloccata da questa spec. Qui la finestra è calcolata con `calcolaFinestra({ scala: 'tutto', … })` invece di essere assente, così US-020 aggiunge lo stato e la traversa senza toccare il calcolo.\n\nQuattro rami d'uscita, ciascuno con il proprio `data-testid`:\n\n1. **Nessun titolo in conto** → dichiarazione a parole (il grafico compare col primo carico).\n2. **Nessun prezzo noto per alcun titolo detenuto** → `dichiarazione-vuota` con timbro «dato non disponibile» e la ragione: le quantità ci sono, i prezzi no, e lo storico è osservazionale (ADR-008). Mai una retta a zero.\n3. **Copertura piena da una certa data** → la curva è disegnata **solo** sul tratto pieno; il tratto anteriore è campito e dichiara i giorni e quanti titoli non erano valorizzati. I punti a copertura parziale restano visibili come segni **vuoti e barrati**, con la somma parziale scritta e barrata: nasconderla sarebbe un'omissione, disegnarla come curva direbbe che il conto valeva meno (criterio 6).\n4. **Copertura piena su tutta la finestra** → nessuna campitura, nessun avviso.\n\nSotto il tracciato, `.composizione-punto` legge per esteso l'ultimo punto: per ciascun titolo la quantità detenuta a quella data, il prezzo, e il **timbro** che dichiara la quotazione usata (`rilevazione del <data>` / `quotazione del <data> · N giorni` / `nessun prezzo noto`). L'intestazione porta il conteggio del criterio 5 in una riga sola. La descrizione parlata dell'SVG (`aria-label`) porta gli stessi fatti, come in US-036/US-039.\n\nSegni: rombo per il carico, cerchio per la rilevazione, quadrato per la vendita; tratteggio fra due punti — mai continuo — perché fra due date l'archivio non possiede alcuna rilevazione. Sotto l'asse, la striscia del **perimetro** (quanti titoli detenuti a ciascuna data): è l'analogo aggregato della fascia della quantità di US-039, cioè il secondo fattore del prodotto reso visibile.\n\n### L'estrazione dei primitivi di tela\n\n`GraficoPortafoglio` ha bisogno degli stessi primitivi di `GraficoTitolo`: `TELA`, `RIQUADRO`, `MARGINE_SEGNO`, `MS_GIORNO`, `a1`, `rombo`, `giorniFra`, `dataPunto`, `dataIstante`, `prezzoScala`, `conteggio`. Si spostano in `client/src/components/graficoTela.ts` e `GraficoTitolo` li importa da lì.\n\nÈ uno spostamento **meccanico** — nessun JSX si muove, nessuna firma cambia — e la scelta di farlo invece di copiare è deliberata: due cornici che devono restare identiche non possono avere due definizioni di `RIQUADRO`, perché la prima modifica a una delle due le fa divergere in silenzio. Il rischio è la regressione su una spec già accettata, e la rete è già tesa: `npm run typecheck` per le firme e le quattro coppie di spec e2e US-036/037/038/039 per la resa.\n\n### Innesto nella scheda Riepilogo\n\nIn `PortfolioDetailPage`, nel ramo `scheda === 'riepilogo'`, una nuova sezione «Andamento del portafoglio» **sotto** `QuadroRisultato` e sopra `AggiornaObsoleti`: le due caselle esistenti dicono quanto il conto vale adesso, il grafico dice come ci è arrivato. Un solo `fetch('/api/portfolios/:id/series')`, con lo stesso schema degli altri caricamenti della pagina (stato + effetto, ricarico silenzioso al rientro sulla linguetta), e nessuna chiamata per titolo.\n\n`ledger.css` acquisisce in coda la sezione US-019 con le classi dei mockup (`.barra-perimetro`, `.composizione-punto`, `.riga-contributo`, `.timbro-riporto`, `.copertura-parziale`, `.didascalia-perimetro`), senza riscrivere alcuna regola esistente.\n\n### Ciò che questa spec non fa\n\n- **non nomina** il titolo che rende parziale il tratto: dichiara *quanti*. Il *quale*, con la data d'inizio copertura e il rimando all'aggiornamento in blocco di US-035, è US-016;\n- **non aggiunge** il selettore di scala (US-020) né le metriche sotto il grafico (US-015);\n- **non ricalcola** il P&L complessivo: resta quello del quadro del risultato (US-043);\n- **non tocca** l'attribuzione LIFO, la quantità detenuta, la resa del grafico del titolo.\n\n---\n\n## Strategia di test\n\nIl baricentro è nei **test puri**: l'aggregazione è aritmetica su date, ed è lì che i difetti di questa spec vivono — la quantità retroattiva, il riporto non dichiarato, il perimetro che cambia sotto la somma. La resa si verifica in e2e sui fatti dichiarati a schermo, non sulle coordinate.\n\n- **Puri (Vitest, `server/tests/serieValorePortafoglio.test.ts`)** — le date d'evento (un punto per evento, nessuno dove non cade un evento, deduplica per istante); il riporto in avanti (ultima rilevazione non successiva, età in giorni civili, `del-giorno` contro `riportato`, nessun riporto oltre l'ultima rilevazione a sinistra del primo punto); l'aggregazione con **rilevazioni a date disallineate** (lo scenario della spec: due titoli, 12.V e 3.VI, con il punto del 3.VI a € 16.636,00 e «1 di 2 su prezzo riportato, 22 giorni»); i **titoli che entrano e escono** (un titolo caricato a metà finestra non retroagisce; un titolo venduto per intero esce dal perimetro e non rende parziale il punto); la copertura (`primaCoperturaPiena`, `parziale`, `assente`, e il caso in cui non comincia mai); i due zeri (nessun titolo detenuto → zero misurato; titoli detenuti senza prezzi → non affermabile); i casi degeneri (nessun titolo, date malformate, quantità e prezzi non finiti — scartati, mai `NaN` nel risultato).\n- **Puri (Vitest, `server/tests/serieTitolo.test.ts`)** — l'estensione di `OriginePunto`: giorno civile UTC della vendita, precedenza a pari istante, e la non-regressione dell'ordinamento delle serie esistenti.\n- **Integrazione server (Vitest, `server/tests/api.portfolios.serie.test.ts`)** — la rotta restituisce **tutti** i titoli in una sola risposta, ordinata per ISIN, con rilevazioni crescenti; 404 su portafoglio inesistente; `[]` su portafoglio senza titoli; nessun adapter di mercato importato o invocato (la copertura del «zero richieste alla fonte» è strutturale: nel modulo non esiste l'import).\n- **Non si duplica** in test la matematica di `quantitaDetenutaA`: è già coperta da `serieValore.test.ts` (US-045). Qui si verifica che venga *usata* con la data del punto.\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, `e2e/`), con il `test` esteso di `e2e/support/fixtures.ts` e la fixture `archivio` per creare e ripulire i dati. Pulizia **solo** in teardown, nomi da `nomeUnico`, chiavi ISIN proprie del file dichiarate in `e2e/support/titoli.ts` (il controllo `npm run check:chiavi` le verifica) e aggiunte alla lista di `bonifica.ts`.\n**Registrazione video:** solo lo scenario dimostrativo (campo `Dimostra` della spec), salvato con `page.video().saveAs('docs/test-results/US-019/…webm')` in un `afterEach` dopo `page.close()`; gli altri scenari girano senza video, in un file sorella — `launchOptions`/`slowMo` non sono scopabili a un `describe`.\n\n| Scenario | Flusso utente |\n|---|---|\n| **Dimostrazione** (`US-019__grafico-portafoglio.spec.ts`, con video) | L'utente crea un conto, iscrive due titoli con carichi a date diverse e apre la scheda Riepilogo. L'archivio è seminato con una rilevazione del 12.V per il primo titolo e una del 3.VI per il secondo: il grafico mostra un punto a ciascuna delle due date, e il punto del 3.VI dichiara «1 di 2 titoli su prezzo riportato, 22 giorni» con la data della quotazione usata. |\n| **Copertura parziale** (`…-varianti.spec.ts`) | Conto con tre titoli, di cui uno mai rilevato (chiave rimossa dalla cache prima del test): il grafico non disegna la curva, dichiara quanti titoli non sono valorizzati e mostra la somma parziale come tale, non come valore del conto. |\n| **Nessun prezzo noto** (`…-varianti.spec.ts`) | Conto con carichi e nessuna rilevazione: timbro «dato non disponibile» al posto del tracciato, con la ragione — e nessuna retta appoggiata allo zero. |\n| **Un solo giro di richieste** (`…-varianti.spec.ts`) | Con `page.route`/`page.on('request')` si conta il traffico all'apertura del Riepilogo: **una** richiesta a `…/series`, **nessuna** a `…/positions/:isin/detail` e nessuna a `/api/securities/*`. È il criterio 7 verificato come fatto osservabile invece che per ispezione del codice. |\n| **Vendita nel tempo** (`…-varianti.spec.ts`) | Un titolo venduto per intero a metà storia: i punti successivi non lo contano nel perimetro e la curva scende del suo controvalore senza dichiarare copertura parziale. |\n| **Non-regressione della scheda titolo** | Le coppie e2e US-036/037/038/039 girano invariate: sono la rete di sicurezza dell'estrazione dei primitivi di tela. |\n\nLe asserzioni si appoggiano ai `data-testid` e ai testi dichiarati (età del riporto, conteggi del perimetro, timbri), non alle coordinate SVG: le prime sono i criteri di accettazione, le seconde un dettaglio di resa.\n\n---\n\n## Assunzioni e questioni aperte\n\n1. **Il prezzo di carico non è una quotazione** (vedi «La decisione centrale»). È la lettura letterale della spec e di ADR-010, ed è la sola che renda non vacuo il criterio 6. Conseguenza dichiarata: un titolo caricato e mai interrogato alla fonte tiene parziali i punti in cui è detenuto, e il valore del portafoglio a una data di carico può non coincidere con la somma delle curve dei singoli titoli.\n2. **Le date d'evento si deduplicano per istante, non per giorno civile** — come già nella serie del titolo. Due rilevazioni di ISIN diversi nello stesso giorno restano due punti; l'età del riporto si misura però in giorni civili, perché è la cifra scritta a schermo.\n3. **Un punto senza titoli detenuti vale zero, misurato** (portafoglio interamente venduto a quella data), coerentemente con US-044. Non è il «dato non disponibile» del punto con titoli detenuti e nessun prezzo noto.\n4. Il **conteggio dei giorni scoperti a destra** (dall'ultimo punto a oggi) usa `now`, che arriva come prop: i test e2e non asseriscono quel numero, che dipende dal giorno d'esecuzione.\n\n> \U0001F3A8 I mockup di questa spec sono in `docs/mockups/US-019/` — `index.html` (copertura piena e riporto dichiarato), `copertura-parziale.html` (titolo mai rilevato e conto senza rilevazioni), `README.md` (lo scenario e le decisioni di resa).\n\n_Piano generato via ARchetipo Planning — 13 agosto 2026_\n"
