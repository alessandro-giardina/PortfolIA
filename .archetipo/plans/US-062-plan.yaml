spec_code: US-062
body: |
  # US-062: Rimuovere lo stemma segnaposto dalla ricerca titoli e dalla scheda titolo — Implementation Plan

  **Generated by:** ARchetipo Planning Team
  **Date:** 2026-08-21

  ---

  ## Spec

  **Epic:** EP-009 — Direzione visiva commutabile
  **Priority:** MEDIUM | **Points:** 2

  **User Story**
  Come utente di PortfolIA che lavora nel design «Quadro strumenti», voglio che né il risultato della ricerca titoli né la scheda titolo mostrino un riquadro con le iniziali del titolo, così che nessuna delle due schermate lasci intendere che la fonte fornisca un logo o un'immagine che in realtà non esiste.

  **Acceptance Criteria**
  - Nel design «quadro», la testata del risultato di ricerca (`testa-titolo-ricerca`) non contiene più l'elemento `.stemma`
  - Nel design «quadro», la testata della scheda titolo (`scheda-titolo`) non contiene più l'elemento `.stemma`
  - La funzione `stemmaDi` e la regola CSS `.testa-titolo .stemma` sono rimosse da entrambi i file coinvolti (`RicercaQuadro.tsx`, `SchedaTitoloQuadro.tsx`, `quadro.css`), senza lasciare codice morto
  - La denominazione, l'ISIN e le pillole di marcatura restano visibili e leggibili con lo spazio recuperato, senza un vuoto innaturale a sinistra del nome, in entrambe le schermate
  - Il design «Libro Mastro» non è toccato: non conteneva questo elemento e resta invariato
  - I test E2E esistenti (`US-055__quadro-ricerca-titoli*.spec.ts`, `US-052__quadro-scheda-titolo.spec.ts`) passano senza modifiche, in quanto non asseriscono il contenuto dello stemma
  - `npm run check` è verde

  ---

  ## Technical Solution

  Lo stemma è un artificio puramente grafico duplicato identicamente in due componenti del design «Quadro»: la funzione `stemmaDi` (`(nome ?? isin).slice(0,2)`) e lo `<span className="stemma" aria-hidden="true">` che la invoca. La rimozione è un refactor mirato, senza impatto sui dati o sulle API: si eliminano funzione e markup in entrambi i file TSX e la regola CSS corrispondente, verificando che il layout flessibile della testata (`.testa-titolo { display:flex; gap:18px }`) resti corretto con un solo figlio (`.anagrafe`) al posto di due.

  - **RicercaQuadro.tsx** (righe indicative 23-30 per la funzione, 311-339 per l'uso nella testata `testa-titolo-ricerca`): rimuovere la dichiarazione di `stemmaDi` e lo `<span className="stemma">` nel blocco `.anagrafe`/risultato trovato, lasciando `.anagrafe` come primo e unico figlio del contenitore flex.
  - **SchedaTitoloQuadro.tsx** (righe indicative 37-44 per la funzione, 135-154 per l'uso nella testata `.testa-titolo` della scheda): stessa rimozione, identica per struttura al file precedente.
  - **quadro.css** (righe indicative 724-773): rimuovere la regola `.testa-titolo .stemma` (box 56x56px) mantenendo intatte `.testa-titolo` (contenitore flex con `padding:22px` e `gap:18px`) e `.anagrafe` (`min-width:0; flex:1 1 320px`). Poiché `gap` si applica solo tra figli esistenti, con un solo figlio rimanente non serve alcuna compensazione manuale di padding: verificare comunque visivamente che non resti uno spazio vuoto innaturale a sinistra del nome, come richiesto dal criterio di accettazione.
  - Nessuna modifica ad altri design (Libro Mastro non contiene l'elemento, confermato da ricerca full-repo) né a logica di dati/API: il cambiamento è isolato a presentazione.

  ---

  ## Test Strategy

  Trattandosi di una rimozione di elemento puramente visivo senza nuovo comportamento utente, la strategia di test è di regressione: garantire che nulla si rompa nel design «Quadro» e che il design «Libro Mastro» resti inalterato.

  - Verifica statica: dopo la rimozione, grep su `stemma`/`stemmaDi` nei tre file coinvolti non deve produrre risultati (nessun codice morto residuo).
  - Verifica visiva manuale/E2E della testata in entrambe le schermate (ricerca titoli e scheda titolo): denominazione, ISIN e pillole restano leggibili, allineate correttamente, senza vuoto a sinistra.
  - Regressione: l'intera suite Playwright esistente deve restare verde, in particolare le spec che esercitano le due testate coinvolte.

  ### E2E Tests — User Simulation

  **Framework:** Playwright (rilevato da `playwright.config.ts` e dalla struttura `e2e/`)
  **Video recording:** Nessuna nuova registrazione demo richiesta — questa spec non introduce un nuovo scenario utente dimostrabile, ma rimuove un elemento grafico da schermate già coperte da demo esistenti (US-055, US-052); le eventuali registrazioni già presenti in `docs/test-results/US-055/` e `docs/test-results/US-052/` restano il riferimento visivo e verranno naturalmente aggiornate al prossimo run di quelle spec.

  | Scenario | User flow description |
  |---|---|
  | Ricerca titolo per ISIN (regressione, `US-055__quadro-ricerca-titoli*.spec.ts`, invariata) | L'utente cerca un ISIN nel design Quadro; la testata del risultato mostra denominazione, ISIN, pillole di marcatura e prezzo senza il riquadro stemma; lo scenario non asserisce sullo stemma quindi continua a passare senza modifiche al file |
  | Apertura scheda titolo (regressione, `US-052__quadro-scheda-titolo.spec.ts`, invariata) | L'utente apre la scheda di un titolo dal Quadro; la testata `.testa-titolo` mostra le stesse informazioni senza il riquadro stemma; lo scenario non asserisce sullo stemma quindi continua a passare senza modifiche al file |

