    title: npm run check verde
    description: Eseguire `npm run check` (lint → typecheck → typecheck:e2e → check:chiavi → test:e2e-support → test) e verificare che tutta la pipeline sia verde. Correggere eventuali errori introdotti dalla ristrutturazione CSS o dalle nuove componenti.
    type: Test
