schema: archetipo/plan/v2
spec_code: US-053
body: "# US-053: Quadro strumenti — elenco portafogli — Piano di implementazione\n\n**Generato da:** Team di Pianificazione ARchetipo\n**Data:** 2026-08-20\n\n---\n\n## Spec\n\n**Epic:** EP-009 — Direzione visiva commutabile\n**Priorità:** MEDIUM | **Punti:** 3\n\n**User Story**\nCome utente di PortfolIA che preferisce il design «Quadro strumenti», voglio che l'elenco dei portafogli e la creazione di un nuovo portafoglio siano disponibili nel nuovo design, così che la schermata iniziale dell'app sia coerente con il riepilogo e la scheda titolo.\n\n**Criteri di accettazione**\n- [ ] Nel design «quadro», l'elenco dei portafogli è reso nella veste del nuovo design con barra laterale, tipografia e superfici coerenti con il riepilogo\n- [ ] La creazione di un nuovo portafoglio funziona con lo stesso flusso funzionale del design «mastro»\n- [ ] Rinomina e eliminazione di un portafoglio sono accessibili e funzionanti\n- [ ] Il dialogo di scelta portafoglio (`PortfolioSelectDialog`) è stilizzato in coerenza con il design «quadro»\n- [ ] I dati provengono dagli stessi hook estratti in US-049\n- [ ] I `data-testid` dei punti di verifica principali sono presenti nel markup del design «quadro»\n\n---\n\n## Soluzione tecnica\n\nLa spec estende all'ultima schermata mancante il meccanismo già rodato da US-051 (riepilogo) e US-052 (scheda titolo): `DashboardPage.tsx` sceglie oggi un'unica resa (mastro) hardcoded; diventa un dispatcher sottile che, come già fa `PortfolioDetailPage.tsx` fra `RiepilogoMastro`/`RiepilogoQuadro`, monta `DashboardMastro` o `DashboardQuadro` in base a `useDesign()`, entrambe alimentate dallo stesso `usePortafogli()` (US-049) — nessun nuovo fetch, nessun ricalcolo.\n\n### Decisioni architetturali\n\n1. **Estrazione di `DashboardMastro.tsx`** — Il markup mastro attuale di `DashboardPage.tsx` (tabella `.mastro`, stato vuoto, `CreatePortfolioForm`) si sposta verbatim in `client/src/views/DashboardMastro.tsx`, con un'interfaccia `DashboardProps` condivisa (`portfolios`, `loading`, `error`, `onOpen`, `onCreated`) — stesso schema di `RiepilogoProps`. Nessun cambiamento di comportamento.\n\n2. **Nuova `DashboardQuadro.tsx`** — Vista quadro dell'elenco: header `.titolo-pagina` (h1 «Portafogli» + sottotitolo con conteggio), un `.pannello` con `table.dati` (stesse classi già usate da `RiepilogoQuadro` per la tabella titoli) che elenca i portafogli con riga cliccabile (`role=\"button\"`, `tabIndex`, `onKeyDown` — stesso pattern di accessibilità di `RiepilogoQuadro.tsx:273-286`) verso `/portfolio/:id`; stato vuoto con `.placeholder-quadro` (classe già esistente in `quadro.css`, usata da `RiepilogoQuadro` per «Nessun titolo iscritto»/«Nessun titolo posseduto» — stesso pattern, non una terza variante). Per riferimento visivo: `docs/mockups/US-053/index.html`.\n\n3. **Estrazione di `useCreaPortafoglio`** — `CreatePortfolioForm.tsx` porta oggi sia lo stato (name/error/loading) sia la copy mastro-specifica («Registra a mastro», «Mod. 01/A», «Nota del contabile…») intrecciati nello stesso file. Lo stato e la chiamata `POST /api/portfolios` si estraggono in `client/src/hooks/useCreaPortafoglio.ts` (`{ name, setName, error, loading, handleSubmit }`), riusabile da entrambe le presentazioni senza duplicare validazione/fetch. `CreatePortfolioForm.tsx` viene refattorizzato per usare l'hook, senza cambi di copy o di classi (mastro invariato).\n\n4. **Nuova `CreaPortafoglioQuadro.tsx`** — Presentazione quadro del modulo di creazione, stesso hook di TASK-02, montata dentro `DashboardQuadro`. Riusa esattamente le classi già spedite da US-051 per il modulo «Gestione del conto» di `RiepilogoQuadro.tsx` (`.pannello` > `.corpo-pannello.modulo-gestione` > `.campo-gestione` > `.riga-campo` con input + bottone + `.errore-campo-quadro` inline) — zero nuove classi CSS per il form, solo copy propria («Nuovo portafoglio», «Crea» invece di «Registra a mastro»).\n\n5. **Restyle di `PortfolioSelectDialog.tsx`** — Il dialogo è oggi interamente a stile inline: le proprietà cromatiche risolvono già i var() aliasati in `quadro.css` (`--carta`→`--superficie-2`, `--oro`→`--ambra`), ma raggio, ombra, spaziatura e — soprattutto — l'assenza di hover sulle righe selezionabili restano fissi e non possono differenziarsi per design tramite i soli alias di variabili. Le proprietà di stile vengono spostate da inline a classNames (`overlay-dialog`, `dialog-portafoglio`, `dialog-intestazione`, `dialog-corpo` — già presente come testid, ora anche come classe —, `riga-portafoglio`, `radio-custom`, `dialog-bottoni`), preservando struttura DOM e tutti i `data-testid` esistenti (nessuna rottura di US-027). Le regole equivalenti alle attuali proprietà inline vengono aggiunte sotto `:root[data-design='mastro']` in `ledger.css` (nessun cambiamento visivo per il mastro), e regole coerenti col quadro (superficie, `--raggio`, `--ombra`, hover `--superficie-2` sulle righe, focus-visible `--accento`) sotto `:root[data-design='quadro']` in `quadro.css` — stessa convenzione della sezione 15 (\"Componenti React condivisi col Libro Mastro\"). Riferimento visivo: `docs/mockups/US-053/index.html` (sezione dialogo).\n\n### Rischi e mitigazioni\n\n- **Rottura di test esistenti su `PortfolioSelectDialog`** — US-027 seleziona elementi per `data-testid` (`dialog-corpo`, `portafoglio-option-{id}`, `btn-annulla-dialog`, `btn-conferma-dialog`): il refactoring TASK-05 deve preservarli invariati. Nessun nuovo `data-testid` sostituisce quelli esistenti.\n- **Duplicazione di logica fra `CreatePortfolioForm` e `CreaPortafoglioQuadro`** — Mitigata dall'hook condiviso (TASK-02): l'unica differenza fra le due presentazioni è markup e copy, mai validazione o fetch.\n- **Rinomina/eliminazione non richiedono nuovo codice** — sono già interamente implementate nella scheda \"Gestione del conto\" di `RiepilogoQuadro.tsx` (US-051). Il criterio di accettazione è soddisfatto verificando che il percorso elenco → dettaglio → rinomina/eliminazione → ritorno all'elenco funzioni end-to-end, non aggiungendo un secondo punto di gestione nell'elenco stesso.\n\n---\n\n## Strategia di test\n\nLa spec coinvolge UI e interazione utente: la strategia E2E è obbligatoria.\n\n### Test E2E\n\n**Framework:** Playwright (già in uso nel progetto).\n**Video demo:** Registrato per il solo scenario dimostrativo, salvato in `docs/test-results/US-053/`.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Elenco vuoto nel quadro | Con design «quadro» attivo e nessun portafoglio, la schermata iniziale mostra il placeholder di elenco vuoto invece della tabella |\n| Elenco popolato e navigazione | Con portafogli esistenti, le righe sono visibili e cliccabili; il clic naviga al dettaglio del portafoglio corretto |\n| Creazione di un nuovo portafoglio (demo) | Dal pannello «Nuovo portafoglio» del quadro, l'utente compila il nome, conferma, il portafoglio compare nell'elenco senza ricaricare |\n| Percorso rinomina/eliminazione end-to-end | Dall'elenco quadro si apre il dettaglio, si rinomina e poi si elimina il portafoglio tramite il modulo \"Gestione del conto\" già esistente (US-051); dopo l'eliminazione si torna all'elenco e il portafoglio non compare più |\n| Dialogo di scelta portafoglio in stile quadro | Con design «quadro» attivo, il dialogo (`PortfolioSelectDialog`) mostra la superficie e le righe selezionabili in stile quadro coerente, resta funzionalmente operativo (selezione + conferma) |\n\n### Verifica di non regressione\n\n`npm run check` deve restare verde, e la suite E2E esistente (incluso `US-027__dialog-elenco-portafogli.spec.ts` e `US-006__rinomina-elimina-portafoglio.spec.ts`, entrambi sul design mastro) deve passare senza modifiche ai propri test — il refactoring di `PortfolioSelectDialog` è un cambio di implementazione, non di comportamento osservabile nel design mastro.\n\n### Registro chiavi E2E\n\nNessun ISIN coinvolto in questa spec — nessuna voce da aggiungere in `e2e/support/titoli.ts`.\n\n### Mockup di riferimento\n\n\U0001F3A8 Mockup generato in `docs/mockups/US-053/` — `index.html` (elenco, stato vuoto, pannello di creazione, dialogo di scelta portafoglio restilizzato), con `shared.css`/`app.js`/`README.md` propri, coerenti con `docs/mockups/US-051/` e `docs/mockups/US-052/`.\n\n_Piano generato via ARchetipo Planning — 2026-08-20_"
