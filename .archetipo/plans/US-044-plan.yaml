schema: archetipo/plan/v2
spec_code: US-044
body: "# US-044: Elencare le posizioni chiuse in una sezione dedicata — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 12 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-008 — Vendite e posizioni chiuse\n**Priorità:** MEDIUM | **Punti:** 3\n**Bloccata da:** US-042 (DONE) — la tabella `sales`, il dominio `rigiocaRegistro`/`residuoPerIsin` e le tre viste aggregate sul residuo esistono già; US-043 (DONE) ha già aggiunto `realizedPnl`/`latentPnl`/`totalPnl`/`totalLoadCost` alle stesse viste. Questa spec non introduce un nuovo calcolo di P&L: filtra e presenta ciò che il dominio già sa.\n\n**User Story**\nCome Giulia, investitrice prudente, voglio che un titolo venduto interamente esca dalla tabella dei titoli posseduti ma resti consultabile con il suo risultato, in modo da non perdere la traccia di che cosa ha prodotto il guadagno già incassato (FR-026, FR-013).\n\n**Criteri di Accettazione**\n- [ ] Un ISIN con quantità residua 0 non compare nella tabella dei titoli posseduti\n- [ ] Una sezione \"Posizioni chiuse\" elenca ISIN, quantità complessivamente venduta, incasso e P&L realizzato\n- [ ] Il P&L realizzato di una posizione chiusa resta incluso nel P&L totale del portafoglio e non è mai sommato al valore attuale, a cui una posizione chiusa contribuisce 0\n- [ ] Un nuovo carico sullo stesso ISIN dopo una chiusura riapre la posizione nella tabella dei titoli posseduti senza cancellare la riga storica delle vendite\n\n---\n\n## Soluzione tecnica\n\nUS-042 aveva già lasciato la porta aperta a questa spec: `EnrichedPositionSummary.totalQuantity` a zero e la nota nel suo stesso commento («togliere la riga è US-044»). Il lavoro qui non è calcolare qualcosa di nuovo — `totalQuantity`, `soldQuantity` e `realizedPnl` esistono già, per ogni ISIN, in tutte e tre le viste — ma **partizionare** ciò che le viste già restituiscono in due letture con due scopi diversi: la tabella dei posseduti (FR-013, «che cosa ha il conto oggi») e la nuova sezione Posizioni chiuse («che cosa ha prodotto ciò che non si ha più»). L'unico dato che manca davvero è l'**incasso** complessivo per ISIN, che il criterio 2 chiede esplicitamente e che nessun campo attuale porta.\n\n### Il solo campo nuovo di dominio: `soldRevenue`\n\n`shared/domain/lottiLifo.ts` ha già, per ogni vendita attribuita, il `ricavo` (`salePrice × quantità`, introdotto da US-043 insieme a `pnlRealizzato`). Manca soltanto la somma a livello di registro — esattamente come `costoAttribuito` è la somma dei costi attribuiti sulle vendite:\n\n- `RegistroRigiocato` acquisisce `ricavoTotale` = Σ(`ricavo`) sulle vendite attribuite, calcolato in `rigiocaRegistro` accanto a `pnlRealizzato` e `costoAttribuito`, con la stessa riduzione;\n- `ResiduoPosizione` (e quindi `residuoPerIsin`) acquisisce `soldRevenue` = `registro.ricavoTotale`. **Mai `null`**, per la stessa ragione di `realizedPnl`: non dipende dal prezzo corrente, e un registro senza vendite ha incasso `0` — misurato, non assente.\n\nNessun campo esistente cambia valore: è un'aggiunta pura, come lo erano i quattro campi di US-043.\n\n### I tipi condivisi e le tre viste server\n\n`PositionSummary`, `EnrichedPositionSummary` e `PositionDetail` acquisiscono `soldRevenue: number`, con la stessa docstring di `realizedPnl`. In `server/src/api/positions.ts`, le tre rotte che già chiamano `residuoPerIsin` (`/positions/summary`, `/positions/enriched`, `/positions/:isin/detail`) propagano `soldRevenue: residuo.soldRevenue` nell'oggetto di risposta — un solo punto di lettura del dominio, come per i campi di US-043, quindi la propagazione è automatica sulle tre viste.\n\n**Nessuna nuova rotta.** La sezione Posizioni chiuse è un filtro su dati che il client ha già in mano (`enrichedPositions`), esattamente come il quadro del risultato di US-043 non ha richiesto un endpoint di aggregazione.\n\n### Il client: due letture della stessa lista, non due liste\n\nIn `PortfolioDetailPage.tsx`, `enrichedPositions` si partiziona in due `useMemo`:\n\n- `posizioniAperte` = `enrichedPositions.filter(ep => ep.totalQuantity > 0)`;\n- `posizioniChiuse` = `enrichedPositions.filter(ep => ep.totalQuantity === 0)`.\n\n**La tabella `tabella-riepilogo` itera solo su `posizioniAperte`** (criterio 1): righe, stato vuoto e nota a piè di tabella si spostano da `enrichedPositions` a `posizioniAperte` senza altro cambiamento di struttura.\n\n**Il riquadro `valore-totale-portafoglio` si calcola su `posizioniAperte`, non più su `enrichedPositions`.** È il punto in cui il criterio 3 va preso alla lettera due volte: una posizione chiusa non deve contribuire al valore attuale (già vero: `currentValue` a residuo 0 è `currentPrice × 0`), ma **non deve nemmeno comparire nei denominatori** del riquadro («N di M posizioni valorizzate») — altrimenti il riepilogo direbbe che il conto ha M posizioni quando FR-013 ne conta M − (chiuse). Da questo segue una distinzione che l'implementazione **deve** cogliere, sollevata dal mockup (`docs/mockups/US-044/esaurito.html`):\n\n- quando `posizioniAperte.length === 0` — nessuna posizione aperta, che il portafoglio sia vergine o interamente liquidato — il valore attuale è **€ 0,00 misurato** (stessa disciplina `zero-misurato` di US-043): il conto è stato fatto, ed è zero perché non resta nulla da valorizzare, non perché un prezzo sia irreperibile. Oggi quel ramo mostra invece «–» con la classe `assente`, che direbbe «dato non disponibile» — falso in questo caso;\n- il ramo `assente`/«–» resta per l'unico caso in cui si applica davvero: ci sono posizioni aperte, ma nessuna ha un prezzo in cache.\n\n**`QuadroRisultato` continua a ricevere l'intero `enrichedPositions`, aperte e chiuse insieme, senza filtro.** Non è un'omissione: è la condizione che rende vero il criterio 3 nella sua prima metà — il realizzato di una posizione chiusa deve restare nel P&L totale del portafoglio, e `QuadroRisultato` lo somma già su tutte le posizioni che riceve (il suo `latentPnl` per una posizione chiusa è `0` misurato, non `null`, quindi non la esclude nemmeno dal denominatore della percentuale). Filtrare l'array qui perderebbe silenziosamente il realizzato delle posizioni chiuse dal totale del portafoglio — l'esatto contrario di quanto il criterio chiede.\n\n**Distinguere «portafoglio vuoto» da «portafoglio interamente venduto».** Il messaggio odierno dello stato vuoto («Il registro è ancora bianco… nessun titolo è stato ancora iscritto») è falso quando `enrichedPositions.length > 0` ma `posizioniAperte.length === 0`: il conto ha una storia, non è vergine. Si aggiunge un secondo ramo — stesso contenitore visivo (`dettaglio-placeholder`), testo dedicato che rimanda alla sezione Posizioni chiuse qui sotto, `data-testid` proprio (`riepilogo-tutte-chiuse`) per non confondere le due condizioni nei test.\n\n### La sezione «Posizioni chiuse»\n\nSotto la tabella dei posseduti, visibile quando `posizioniChiuse.length > 0` (criterio 2). Segue `docs/mockups/US-044/index.html`: un riquadro con fascia carminio a sinistra — la stessa convenzione già in uso in `client/src/ledger.css` per `.riquadro-residuo.chiuso` (un lotto senza residuo prende l'accento carminio) — con un capo che porta il timbro «Sola consultazione» prima della tabella, a dichiarare visivamente che qui non si agisce, si legge. Dentro, un'altra tabella `.mastro` (variante `.chiuse`) e non un elenco di card: le quattro cifre richieste sono serie numeriche in colonna, ed è esattamente il caso d'uso di `.mastro`.\n\nColonne: Denominazione · ISIN, **Chiusa il**, Quantità venduta, Incasso, P&L realizzato. La colonna «Chiusa il» non è nell'elenco letterale del criterio ma costa quasi nulla: è la data dell'ultima vendita che ha azzerato il residuo, e si legge dal registro **già disponibile lato client** — `rigiocaRegistro(registro).vendite` è già ordinato `(saleDate, id)` crescente, quindi è la data dell'ultimo elemento. Nessun nuovo campo di dominio o di rotta per questa sola colonna: il client la calcola dalla stessa mappa `registri` che già alimenta `titoliScaricabili` e il registro unificato della linguetta Carico titoli.\n\n`tfoot` con i totali di riga (quantità venduta e incasso complessivi, P&L realizzato complessivo) — stessa meccanica del `tfoot` della tabella dei posseduti.\n\n`data-testid=\"tabella-posizioni-chiuse\"`, righe `data-testid=\"posizione-chiusa-${isin}\"`.\n\n### Il badge «riaperta» (criterio 4, la metà visibile)\n\nIl criterio 4 è vero **per costruzione** non appena la sezione precedente esiste: un nuovo carico sullo stesso ISIN alza `loadedQuantity`, `residuoPerIsin` lo rigioca da capo, `totalQuantity` torna positivo, l'ISIN rientra in `posizioniAperte` e sparisce da `posizioniChiuse` — nessuna riga di `sales` viene mai toccata, per lo stesso motivo per cui US-042 non l'ha mai permesso. Non c'è quindi un compito di backend per questo criterio: è un consumo diverso di dati che esistono già.\n\nResta un compito di interfaccia, piccolo e a costo pressoché nullo: nella tabella dei posseduti, un ISIN con `soldQuantity > 0` (ha una storia di vendite, anche se oggi è di nuovo posseduto per intero) porta un badge `.badge-riaperta` (↺) accanto al nome — `soldQuantity` esiste già da US-042, nessun nuovo campo. È il dispositivo che rende «consultabile» (la parola della user story) visibile anche mentre si guarda la tabella dei posseduti, e non solo aprendo la scheda o scorrendo il registro. Segue `docs/mockups/US-044/riapertura.html`.\n\n### Stili\n\nIn coda a `client/src/ledger.css`, a partire dal sottoinsieme stabile di `docs/mockups/US-044/shared.css`: `.blocco-posizioni-chiuse`, `.mastro.chiuse`, `.capo-chiuse`, `.timbro.carminio` (verificare se il timbro carminio esiste già in altra forma prima di duplicarlo), `.badge-riaperta`, e le regole per il ramo «zero misurato» del riquadro del valore totale se non già coperte dalle classi introdotte da US-043. Nessuna regola preesistente riscritta — stessa disciplina di `US-042/shared.css` e `US-043/shared.css`.\n\n### Fuori perimetro\n\n- Una colonna «P&L realizzato» nella tabella dei posseduti (il caso di una posizione parzialmente venduta e non richiusa è già coperto dal quadro complessivo di US-043).\n- La scheda titolo di un ISIN chiuso o riaperto: resta quella già disegnata da US-018/US-042, nessuna modifica.\n- Qualunque effetto sul grafico della posizione o del portafoglio (US-045).\n- Un archivio permanente delle chiusure: «Posizioni chiuse» è una lettura **derivata**, filtrata su «quantità residua 0 in questo istante», non una tabella a parte con vita propria — la traccia storica vera resta il registro di US-042 (`sales`), mai cancellato.\n\n---\n\n## Strategia di test\n\nIl solo calcolo nuovo (`ricavoTotale`/`soldRevenue`) è testato a livello di dominio, come i campi di US-043; il resto della spec è un cambiamento di **presentazione** su dati già corretti, quindi il peso dei test si sposta sull'interfaccia e sui casi limite di partizione (nessuna aperta, nessuna chiusa, entrambe).\n\n- `server/tests/lottiLifo.test.ts` (esteso): `ricavoTotale` come somma dei ricavi su più vendite dello stesso ISIN; `soldRevenue === 0` su un registro senza vendite; `soldRevenue` coerente con Σ(`salePrice × quantity`) delle vendite su un caso con più lotti e vendite parziali; nessuna regressione sui campi esistenti (`realizedPnl`, `totalLoadCost`, `totalPnl`, ecc. — stessi numeri di US-043).\n- `server/tests/api.positions.summary.test.ts`, `api.positions.enriched.test.ts`, `api.positions.detail.test.ts` (estesi): dopo una vendita che azzera il residuo (nuovo scenario, oltre a quello parziale già coperto da US-042/US-043), le tre viste riportano `totalQuantity: 0`, `soldRevenue` coerente con l'incasso reale, `avgLoadPrice: null`, `realizedPnl` invariato rispetto a prima dell'azzeramento; regressione — un ISIN senza vendite riporta `soldRevenue: 0`.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`e2e/`, fixture `archivio` obbligatoria — mai `try/finally`, come da `CLAUDE.md`).\n**Registrazione video:** solo lo scenario dimostrativo (campo *Dimostra* della spec), salvato con `page.video().saveAs('docs/test-results/US-044/demo-posizioni-chiuse.webm')` in un `afterEach` dopo `page.close()`.\n**Dati:** una nuova costante `TITOLO_US_044` in `e2e/support/titoli.ts` (ISIN mai usato altrove, di proprietà del file dimostrativo, verificata da `npm run check:chiavi`). I carichi e le vendite si registrano via API (`aggiungiPosizione`, `registraVendita`) dentro il portafoglio della fixture, come già in US-042/US-043; gli ISIN aggiuntivi usati solo per creare carichi/vendite via API (mai per interrogare o seminare la cache `securities`) non richiedono una voce in `titoli.ts` — il registro tiene traccia delle sole chiavi che toccano quella cache condivisa. Date sempre espresse in giorni indietro da adesso, mai fisse.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Vendita totale, sparizione e sezione Posizioni chiuse (**demo**) | Portafoglio con due titoli: uno con un solo carico che l'utente vende per intero via API, l'altro tenuto normalmente. Aprendo il Riepilogo, la tabella dei posseduti elenca solo il secondo titolo; la sezione *Posizioni chiuse* elenca il primo con ISIN, quantità venduta, incasso e P&L realizzato corretti; il *valore attuale totale* coincide esattamente col valore del solo titolo ancora posseduto — la posizione chiusa non lo altera. |\n| Riapertura dopo la chiusura | Sullo stesso ISIN appena chiuso, un nuovo carico via API lo fa rientrare nella tabella dei posseduti (con il badge «riaperta») e uscire da *Posizioni chiuse*; il registro unificato nella linguetta *Carico titoli* mostra ancora, intatta, la vendita storica. |\n| Più posizioni chiuse insieme | Un secondo ISIN, chiuso a sua volta, compare accanto al primo in *Posizioni chiuse*, ciascuno con le proprie cifre — nessuna riga si confonde con l'altra. |\n| Portafoglio interamente venduto | Con tutte le posizioni azzerate: la tabella dei posseduti mostra lo stato vuoto dedicato (testo diverso da «nessun titolo mai iscritto»), il *valore attuale totale* è **€ 0,00 misurato** (non «–»), *Posizioni chiuse* porta tutte le posizioni, e il quadro del risultato mostra il realizzato pieno con il latente a zero misurato — coerenza numerica fra le tre superfici verificata a schermo. |\n\nGli scenari senza video vivono in `e2e/US-044__posizioni-chiuse-varianti.spec.ts`, sorello del file dimostrativo (stessa regola della coppia `US-026__*`, dato che `test.use()` del video non è limitabile a un `describe`).\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono in `docs/mockups/US-044/` — `index.html` (il riepilogo a regime: tabella dei posseduti con tre titoli, sezione Posizioni chiuse con due righe, quadro del risultato che ne comprende il realizzato), `riapertura.html` (il caso limite del criterio 4, a due pannelli prima/dopo, col badge «riaperta»), `esaurito.html` (il portafoglio interamente venduto: stato vuoto dei posseduti, valore attuale € 0,00 misurato, Posizioni chiuse con tutte le posizioni) — con `README.md` che motiva ogni scelta, inclusa la ragione per cui la sezione è un riquadro a sé e non una colonna «stato» nella tabella esistente.\n\n_Piano generato con ARchetipo Planning — 12 agosto 2026_\n"
