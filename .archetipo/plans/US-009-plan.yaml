schema: archetipo/plan/v2
spec_code: US-009
body: "# US-009: Registrare lo storico dei prezzi osservati e mostrarlo nella scheda titolo — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 10 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-002 — Ricerca titoli e dati di mercato\n**Priorità:** HIGH | **Punti:** 3\n**Bloccata da:** US-007 (stato `DONE` — nessun rischio di sequenza)\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio che ogni prezzo rilevato durante gli aggiornamenti che faccio venga conservato in uno storico locale e mostrato nella scheda del titolo, in modo da vedere come si è mosso un titolo nel tempo senza che l'app faccia una sola richiesta in più alla fonte (FR-018, ADR-008).\n\n**Criteri di Accettazione**\n- [ ] Ogni rilevazione di prezzo andata a buon fine registra un'osservazione (ISIN, prezzo, istante di rilevamento, fonte) nello storico locale\n- [ ] La registrazione non genera alcuna richiesta aggiuntiva alla fonte: avviene solo lungo gli aggiornamenti già esistenti (ricerca titolo, scheda titolo, aggiornamento massivo dei titoli obsoleti)\n- [ ] Una rilevazione il cui prezzo coincide con un'osservazione già registrata per lo stesso ISIN nello stesso giorno (giorno civile di Roma) non produce una nuova riga; due giorni distinti generano due righe anche a prezzo invariato\n- [ ] Due rilevazioni dello stesso giorno con prezzi diversi restano entrambe registrate, come osservazioni distinte\n- [ ] La scheda del titolo mostra sotto «Carichi registrati» una tabella «Storico prezzi» con le osservazioni in ordine temporale decrescente\n- [ ] I titoli già presenti in archivio compaiono nello storico con il prezzo attualmente in cache come prima osservazione\n- [ ] Un titolo con una sola osservazione mostra comunque la tabella con quella riga; nessun valore è stimato o interpolato per i periodi non osservati\n\n---\n\n## Soluzione tecnica\n\nLo storico è **osservazionale** (ADR-008): non si recupera, si accumula. La soluzione sfrutta il fatto che i tre percorsi di aggiornamento citati dal criterio 2 — Ricerca titoli, comando «Aggiorna dati» della scheda (US-030), aggiornamento in blocco dei titoli obsoleti (US-035) — passano **tutti** da `GET /api/securities/:isin`. Ne segue che un unico punto di scrittura sul server li copre integralmente e che non viene scritta una riga di codice di recupero nuova: il criterio «nessuna richiesta aggiuntiva» è vero per costruzione, non per disciplina.\n\n- **Nuova tabella `price_observations`** (`isin`, `price` NOT NULL, `observed_at` unix NOT NULL, `observed_day` TEXT `YYYY-MM-DD` NOT NULL, `data_source` nullable) con **indice UNIQUE su `(isin, observed_day, price)`** e indice di lettura su `(isin, observed_at)`. La regola di deduplica dei criteri 3 e 4 diventa così un vincolo del database più un `onConflictDoNothing()`, non un `if` da tenere allineato: stesso giorno e stesso prezzo collidono e non producono riga, prezzo diverso nello stesso giorno passa, giorno diverso a prezzo invariato passa. Il confronto su un `REAL` è sicuro perché il valore messo a confronto è lo stesso `double` prodotto dal parser della fonte, non una cifra riformattata.\n- **`price` è NOT NULL per scelta**: un rilevamento senza prezzo non è un'osservazione, ed è la stessa disciplina con cui US-034 classifica `never-fetched` una riga in cache priva di prezzo. La registrazione viene semplicemente omessa.\n- **Il giorno civile di Roma si calcola in un posto solo**: `giornoCivileRoma(date)` entra in `server/src/domain/marketHours.ts`, che già ospita l'unica implementazione DST-aware del fuso (`getRomeParts`). Nessuna seconda regola di calendario nasce altrove.\n- **La registrazione vive nel solo ramo di recupero fresco** di `GET /api/securities/:isin`, accanto a `upsertSecurity`. Il ramo in cui la guardia di buona cittadinanza risponde dalla cache con `confirmation` **non registra nulla**: la fonte non è stata contattata, e timbrare «osservato adesso» un prezzo rilevato ieri produrrebbe un'osservazione mai avvenuta — indistinguibile da una vera. Anche i rami `404` e `502` non scrivono, coerentemente con il fatto che già oggi non toccano l'archivio.\n- **Backfill dei titoli già in archivio (criterio 6)** in `runMigrations()`, dopo `migrate()`: una osservazione per ogni riga di `securities` con `price` non nullo, usando `fetched_at` come istante e il suo `data_source`. È **idempotente per costruzione** grazie all'indice UNIQUE, quindi ogni riavvio del server lo riesegue senza effetti. È scritto in TypeScript e non in SQL di migrazione perché il giorno civile deve venire dalla stessa implementazione del percorso di runtime: `date(fetched_at, 'unixepoch', 'localtime')` dipende dal fuso dell'host e assegnerebbe un giorno diverso alle rilevazioni prossime alla mezzanotte, cioè due regole per lo stesso concetto.\n- **Lettura dentro `PositionDetail`**, con un nuovo campo `priceHistory: PriceObservation[]` ordinato `observed_at DESC, id DESC`, e un tipo condiviso `PriceObservation { price, observedAt, dataSource: DataSource | null }`. La scheda rilegge già `/detail` dopo ogni aggiornamento riuscito (US-030): la tabella dello storico si riscrive senza logica di ricarica nuova, e prezzo attuale in testa e prima riga dello storico non possono divergere perché provengono dalla stessa lettura. Un endpoint separato avrebbe richiesto un secondo innesco e avrebbe potuto mostrare uno storico incoerente con la cifra scritta sopra.\n- **Client**: quarta sezione «Storico prezzi» in `SchedaTitolo.tsx`, dopo «Carichi registrati», che riusa i formattatori già presenti (`dataRilevazione`, `prezzo`, `nomeFonte`, `simboloDi`) e i timbri di provenienza in formato minuto. La tabella è presente anche con una sola riga (criterio 7): una sezione assente sarebbe indistinguibile da una funzionalità che non ha caricato. Nessuna cella è calcolata per interpolazione, e la nota di sezione dichiara che i giorni non osservati restano vuoti (ADR-003).\n- **Fuori scopo dichiarato**: il «pettine delle osservazioni» presente nei mockup resta una esplorazione visiva e non viene implementato — richiederebbe una scala temporale e non serve nessun criterio di accettazione. La sezione implementata è la tabella con la sua nota.\n\n---\n\n## Strategia di test\n\nIl percorso di **scrittura** e quello di **presentazione** si provano su due piani diversi, e la separazione è deliberata: solo i test di integrazione dispongono delle due leve necessarie a simulare «due rilevazioni in giorni diversi», cioè l'adapter iniettabile e l'orologio congelato (`SecuritiesDeps.now`).\n\n- **Unit sulle funzioni pure**: `giornoCivileRoma` ai confini che contano — 23:30 UTC d'estate (giorno di Roma già successivo), i due passaggi di ora legale, mezzanotte locale — e la semantica di deduplica di `registraOsservazione` nei suoi quattro casi (stesso giorno stesso prezzo → una riga; stesso giorno prezzi diversi → due; giorni diversi prezzo invariato → due; prezzo nullo → nessuna).\n- **Integrazione sull'endpoint**: quali rami registrano e quali no. Recupero fresco → una riga con fonte e istante corretti; risposta della guardia con `confirmation` → **zero** righe (è il test che difende il criterio 2 e l'onestà del dato); `404` e `502` → zero righe; due recuperi a orologio spostato su due giorni distinti → due righe.\n- **Integrazione sul backfill**: una osservazione per ogni titolo con prezzo, nessuna per i titoli senza prezzo, e una seconda esecuzione che non aggiunge nulla.\n- **Integrazione su `/detail`**: ordine decrescente, `priceHistory` vuoto per un titolo senza osservazioni, `dataSource` nullo conservato come tale e mai reinterpretato come Borsa Italiana.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, specs in `e2e/`, fixture `archivio` in `e2e/support/`)\n**Registrazione video:** solo lo scenario dimostrativo (campo `Dimostra`), salvato in `docs/test-results/US-009/`; gli altri scenari girano senza video\n\n**Vincolo da conoscere prima di scrivere le spec.** Il pattern in uso per gli aggiornamenti (US-030, US-035) intercetta `**/api/securities/**` con `route.fulfill()`: così il server non gira e **nessuna osservazione viene scritta**. Lo scenario dimostrativo semina quindi le osservazioni direttamente in archivio con una primitiva nuova di `e2e/support/archivio.ts` — test-only e mai importata dal server, come le primitive esistenti sulla cache `securities` (US-029) — riproducendo lo stato che due aggiornamenti in giorni diversi avrebbero lasciato. Ogni spec riserva i propri ISIN in `e2e/support/titoli.ts`, un ISIN per file, e la fixture ripristina lo stato in teardown.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Storico con due rilevazioni (dimostrativo, con video) | L'utente apre un portafoglio, entra nel riepilogo, apre la scheda di un titolo che ha già due prezzi rilevati in giorni diversi e con quotazione diversa; scorre fino in fondo e legge sotto «Carichi registrati» la tabella «Storico prezzi» con due righe in ordine temporale decrescente, ciascuna con prezzo, data di rilevamento e fonte |\n| Una sola osservazione | L'utente apre la scheda di un titolo con una sola rilevazione in archivio: la tabella «Storico prezzi» è presente con quella riga, e nessuna cella mostra un valore stimato per i periodi non osservati |\n| Due prezzi diversi nello stesso giorno | L'utente apre la scheda di un titolo osservato due volte nello stesso giorno civile a prezzi diversi: entrambe le righe compaiono, distinte per ora di rilevamento |\n| Osservazione con fonte non registrata | L'utente apre la scheda di un titolo la cui osservazione non ha provenienza in archivio: la riga dichiara «Fonte non registrata» e non attribuisce il dato a Borsa Italiana |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-009/` — `index.html` (storico con più osservazioni) e `prima-osservazione.html` (la variante con una riga sola).\n\n_Piano generato con ARchetipo Planning — 10 agosto 2026_\n"
