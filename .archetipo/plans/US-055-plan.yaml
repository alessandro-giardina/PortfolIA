schema: archetipo/plan/v2
spec_code: US-055
body: "# US-055: Quadro strumenti — ricerca titoli — Piano di implementazione\n\n**Generato da:** Team di Pianificazione ARchetipo\n**Data:** 2026-08-20\n\n---\n\n## Spec\n\n**Epica:** EP-009 — Direzione visiva commutabile\n**Priorità:** MEDIUM | **Punti:** 3\n\n**User Story**\nCome utente di PortfolIA che preferisce il design «Quadro strumenti», voglio che la schermata di ricerca titoli per ISIN sia disponibile nel nuovo design, così che la consultazione di anagrafica e prezzo di un titolo sia coerente con il resto dell'app.\n\n**Criteri di accettazione**\n- [ ] Nel design «quadro», il campo di ricerca ISIN e il pulsante di invio sono resi nella veste del nuovo design\n- [ ] Il risultato della ricerca mostra nome, ISIN, prezzo, valuta, fonte del dato e data di rilevamento con la stessa informazione del design «mastro»\n- [ ] L'azione «Aggiungi a portafoglio» funziona come nel design «mastro»\n- [ ] I messaggi di errore e gli stati (caricamento, ISIN non trovato, dato non disponibile) sono resi in coerenza con il design «quadro»\n- [ ] I dati provengono dagli stessi hook estratti in US-049\n\n---\n\n## Soluzione tecnica\n\nQuarta e ultima applicazione del meccanismo già rodato da US-051 (riepilogo), US-052 (scheda titolo) e US-053 (elenco portafogli): `SecuritySearchPage.tsx` monta oggi un'unica resa mastro con il markup inline nella pagina; diventa un dispatcher sottile che chiama `useRicercaTitolo()` (già estratto in US-049, invariato) e passa il risultato a `RicercaMastro` o `RicercaQuadro` secondo `useDesign()`. Nessun nuovo fetch, nessuna seconda interpretazione della risposta della fonte, nessun tocco al server.\n\n### Decisioni architetturali\n\n1. **L'hook resta nella pagina, non nelle due viste.** US-052 chiama `useSchedaTitolo` dentro la vista; qui conviene il modello di US-053 (hook nella pagina, stato passato come props), per due ragioni concrete. La prima è funzionale: commutare design con un risultato a schermo non deve perderlo — se l'hook vive nella vista, il cambio di design smonta il componente e azzera `security`/`status`, e l'utente vede sparire la ricerca appena fatta. La seconda è di superficie: `useRicercaTitolo` espone quattordici campi, e passarli come oggetto unico tipizzato `RicercaProps = ReturnType<typeof useRicercaTitolo>` evita sia quattordici props sciolte sia due chiamate divergenti dell'hook.\n\n2. **Estrazione di `RicercaMastro.tsx` verbatim.** Il markup mastro attuale di `SecuritySearchPage.tsx` (form `.ricerca-isin`, `.riga-esito`, `.anagrafica` con scheletro, `.fonte-prezzo`, `.riquadro-vuoto`, `.avviso-conferma`, montaggio di `PortfolioSelectDialog`) si sposta in `client/src/views/RicercaMastro.tsx` insieme ai suoi tre helper locali (`formatPrice`, `formatRilevazione`, `campiAnagrafica`) e alla costante `SIMBOLI_VALUTA`. Nessun cambiamento di copy, classi o comportamento: per il mastro è un puro spostamento di file. `<Guscio>`, `linguette` e `registro` restano nella pagina, che è ciò che i due design condividono.\n\n3. **Nuova `RicercaQuadro.tsx`, che riusa le classi già spedite.** Quasi nulla di questa schermata richiede superficie nuova, e il piano lo sfrutta: il modulo di ricerca riusa `.modulo-gestione`/`.campo-gestione`/`.riga-campo`/`.errore-campo-quadro` (sezione 16 di `quadro.css`, US-051); l'anagrafica riusa `.griglia-def`/`.voce-def` con `.dato.assente`, esattamente come `SchedaTitoloQuadro`; l'intestazione del risultato riusa `.testa-titolo`/`.stemma`/`.prezzo-vivo`; la guardia di buona cittadinanza riusa `.avviso.critico`; gli stati «non trovato» e «nessuna ricerca» riusano `.placeholder-quadro`. Riferimento visivo: `docs/mockups/US-055/ricerca-titoli.html`.\n\n4. **Formattatori dal dominio, non riscritti.** `RicercaQuadro` usa `prezzo`, `simboloDi` e `nomeFonte` da `client/src/domain/formattazione.ts` invece dei `formatPrice`/`SIMBOLI_VALUTA` locali del mastro, che restano dove sono per non toccare la resa mastro. È la stessa scelta di `SchedaTitoloQuadro`, e le due rese restano allineate perché leggono lo stesso `security` dell'hook: cambia il glifo, mai la cifra.\n\n5. **Sezione 21 di `quadro.css`, quattro elementi soltanto.** Le classi mastro `.ricerca-isin`, `.campo-isin`, `.riga-esito`, `.timbro`, `.scheletro`, `.fonte-prezzo`, `.riquadro-vuoto` non esistono nel quadro e non vengono portate: la vista quadro usa nomi propri. Le regole nuove sono quattro — il campo ISIN monospaziato col contatore `n/12`, la riga di esito `.riga-esito-quadro` con il bordo sinistro a codificare l'esito, lo scheletro `.scheletro-quadro` dell'anagrafica in attesa, e `.riga-provenienza-quadro`. Quest'ultima è deliberatamente **una classe nuova e non un riuso di `.riga-provenienza`** (sezione 15, scheda titolo): quella riga ospita il comando «Aggiorna dati» con `margin-left: auto`, questa non ha comando e allineerebbe male; separarle costa sei righe di CSS e evita che una futura modifica alla scheda titolo sposti silenziosamente la ricerca.\n\n6. **Il 502 diventa uno stato visibile.** Oggi il mastro racconta «fonte non raggiungibile» con la sola stringa `esito`, senza uno stato dedicato — e `status === 'error'` non ha alcun ramo di rendering nella pagina. Il quadro gli dà pillola ambra e placeholder propri, distinti dal 404: «le fonti non hanno risposto» e «le fonti dicono che il titolo non esiste» chiedono all'utente due azioni diverse. È una differenza di resa, non di dati: nessun campo nuovo dall'hook, che `status === 'error'` lo espone già.\n\n7. **`PortfolioSelectDialog` non si tocca.** US-053 lo ha già portato a classNames e stilizzato per entrambi i design (sezione 15f di `quadro.css`). `RicercaQuadro` lo monta invariato, e con esso `handleDialogConfirm` dell'hook — quindi «Aggiungi a portafoglio» naviga al portafoglio scelto con lo stesso `state.prefill` del mastro, per costruzione.\n\n### Rischi e mitigazioni\n\n- **Regressione su US-007/US-008/US-025 (design mastro).** Sono le tre spec che esercitano la ricerca; tutte e tre selezionano per ruolo o per `data-testid` sul markup mastro. Lo spostamento di TASK-01 deve essere verbatim: stessi testi, stesse classi, stesso `data-testid=\"btn-aggiungi-portafoglio\"`. Nessun rinominamento in questo task.\n- **Divergenza silenziosa fra le due rese.** Mitigata dal punto 1: un solo hook, un solo `status`, un solo `security`. Il criterio «stessa informazione del mastro» si verifica in E2E confrontando i campi resi nei due design sullo stesso ISIN seminato.\n- **Latenza della fonte nei test.** Il percorso di ricerca contatta Borsa Italiana e, come ripiego, MorningStar headless: 8-12 secondi e esito non deterministico. Gli scenari E2E seminano la propria chiave (`TITOLO_US_055`) prima di attraversare la ricerca, e gli stati «non trovato» e «fonte muta» si producono con `route.fulfill()` invece che con un ISIN inesistente vero — la stessa tecnica di US-007/US-008.\n\n---\n\n## Strategia di test\n\nLa spec è interamente UI e interazione: la strategia E2E è obbligatoria e copre da sola i criteri di accettazione. Nessun test unitario nuovo lato server — nessuna riga di server cambia. `npm run check` resta il cancello di non regressione, incluso `check:chiavi` che verifica il registro delle chiavi E2E.\n\n### Test E2E\n\n**Framework:** Playwright (già in uso nel progetto).\n**Video demo:** registrato per il solo scenario dimostrativo, salvato in `docs/test-results/US-055/`. Lo scenario demo vive in un file separato perché `launchOptions` (slowMo) non è scopabile a un `describe` — stessa coppia di file di US-051/US-052/US-053.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Ricerca riuscita nel quadro (demo) | Dalla schermata di ricerca in design «mastro» l'utente commuta su «Quadro strumenti» senza ricaricare, digita l'ISIN seminato, invia, e vede comparire intestazione del titolo, prezzo, anagrafica completa e riga di provenienza nella veste del quadro |\n| Parità di informazione fra i due design | Sullo stesso ISIN seminato, i campi resi nel quadro (nome, ISIN, prezzo, valuta, fonte, istante di rilevamento) coincidono con quelli del mastro |\n| Aggiungi a portafoglio | Con un risultato a schermo nel design quadro, il bottone apre `PortfolioSelectDialog`, la scelta di un portafoglio naviga al suo dettaglio e il modulo di carico arriva precompilato con ISIN e prezzo |\n| ISIN non valido | Un codice di lunghezza errata mostra l'errore inline sotto il campo e nessuna richiesta parte verso il server |\n| Titolo non trovato | Con `route.fulfill()` a 404, la schermata quadro mostra la pillola «Dato non disponibile» e il placeholder «Titolo non reperito», senza alcun valore inventato |\n| Fonte non raggiungibile | Con `route.fulfill()` a 502, la schermata quadro mostra lo stato «fonte muta» — distinto dal non-trovato |\n| Stato di attesa | Con una risposta ritardata, la riga di esito mostra il punto pulsante e l'anagrafica lo scheletro, entrambi nella veste del quadro |\n| Non regressione mastro | Gli scenari esistenti di US-007, US-008 e US-025 passano senza modifiche ai test: lo spostamento del markup in `RicercaMastro.tsx` non cambia nulla di osservabile |\n\n### Registro delle chiavi E2E\n\nI due nuovi file spec richiedono **una chiave propria ciascuno** in `e2e/support/titoli.ts` — `TITOLO_US_055` per il file funzionale e `TITOLO_US_055_DEMO` per quello dimostrativo — con il campo `file` che ne dichiara il proprietario. Nessuna chiave esistente va condivisa: gli scenari che attraversano la ricerca fino al server seminano la propria (il `fetched_at` fresco evita il recupero reale da 8-12 secondi), mentre gli stati d'errore intercettano la rotta e non toccano l'archivio. `npm run check:chiavi` verifica entrambe le regole.\n\n### Mockup di riferimento\n\n\U0001F3A8 Mockup generato in `docs/mockups/US-055/` — `ricerca-titoli.html` con i sette stati della schermata (nessuna ricerca, attesa, trovato, non trovato, fonte muta, guardia di buona cittadinanza, ISIN non valido) tutti ispezionabili da un commutatore, più `shared.css`/`app.js`/`README.md` propri, coerenti con `docs/mockups/US-051/`, `US-052/` e `US-053/`.\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-055/`\n\n_Piano generato via ARchetipo Planning — 2026-08-20_"
