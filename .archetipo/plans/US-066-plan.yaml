spec_code: US-066
body: |
  # US-066: Escludere le posizioni chiuse dal grafico di composizione del portafoglio — Implementation Plan

  **Generated by:** ARchetipo Planning Team
  **Date:** 2026-08-21

  ---

  ## Spec

  **Epic:** EP-005 — Visualizzazione dei titoli
  **Priority:** HIGH | **Points:** 1

  **User Story**
  Come Alessandro, investitore-proprietario, voglio che il grafico «Composizione» nel Quadro Strumenti mostri soltanto i titoli che detengo attualmente, in modo da non essere confuso da un titolo venduto in passato che appare a valore zero mescolato tra le posizioni realmente aperte.

  **Acceptance Criteria**
  - Il grafico «Composizione» e il suo elenco a fianco sono calcolati soltanto sulle posizioni aperte (quantità detenuta > 0); una posizione chiusa non compare mai, indipendentemente dal fatto che abbia un prezzo in cache
  - La didascalia «Calcolato su N posizioni con prezzo — M escluse per prezzo mancante» conta le esclusioni soltanto tra le posizioni aperte, senza confondere una posizione chiusa a valore zero con una posizione aperta di prezzo mancante
  - La tabella delle posizioni chiuse (EP-008) continua a mostrare la posizione venduta, invariata: la correzione riguarda solo il grafico di composizione
  - Un test copre un portafoglio con almeno una posizione chiusa che ha ancora un prezzo valorizzato in cache, verificando che non compaia nel grafico né nel conteggio della didascalia

  ---

  ## Technical Solution

  Stesso difetto già corretto in US-065 (`AggiornaObsoleti`), ma su un secondo punto di montaggio: `client/src/views/RiepilogoQuadro.tsx` riga 372 passa `enrichedPositions` — l'array **non filtrato**, comprese le posizioni chiuse con `totalQuantity === 0` — al componente `Composizione`, invece di `posizioniAperte`, l'array già calcolato dall'hook `useDatiPortafoglio.ts` (righe 154-156: `enrichedPositions.filter((ep) => ep.totalQuantity > 0)`). La funzione pura `calcolaComposizione` (`client/src/domain/composizione.ts`) filtra solo su `currentValue !== null`: non ha e non deve avere alcuna nozione di posizione aperta/chiusa, quindi non può da sola escludere una posizione chiusa che ha ancora un prezzo in cache — il filtro per stato aperto/chiuso deve avvenire a monte, nel chiamante.

  È stato verificato che `<Composizione` ha un **unico punto di montaggio** in tutto il client (`RiepilogoQuadro.tsx:372`): il design «libro mastro» (`RiepilogoMastro.tsx`) non ha alcun pannello Composizione, quindi — a differenza di US-065, che doveva correggere due punti di montaggio (mastro e quadro) — qui basta un solo intervento.

  - Rinominare la prop di `Composizione` da `enrichedPositions` a `posizioniAperte` (stesso nome esplicito già usato da `AggiornaObsoleti.tsx`, che rende impossibile passare per errore l'array non filtrato) e aggiornare l'interfaccia, la destrutturazione e il commento JSDoc che oggi descrive la prop come «le stesse del riepilogo».
  - Aggiornare il punto di montaggio in `RiepilogoQuadro.tsx` per passare `posizioniAperte={posizioniAperte}` (valore già disponibile tra le props del componente, riga 72) al posto di `enrichedPositions={enrichedPositions}`.
  - Nessuna modifica al dominio puro `calcolaComposizione`/`composizione.ts`: la sua logica di esclusione per prezzo mancante resta corretta e testata; riceve solo l'input giusto.
  - Nessuna modifica alla tabella «Posizioni chiuse» (righe 397-462 di `RiepilogoQuadro.tsx`): resta sul suo array `posizioniChiuse` indipendente, invariata per costruzione.

  ---

  ## Test Strategy

  La correzione non tocca il dominio puro (già coperto da `composizione.test.ts`, che continua a valere invariato): il comportamento da provare è di integrazione — quale array arriva al componente — quindi il livello adatto è l'e2e, sullo stesso pattern di `US-065__conteggio-solo-posizioni-aperte.spec.ts`.

  - Registrare in `e2e/support/titoli.ts` gli ISIN riservati al nuovo file, seguendo la regola un-ISIN-per-file: una posizione aperta con prezzo valorizzato, una posizione aperta senza prezzo in cache (per provare che la didascalia continua a contare correttamente le esclusioni tra le sole posizioni aperte — usare il pattern MAI_RILEVATO o `archivio.rimuoviTitolo` a seconda di cosa risulta più semplice in fase di scrittura), e una posizione da vendere per intero mantenendo comunque un prezzo valorizzato in cache (il caso della spec).
  - Scenario principale: portafoglio con le tre posizioni sopra; venduta per intero la terza (`registraVendita`/`chiudiPosizione`, stesso helper di US-065); naviga sul design «quadro» (`localStorage.setItem('portfolia-design', 'quadro')` prima della navigazione, come in US-065 scenario (d)); verifica che il pannello `composizione-portafoglio` mostri **una sola fetta** (l'aperta con prezzo), che l'ISIN chiuso non compaia né nel grafico né nell'elenco a fianco, che la didascalia `.nota-composizione` conti le esclusioni solo tra le posizioni aperte (1 inclusa, 1 esclusa per prezzo mancante — mai 2 incluse, che sarebbe il sintomo del bug), e che `tabella-posizioni-chiuse` continui a elencare la posizione chiusa invariata.
  - Nessun nuovo test unitario di dominio: `calcolaComposizione` non cambia comportamento, cambia solo il chiamante.

  ### E2E Tests — User Simulation

  **Framework:** Playwright (`e2e/`, fixture `archivio` da `e2e/support/fixtures.ts`)
  **Video recording:** Solo lo scenario demo (il campo «Dimostra» della spec descrive un incremento filmabile: portafoglio con posizione chiusa a prezzo ancora in cache, grafico e didascalia corretti); lo scenario di verifica principale gira senza registrazione, in un file separato per rispettare il vincolo di `test.use({ slowMo })` a livello di file (non di `describe`), stesso schema della coppia `US-026__*` e `US-065__*-demo.spec.ts`.

  | Scenario | User flow description |
  |---|---|
  | Verifica principale | Alessandro apre un portafoglio (design quadro) con una posizione aperta prezzata, una aperta senza prezzo e una chiusa ma ancora prezzata in cache: il grafico «Composizione» mostra solo la fetta aperta prezzata, la didascalia conta 1 inclusa/1 esclusa, e «Posizioni chiuse» elenca comunque la posizione venduta |
  | Demo | Stesso portafoglio, registrato in video e salvato in `docs/test-results/US-066/`, per la revisione umana in fase di review |

  ---

