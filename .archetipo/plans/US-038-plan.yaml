schema: archetipo/plan/v2
spec_code: US-038
body: "# US-038: Mostrare il P&L del titolo accanto al suo grafico — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 11 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-007 — P&L e grafico del singolo titolo\n**Priorità:** HIGH | **Punti:** 3\n**Bloccata da:** US-037 (in REVIEW: il selettore di scala, `calcolaFinestra` e `ritagliaSerie` esistono già, e questa spec legge il loro ritaglio senza toccarlo)\n\n**User Story**\nCome Giulia, investitrice prudente, voglio vedere accanto al grafico il guadagno complessivo rispetto a quanto ho speso e, separatamente, quanto il titolo si è mosso nel periodo che sto guardando, in modo da non scambiare la performance di un periodo per il mio guadagno reale (FR-011, FR-012).\n\n**Criteri di Accettazione**\n- [ ] Sotto il grafico compaiono due metriche distinte ed etichettate: P&L da carico e variazione di periodo, ciascuna in € e in percentuale\n- [ ] Il P&L da carico considera tutti i carichi del titolo tramite il prezzo medio ponderato sulle quantità, e coincide con la «Differenza» di *Posizione a conto*: due letture dello stesso fatto non possono divergere\n- [ ] La variazione di periodo confronta la prima e l'ultima rilevazione comprese nella scala selezionata\n- [ ] Una scala che contiene meno di due rilevazioni mostra «dato non disponibile» per la variazione di periodo, mai zero\n- [ ] Cambiando scala la variazione di periodo si aggiorna, mentre il P&L da carico resta invariato perché non dipende dall'orizzonte\n- [ ] Le definizioni delle due metriche sono verificate da test sui calcoli, incluso il caso di più carichi a prezzi e quantità diversi\n\n---\n\n## Soluzione tecnica\n\nLa spec non aggiunge dati e non aggiunge richieste: mette **una accanto all'altra due cifre che la scheda sa già dire separatamente**, e il suo intero valore sta nel non farle confondere. Il P&L da carico misura il denaro dell'utente contro quello che ha speso; la variazione di periodo misura il mercato dentro la finestra scelta. Sono due fatti veri insieme — un titolo può essere in guadagno da carico e in calo nell'ultimo anno — e il difetto che questa spec deve rendere impossibile è che si sommino, si confrontino o si scambino l'uno per l'altro.\n\nDa qui discendono due rischi tecnici precisi, e il piano è costruito attorno a essi: che il P&L **diverga** dalla «Differenza» già mostrata in cima alla scheda (criterio 2), e che la variazione **ripieghi su zero** dove il dato non c'è (criterio 4).\n\n- **Il P&L da carico non è un calcolo nuovo: è un calcolo esistente a cui si dà finalmente un nome.** La rotta `GET /api/portfolios/:id/positions/:isin` già aggrega i carichi e produce `difference`/`differencePercent` con quattro righe in linea (`server/src/api/positions.ts`, ~175-186). Quelle righe si estraggono in `shared/domain/metricheTitolo.ts` come `calcolaPnlDaCarico({ loads, currentPrice })` — quantità totale, media ponderata, controvalore di carico, differenza e percentuale — e la rotta la chiama. È la stessa scelta di US-036/US-037: una regola che i criteri mettono alla prova deve stare in una funzione pura provabile, non dentro un gestore di rotta.\n- **Il criterio 2 si soddisfa non ricalcolando.** Il client **non** rifà il conto: il riquadro del P&L mostra `detail.difference` e `detail.differencePercent`, cioè esattamente i campi che la casella «Differenza» di *Posizione a conto* già mostra. Due letture della stessa variabile non possono divergere; due letture di due formule uguali sì, e basta un ordine di operazioni diverso.\n- **L'ordine delle operazioni non si «semplifica».** Il conto è `currentPrice × qty − avgLoadPrice × qty`, **non** `(currentPrice − avgLoadPrice) × qty`: algebricamente identici, in virgola mobile no. Il mockup mostra la seconda forma perché è la *spiegazione* del numero, non il modo di ottenerlo. Riscriverla dentro la funzione estratta cambierebbe l'ultimo bit in casi rari e farebbe divergere di un centesimo proprio le due cifre che il criterio 2 vuole identiche — con ogni test verde, perché nessuno confronta i due percorsi. L'estrazione deve quindi essere *letterale*, e un test di regressione su un caso con residuo binario la blocca.\n- **Anche il formattatore è parte del fatto.** `importo` oggi è una funzione privata di `SchedaTitolo.tsx` (riga 53). Se il nuovo riquadro ne scrivesse una seconda, due cifre uguali potrebbero comparire scritte in modo diverso — che per chi guarda è una divergenza, indipendentemente dall'aritmetica. Va spostata in `client/src/components/Foglio.tsx`, accanto a `dataCarico`/`dataRegistro`, e usata da entrambi; con essa la convenzione di segno (`+` / `−` tipografico) e le classi `guadagno`/`perdita`, così l'E2E del criterio 2 può confrontare le due **stringhe** invece di due valori «equivalenti».\n- **La variazione di periodo guarda le sole rilevazioni.** `calcolaVariazionePeriodo({ punti })` riceve il ritaglio che US-037 già produce (`ritagliaSerie(...).punti`) e filtra `origin === 'rilevazione'`: un prezzo di carico dice quanto ha pagato *l'utente*, non a quanto il mercato scambiava il titolo, e includerlo misurerebbe le sue decisioni invece del movimento del titolo. Conseguenza da mettere in conto e da dichiarare a schermo: una finestra con tre carichi e una sola rilevazione è «dato non disponibile», e il riquadro deve spiegare perché i carichi non contano.\n- **Meno di due rilevazioni: assenza dichiarata, mai zero (criterio 4).** L'esito è un'unione discriminata — `{ stato: 'disponibile', prima, ultima, valore, percentuale, giorni, rilevazioniComprese }` oppure `{ stato: 'non-disponibile', rilevazioniComprese, unica }` — perché il tipo deve rendere *impossibile* leggere un valore che non esiste. Un `valore: number` con `0` di ripiego non sarebbe un dettaglio di resa: «0,00 %» afferma che il prezzo non si è mosso, che è un'affermazione diversa da «non lo so» (ADR-003, FR-012).\n- **Lo zero misurato però resta.** Due rilevazioni allo stesso prezzo danno `0,00 %` e sono **disponibili**: il divieto riguarda lo zero al posto dell'assenza, non lo zero come misura. Il caso ha un test dedicato perché è esattamente quello che una guardia scritta male (`if (!valore) → non disponibile`) romperebbe, e la rottura sarebbe invisibile — un dato piatto reso indistinguibile da un dato assente, cioè la stessa confusione che ADR-008 rifiuta per la deduplica delle osservazioni.\n- **Percentuale indefinita con valore presente.** Se la prima rilevazione è a prezzo `0` la percentuale non è calcolabile e vale `null`, mai `Infinity`: è la stessa disciplina che il server applica a `differencePercent` su controvalore di carico nullo. Il valore assoluto resta invece mostrabile, e i due campi si dichiarano separatamente.\n- **Le due metriche stanno sotto il grafico, ma i loro dati vivono in due posti diversi.** La scala è stato locale di `GraficoTitolo` (US-037 ha deciso, con motivazione, di non sollevarla); i fatti della posizione stanno in `SchedaTitolo`, che ha `detail`. La cucitura è una prop di rendering: `GraficoTitolo` guadagna `sottoIlGrafico?: (contesto: { punti, finestra, scala, copertura }) => ReactNode` e la scheda le passa `<MetricheTitolo …>` con i campi di `detail`. L'alternativa — far scendere sei campi di posizione dentro un componente che non li usa — accoppierebbe il grafico al P&L senza alcun guadagno, e `GraficoTitolo` è già a 1140 righe.\n- **La prop va invocata in tutti e tre i rami d'uscita.** `GraficoTitolo` esce da tre punti: serie vuota (riga ~293), copertura assente (riga ~415) e disegno. Il P&L **non dipende dalla copertura**, quindi nei primi due i riquadri devono comparire lo stesso, con la sola variazione dichiarata non disponibile. Dimenticarne uno farebbe sparire il P&L proprio nelle finestre in cui l'utente si sta chiedendo se ha perso denaro — e nessun criterio parla di quel ramo, quindi va scritto qui.\n- **Il P&L non si ricalcola per finestra (criterio 5).** Vale la regola che US-037 ha già fissato per `avgLoadPrice`: la posizione è un fatto della posizione, non della finestra. Il riquadro porta un'etichetta esplicita «non dipende dalla scala», e quello di fianco «cambia con la scala»: il criterio diventa verificabile dall'utente e non solo dal test.\n- **Superficie verificabile per attributi.** `data-testid=\"metriche-titolo\"` sul contenitore; `pnl-da-carico` e `variazione-periodo` sui due riquadri, ciascuno con `data-stato=\"disponibile|non-disponibile\"`; i figli `pnl-da-carico-valore` / `-percentuale` e `variazione-periodo-valore` / `-percentuale`; `variazione-non-disponibile` sul timbro. Le asserzioni cadono su questi e mai sulla geometria.\n- **Fuori scopo, dichiarato:** il commutatore prezzo/valore (US-039), il P&L del portafoglio intero e i suoi cinque orizzonti (EP-006), qualunque nuovo endpoint o richiesta di rete — la scheda ha già in mano tutto ciò che serve. Restano intatte anche le altre due aggregazioni di `positions.ts` (vista arricchita e riepilogo): la duplicazione è nota, ma toccarle allargherebbe la spec a superfici che nessun criterio mette alla prova.\n- **Attenzione operativa:** `@portfolia/shared` si risolve su `shared/dist`, quindi le nuove funzioni non sono visibili al client finché non gira `tsc --build` alla radice; `shared/types/index.ts` deve riesportare il nuovo modulo di dominio come già fa con `../domain/serieTitolo.js`.\n\n---\n\n## Strategia di test\n\nLe due definizioni sono funzioni pure e portano da sole il peso del criterio 6: si provano con Vitest in `server/tests/`, accanto ai test di US-036/US-037. Il resto — che le due cifre compaiano etichettate, che una segua la scala e l'altra no, che l'assenza sia dichiarata invece che azzerata — è comportamento visibile e si prova con Playwright. Nessuna nuova integrazione è dovuta: il server non guadagna rotte, ne riscrive una internamente.\n\n- **Unit su `calcolaPnlDaCarico`**: tre carichi a prezzi **e** quantità diversi danno la media *ponderata* e non quella aritmetica (è il caso che il criterio 6 nomina esplicitamente, e le due medie coincidono solo a quantità uguali — un test con quantità uguali non proverebbe nulla); `currentPrice` assente ⇒ esito non disponibile, non zero; controvalore di carico nullo ⇒ percentuale `null` e non `Infinity`; un caso con residuo binario dà **esattamente** lo stesso numero prodotto dall'aritmetica in linea che la funzione sostituisce (regressione sull'ordine delle operazioni).\n- **Unit su `calcolaVariazionePeriodo`**: due rilevazioni ⇒ valore, percentuale e giorni fra i capi; i **carichi non entrano** (finestra con tre carichi e una sola rilevazione ⇒ non disponibile); zero o una rilevazione ⇒ non disponibile con il conteggio delle rilevazioni comprese; due rilevazioni allo stesso prezzo ⇒ **disponibile** con valore `0` (lo zero misurato non è l'assenza); prima rilevazione a prezzo `0` ⇒ percentuale `null` e valore presente; i capi si prendono dai punti ricevuti — già ritagliati e già ordinati — e non dalla serie intera.\n- **Integrazione**: i test esistenti di `GET /api/portfolios/:id/positions/:isin` restano verdi dopo la delega alla funzione estratta, con un caso multi-carico che fissa `difference` e `differencePercent`.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, spec in `e2e/`, fixture `archivio` di `e2e/support/`)\n**Registrazione video:** solo lo scenario dimostrativo (campo `Dimostra`), salvato in `docs/test-results/US-038/` con `page.video().saveAs()` dopo `page.close()`; gli altri scenari girano senza video\n\nVincoli della suite da rispettare: ogni file riserva il **proprio** ISIN in `e2e/support/titoli.ts` e lo aggiunge a `ISIN_CON_OSSERVAZIONI_E2E`; le osservazioni si seminano con `archivio.seminaOsservazioni`, che *sostituisce* lo storico, così ogni spec possiede la premessa che asserisce invece di ereditarla dal backfill d'avvio; il titolo va seminato con `fetched_at` di **adesso** (il default di `seminaTitolo`), perché è la guardia di buona cittadinanza a impedire un recupero reale — e un recupero registrerebbe un'osservazione a oggi, che cambierebbe il conteggio delle rilevazioni comprese sotto i piedi proprio degli scenari del criterio 4; la pulizia sta nella fixture e mai in un `finally`.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Le due misure, e il loro divorzio (dimostrativo, con video) | L'utente apre la scheda di un titolo con **due carichi a prezzi e quantità diversi** e rilevazioni distribuite sull'ultimo anno: sotto il grafico compaiono due riquadri etichettati, P&L da carico e variazione di periodo, ciascuno con la cifra in € e in percentuale. Il P&L riporta **la stessa stringa** della casella «Differenza» in cima alla scheda. Passando da «Tutto lo storico» a «Ultimo anno» la variazione di periodo cambia capi e cifra, mentre il P&L non si muove di un centesimo |\n| Una finestra con una sola rilevazione dichiara l'assenza | Scegliendo una scala che comprende una sola rilevazione, il riquadro della variazione porta il timbro «Dato non disponibile» e **nessun numero** — non «0,00 %» — e spiega quante rilevazioni ha trovato e quante ne servono; il riquadro del P&L resta valorizzato e identico a prima |\n| Lo zero misurato non è l'assenza | Con due rilevazioni allo stesso prezzo dentro la finestra, la variazione mostra `0,00 %` come **valore misurato**, distinguibile dal timbro di dato non disponibile: due stati diversi con due rese diverse |\n| I prezzi di carico non entrano nella variazione | Su una finestra che contiene più carichi ma una sola rilevazione, la variazione resta non disponibile: i carichi non fanno da capo del conto, e il riquadro lo dichiara |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-038/` — `index.html` mostra la «bilancia a due piatti» con il perno `≠` fra le due misure e le due righe di provenienza del numero; `variazione-non-disponibile.html` mostra il criterio 4: timbro al posto della cifra, P&L invariato, e l'elenco esplicito del perché il dato non c'è.\n\n_Piano generato con ARchetipo Planning — 11 agosto 2026_\n"
