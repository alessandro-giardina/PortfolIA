spec_code: US-063
body: |-
  # US-063: Formattare come gg/mm/aaaa hh:mm la data di rilevazione del prezzo nel design Quadro Strumenti — Implementation Plan

  **Generated by:** ARchetipo Planning Team
  **Date:** 2026-08-21

  ---

  ## Spec

  **Epic:** EP-009 — Direzione visiva commutabile
  **Priority:** LOW | **Points:** 2

  **User Story**
  Come utente di PortfolIA che lavora nel design «Quadro strumenti», voglio che la data accanto all'etichetta «Prezzo rilevato il» / «Rilevato il» sia scritta come gg/mm/aaaa hh:mm (es. 21/08/2026 13:17) invece che nel formato arcaico con mese in numeri romani (es. 21.VIII.2026 · 13:17), in modo che quella data rispetti la convenzione visiva del Quadro Strumenti e non porti con sé un tratto stilistico proprio dell'altro design, il Libro Mastro.

  **Acceptance Criteria**
  - In `RicercaQuadro.tsx`, la data accanto a «Prezzo rilevato il» è nel formato gg/mm/aaaa hh:mm
  - In `SchedaTitoloQuadro.tsx`, sia la riga «Rilevato il» in testata sia la colonna «Prezzo rilevato» della tabella storico osservazioni mostrano la data nel formato gg/mm/aaaa hh:mm
  - Il design Libro Mastro (`SchedaTitolo.tsx`, `RicercaMastro.tsx`) non viene toccato e continua a mostrare il formato arcaico a numeri romani
  - `dataRegistro` in `Foglio.tsx` resta invariata, poiché ancora in uso dal Libro Mastro
  - I test E2E esistenti che coprono queste due pagine del Quadro Strumenti passano verdi, aggiornati dove necessario per il nuovo formato di data
  - `npm run check` è verde

  ---

  ## Technical Solution

  Il formato gg/mm/aaaa hh:mm non è una novità da inventare: esiste già, identico, come funzione privata `dataRilevamento` duplicata in `RiepilogoQuadro.tsx` e `RiepilogoMastro.tsx` (introdotta in US-051/TASK-05). Questa spec applica **la stessa funzione, con lo stesso nome**, alle altre due copie del Quadro Strumenti — `SchedaTitoloQuadro.tsx` e `RicercaQuadro.tsx` — che oggi delegano invece a `dataRilevazione` → `dataRegistro` (numeri romani, condivisa col Libro Mastro via `Foglio.tsx`). Si tratta quindi di sostituire un'implementazione locale con un'altra locale, seguendo la convenzione già stabilita nel codebase di duplicare il formattatore in ogni vista invece di centralizzarlo — la stessa ragione già documentata nei commenti di `RiepilogoQuadro`/`RiepilogoMastro`.

  - **`RicercaQuadro.tsx`**: sostituire la funzione privata `dataRilevazione` (riga 16, oggi `${dataRegistro(fetchedAt)} · ${hh}:${mm}`) con `dataRilevamento`, stessa logica di `RiepilogoQuadro.tsx`/`RiepilogoMastro.tsx` (gg/mm/aaaa hh:mm via `getDate`/`getMonth`/`getFullYear`/`getHours`/`getMinutes`, tutti `padStart(2,'0')`). Aggiornare l'unico punto d'uso (riga ~340, `Prezzo rilevato il <b>{dataRilevazione(lastFetchedAt)}</b>`). Rimuovere l'import ora inutilizzato di `dataRegistro` da `../components/Foglio.js` (riga 3) — nessun altro simbolo di quel modulo è usato in questo file.
  - **`SchedaTitoloQuadro.tsx`**: stessa sostituzione per la funzione privata `dataRilevazione` (riga 22), rinominata `dataRilevamento` con l'implementazione condivisa. Aggiornare i due punti d'uso: la riga «Rilevato il» in testata (riga ~177, `dataRilevazione(detail.fetchedAt)`) e la colonna «Prezzo rilevato»/data di rilevamento nella tabella storico osservazioni (riga ~496, dentro il `.map` su `detail.priceHistory`). L'import da `../components/Foglio.js` (riga 5) diventa `import { dataCarico, quantita } from '../components/Foglio.js';` — `dataCarico` resta in uso per la tabella «Carichi registrati» (date senza orario, esplicitamente fuori perimetro), `dataRegistro` va rimosso.
  - **Non toccare**: `dataRegistro` e `dataCarico` in `Foglio.tsx` restano invariate (in uso dal Libro Mastro e dalla tabella carichi del Quadro); `dataRilevazione`/`formatRilevazione` in `SchedaTitolo.tsx` e `RicercaMastro.tsx` (Libro Mastro) restano invariate; `dataCivile` in `formattazione.ts` (titoli di pagina) resta invariata; i grafici (`graficoTela.ts`) e le tabelle di lotti carico/scarico non sono nel perimetro.
  - Aggiornare i commenti JSDoc delle due funzioni rinominate: oggi dicono «identica a SchedaTitolo»/«identica a SchedaTitoloQuadro» (Libro Mastro, numeri romani) — dopo la modifica vanno riformulati per dire che seguono la stessa convenzione di `RiepilogoQuadro`/`RiepilogoMastro` (gg/mm/aaaa hh:mm), non più quella del Libro Mastro, così il codice smette di affermare un'identità che non esisterà più.
  - Nessuna modifica al data model, alle API, o a `useSchedaTitolo`/`useRicercaTitolo`: è una spec di sola presentazione, il dato (`fetchedAt`/`observedAt`, unix seconds) non cambia.

  ---

  ## Test Strategy

  Nessuna modifica di logica di dominio o di rete: il rischio principale è di regressione visiva/testuale sulle due pagine del Quadro Strumenti, e di rottura silenziosa del Libro Mastro se per errore si tocca `Foglio.tsx` o i file mastro. La strategia usa i test E2E esistenti come rete di sicurezza e li estende con asserzioni esplicite sul nuovo formato, così il criterio di accettazione (gg/mm/aaaa hh:mm) è verificato meccanicamente e non solo a occhio.

  - Nessun test unitario dedicato: il progetto non ha una suite Vitest per `client/src` (i formattatori di vista sono coperti solo da E2E), e le due funzioni modificate replicano un'implementazione già esistente e già in produzione in `RiepilogoQuadro`/`RiepilogoMastro`.
  - Estendere le asserzioni esistenti su `istante-rilevazione` (in entrambi gli spec Playwright interessati) da semplice `toBeVisible()`/`toHaveText(precedente)` a un controllo di formato con una regex `/^\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}$/`, così il criterio «gg/mm/aaaa hh:mm» è verificato meccanicamente e non solo a occhio nel video demo.
  - Nella tabella storico prezzi di `SchedaTitoloQuadro`, estendere la verifica sulle righe `osservazione-{indice}` per includere lo stesso controllo di formato sulla cella data.
  - Verificare (lettura, nessuna modifica) che `e2e/US-052__quadro-scheda-titolo-demo.spec.ts` e `e2e/US-055__quadro-ricerca-titoli-demo.spec.ts` non contengano asserzioni sul formato a numeri romani — dai grep già eseguiti in fase di analisi non ne contengono, quindi il video demo continuerà a passare mostrando il nuovo formato senza modifiche al file.
  - Nessuna modifica prevista per gli spec del Libro Mastro (nessun file `*Mastro*.spec.ts` tocca `dataRilevazione`/`formatRilevazione` con asserzioni di formato): la garanzia di non regressione lì è data dal fatto che i file sorgente del Libro Mastro non vengono toccati.
  - Chiusura con `npm run check` (lint, typecheck client+e2e, registro chiavi E2E, vitest e2e-support, vitest server) e una run mirata di `npx playwright test US-052 US-055` per confermare che entrambe le coppie di spec (funzionale + demo) restano verdi.

  ### E2E Tests — User Simulation

  **Framework:** Playwright (`e2e/`, convenzioni da `CLAUDE.md`: fixture `archivio`, mai `try/finally`, `nomeUnico()`, chiavi ISIN registrate in `e2e/support/titoli.ts`)
  **Video recording:** Nessuna nuova registrazione: gli spec demo esistenti (`US-052__quadro-scheda-titolo-demo.spec.ts`, `US-055__quadro-ricerca-titoli-demo.spec.ts`) già salvano il video della scena dimostrativa e la mostreranno con il nuovo formato senza bisogno di modifiche — questa spec non introduce un nuovo scenario dimostrabile, solo un affinamento visivo di uno già filmato.

  | Scenario | User flow description |
  |---|---|
  | Ricerca titolo nel Quadro Strumenti | L'utente cerca un ISIN in `RicercaQuadro`, il titolo viene trovato, e la riga di provenienza mostra «Prezzo rilevato il» seguito dalla data in formato gg/mm/aaaa hh:mm (test esistente `US-055__quadro-ricerca-titoli.spec.ts`, asserzione di formato aggiunta) |
  | Apertura scheda titolo nel Quadro Strumenti | L'utente apre la scheda di un titolo con carichi e rilevazioni di prezzo; la riga «Rilevato il» in testata e ogni riga della tabella storico prezzi mostrano la data in formato gg/mm/aaaa hh:mm (test esistente `US-052__quadro-scheda-titolo.spec.ts`, asserzione di formato aggiunta) |
  | Regressione Libro Mastro | Le stesse pagine equivalenti nel design Libro Mastro (`SchedaTitolo.tsx`, `RicercaMastro.tsx`) restano invariate — nessuna modifica di codice in quei file, verificato per lettura e dalla suite E2E mastro esistente che continua a passare senza modifiche |

  ---

