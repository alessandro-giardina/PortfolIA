schema: archetipo/plan/v2
spec_code: US-036
body: "# US-036: Visualizzare il grafico dell'andamento del prezzo del titolo — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 10 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-007 — P&L e grafico del singolo titolo\n**Priorità:** HIGH | **Punti:** 5\n**Bloccata da:** — (nessuna dipendenza; US-009, che produce le rilevazioni su cui il grafico si regge, è già `DONE`)\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio vedere in fondo alla scheda titolo un grafico dell'andamento del suo prezzo dal primo carico registrato a oggi, in modo da cogliere a colpo d'occhio come si è mosso quel titolo rispetto a quanto l'ho pagato (FR-015, ADR-008).\n\n**Criteri di Accettazione**\n- [ ] In fondo alla scheda titolo, sotto «Storico prezzi», compare un grafico dell'andamento del prezzo unitario del titolo\n- [ ] La serie copre di default dal primo carico registrato a oggi\n- [ ] I punti provengono da due sole origini d'archivio — le rilevazioni registrate e i prezzi dei carichi — distinguibili fra loro nel grafico e dichiarati in legenda\n- [ ] Una linea di riferimento orizzontale segna il prezzo medio ponderato di carico, così che il guadagno latente sia leggibile come distanza fra curva e linea\n- [ ] Ogni punto corrisponde a un dato presente in archivio: nessun valore è stimato o interpolato, e il grafico dichiara che fra due punti non esistono rilevazioni\n- [ ] Un titolo con un solo carico e nessuna rilevazione mostra comunque il grafico con il punto disponibile, senza area vuota ambigua\n- [ ] La costruzione del grafico non genera alcuna richiesta alla fonte\n\n---\n\n## Soluzione tecnica\n\nIl criterio più stringente — «nessuna richiesta alla fonte» — non si difende con una regola di condotta ma con l'assenza di codice di rete: **questa spec non aggiunge nessun endpoint, nessuna query e nessuna `fetch`**. I quattro punti che il grafico deve disegnare sono già interamente contenuti nella risposta che la scheda legge oggi, `GET /api/portfolios/:id/positions/:isin/detail`: i prezzi di carico stanno in `detail.loads` (`loadDate`, `loadPrice`, ordinati per data crescente) e le rilevazioni in `detail.priceHistory` (`observedAt`, `price`, ordinate per istante decrescente). Il grafico è quindi una **seconda lettura degli stessi dati** che la tabella «Storico prezzi» già mostra, non una nuova acquisizione: il criterio 7 diventa vero per costruzione, e i criteri 3 e 5 — due sole origini d'archivio, nessun valore stimato — sono garantiti dal fatto che non esiste una terza sorgente da cui un punto potrebbe provenire.\n\n- **La composizione della serie vive in `shared/`, non nel componente.** Fondere due elenchi di granularità diversa (il carico ha una data civile `YYYY-MM-DD`, la rilevazione ha un istante unix al secondo) in una sola serie ordinata è una regola di dominio, e va provata da test unitari. Il posto è `shared/domain/serieTitolo.ts`, riesportato da `shared/types/index.ts` per non toccare l'unico entry point del pacchetto (`@portfolia/shared` risolve su `dist/types/index.js`): il precedente esiste già, perché quel file ospita da tempo funzioni a runtime (`isValidIsin`, `normalizeIsin`, `normalizzaDataSource`). La scelta di `shared` invece del server ha una motivazione precisa e non estetica: **US-037 deve cambiare scala senza una nuova richiesta al server** e US-039 deve ricalcolare la quantità detenuta a ogni data, quindi la serie va ricomponibile sul client; ma i test unitari del progetto vivono in `server/tests/` con Vitest e il client non ha (né qui acquisisce) infrastruttura di test. Una funzione pura in `shared` è l'unico posto che soddisfa entrambi i vincoli — un'implementazione sola, provata dall'infrastruttura che già esiste.\n- **La conversione della data di carico è deliberatamente indipendente dal fuso dell'host.** `loadDate` diventa un istante con `Date.parse(`${loadDate}T00:00:00Z`)`; il costruttore `new Date(anno, mese, giorno)` è **vietato** perché interpreta i campi nel fuso della macchina e sposterebbe un carico di un giorno a seconda di dove gira il test. È la stessa disciplina con cui `giornoCivileRoma` è nata in US-009 al posto di `strftime(..., 'localtime')`, e con cui il client formatta già `dataCarico(iso)` spezzando la stringa invece di costruire una `Date`. L'ordinamento è crescente per istante, con pareggio risolto mettendo prima il carico e poi la rilevazione — il carico è il fatto anteriore della giornata — e il prezzo come ultimo criterio, così che l'ordine sia **totale** e la serie deterministica.\n- **La scala è una funzione pura a parte, perché è la parte che si rompe.** `calcolaScalaSerie({ punti, prezzoMedio, now })` restituisce il dominio X e Y. Tre casi degeneri sono la vera insidia e sono tutti reali in questo dominio: un solo punto (dominio X di ampiezza zero), tutti i prezzi identici (dominio Y di ampiezza zero), e un dominio Y che escluderebbe la linea del prezzo medio. Senza una regola esplicita ciascuno produce una divisione per zero e coordinate `NaN`, cioè un SVG che non disegna nulla — un grafico invisibile invece di un errore. La funzione include quindi sempre `prezzoMedio` nel dominio Y, e sostituisce le ampiezze nulle con un margine simmetrico. Riceve `now` come argomento invece di leggere l'orologio, come già fa il server con `PositionsRoutesOptions.now`: è ciò che rende verificabile il criterio 2.\n- **L'asse X arriva a oggi anche quando l'ultimo punto è anteriore, e il vuoto a destra si vede.** Il criterio 2 riguarda l'estensione dell'asse, non i punti: **non si aggiunge alcun punto sintetico a oggi** usando `currentPrice`. Sarebbe un valore reale timbrato a un istante in cui non è stato osservato — indistinguibile da una rilevazione vera — e sarebbe anche inutile, perché il backfill di US-009 garantisce che ogni prezzo in cache sia già un'osservazione registrata. Il tratto finale senza dati resta quindi visibile e dichiarato, esattamente come i vuoti interni.\n- **Il tratteggio è una dichiarazione, non uno stile.** Il segmento fra due punti è tracciato con `stroke-dasharray`, e la nota di sezione dice perché: fra quei due istanti non esiste alcuna rilevazione. Una linea continua affermerebbe un percorso conosciuto che l'archivio non contiene, ed è precisamente il valore inventato che ADR-003 vieta. Con uno storico rado per costruzione (ADR-008) questo non è un dettaglio di rifinitura: è il messaggio principale del grafico.\n- **La linea del prezzo medio si prende dal server così com'è.** Il riferimento orizzontale del criterio 4 usa `detail.avgLoadPrice`, mai una media ricalcolata sul client: la scheda non ha mai ricalcolato una cifra (la formula vive sul server) e due letture dello stesso fatto non devono poter divergere — è lo stesso vincolo che US-038 renderà esplicito per il P&L.\n- **Nuovo componente, non una quinta sezione dentro `SchedaTitolo.tsx`.** `client/src/components/GraficoTitolo.tsx` nasce separato per due ragioni: `SchedaTitolo.tsx` è già a 678 righe, e US-037/US-039 aggiungeranno a quel grafico comandi e stato locale che nella scheda diventerebbero rumore. La scheda lo monta come sezione 5, dopo `nota-storico-prezzi`, e gli passa `loads`, `priceHistory` e `avgLoadPrice`.\n- **Superficie verificabile per attributi, non per pixel.** Il componente espone `data-testid=\"grafico-titolo\"` con `data-punti`, un `data-testid=\"punto-serie-N\"` per punto con `data-origine=\"carico|rilevazione\"` e `data-prezzo`, `data-testid=\"linea-prezzo-medio\"` con `data-prezzo`, e `data-testid=\"legenda-grafico\"`. Le asserzioni cadono così su ciò che la spec chiede — quanti punti, di quale origine, a quale prezzo il riferimento — e non sulla geometria, che cambierebbe a ogni ritocco di stile senza che il comportamento cambi. Un `<title>` per punto dà in più il testo al passaggio del mouse e la lettura assistita, a costo zero e senza JavaScript.\n- **Fuori scopo, dichiarato:** il selettore di scala temporale (US-037 — la classe `.scala-temporale` dei mockup **non** viene portata), le metriche di P&L accanto al grafico (US-038), il commutatore prezzo/valore (US-039) e il grafico del portafoglio intero (EP-006). Nessuna libreria di grafici entra nel progetto: l'SVG è scritto a mano come nei mockup, coerentemente con l'assenza di qualsiasi dipendenza di charting oggi.\n- **Attenzione operativa:** `@portfolia/shared` si risolve su `shared/dist`, quindi il nuovo modulo non è visibile a client e server finché non si esegue la build (`tsc --build` alla radice). L'aggiunta di `domain/**/*` a `include` in `shared/tsconfig.json` è parte della prima task, e l'import dei tipi `Position`/`PriceObservation` dentro `serieTitolo.ts` va fatto con `import type` per non creare un ciclo a runtime con il file che lo riesporta.\n\n---\n\n## Strategia di test\n\nLe due funzioni pure portano l'intero peso della correttezza e si provano con test unitari in `server/tests/` (Vitest, che importa `@portfolia/shared` come il resto del server); il componente e la scheda si provano dal lato utente con Playwright. Il server non cambia: nessuna nuova integrazione è dovuta, e la suite esistente su `/detail` fa da rete di regressione.\n\n- **Unit su `componiSerieTitolo`**: due carichi e due rilevazioni producono quattro punti in ordine crescente con l'origine corretta; zero rilevazioni producono la serie dei soli carichi; la data di carico è convertita allo stesso istante **indipendentemente dal fuso dell'host** (asserzione sul valore unix atteso, non su una stringa locale); carico e rilevazione nello stesso istante rispettano il pareggio dichiarato; l'ordine è totale anche con due punti identici in istante e origine.\n- **Unit su `calcolaScalaSerie`**: nessuna coordinata è `NaN` o `Infinity` in nessuno dei tre casi degeneri — un punto solo, prezzi tutti identici, prezzo medio esterno all'intervallo dei prezzi osservati; il dominio Y contiene sempre il prezzo medio; il dominio X termina a `now` anche quando l'ultimo punto è anteriore, e comincia al primo carico (criterio 2).\n- **Nessun test inventa la sorgente**: le due funzioni ricevono `loads` e `observations` e non hanno accesso né alla rete né al database, quindi il criterio 7 è provato dalla firma prima che da un'asserzione.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, spec in `e2e/`, fixture `archivio` di `e2e/support/`)\n**Registrazione video:** solo lo scenario dimostrativo (campo `Dimostra`), salvato in `docs/test-results/US-036/` con `page.video().saveAs()` dopo `page.close()`; gli altri scenari girano senza video\n\nVincoli della suite da rispettare: ogni file di spec riserva il **proprio** ISIN in `e2e/support/titoli.ts` (mai condiviso fra file), le osservazioni si seminano con `archivio.seminaOsservazioni` — che *sostituisce* quanto presente, così la spec possiede la propria premessa invece di ereditarla dal backfill — il titolo si semina con `seminaTitolo` per non fare scattare un recupero vero da 8-12 secondi lungo la ricerca ISIN, e la pulizia sta nella fixture, mai in un `finally`. Lo scenario dimostrativo va in un file suo (`test.use()` con `slowMo` è ammesso solo a livello di file), gli altri nel file gemello delle varianti.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Quattro punti e la linea del prezzo medio (dimostrativo, con video) | L'utente apre un portafoglio, entra nel riepilogo, apre la scheda di un titolo che ha due carichi a prezzi diversi e due rilevazioni già registrate; scorre fino in fondo, oltre la tabella «Storico prezzi», e vede il grafico con quattro punti — due di carico e due di rilevazione, marcati in modo diverso e nominati in legenda — attraversato dalla linea orizzontale del prezzo medio ponderato di carico |\n| Un solo punto disponibile | L'utente apre la scheda di un titolo con un solo carico e nessuna rilevazione: il grafico è presente con quel punto, dichiara che un andamento non esiste ancora e non lascia un'area vuota ambigua |\n| La linea di riferimento è la media ponderata, non la media aritmetica | Con due carichi di quantità diverse a prezzi diversi, il valore dichiarato dalla linea di riferimento coincide con il prezzo medio già mostrato nel piede di «Carichi registrati» — due letture dello stesso fatto non divergono |\n| Nessuna richiesta alla fonte | Contando le richieste di rete della pagina durante l'apertura della scheda e il disegno del grafico, quelle verso `**/api/securities/**` restano **zero**: il grafico si compone da ciò che la scheda ha già letto |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-036/` — `index.html` (i quattro punti con la linea del prezzo medio), `punto-unico.html` (il caso degenere del criterio 6) e `storico-rado.html` (il lungo tratto senza rilevazioni fra il primo carico e le prime osservazioni, cioè il caso in cui il tratteggio conta davvero).\n\n_Piano generato con ARchetipo Planning — 10 agosto 2026_\n"
