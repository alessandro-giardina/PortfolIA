    body: 'Ancora in server/tests/metrichePortafoglio.test.ts. Soglia (criterio 5): zero o un punto in finestra danno non-disponibile con il conteggio dei punti compresi e nessuna cifra, nemmeno zero; il test legge RILEVAZIONI_MINIME_VARIAZIONE invece di riscrivere 2. Perimetro (criterio 6): un titolo detenuto e mai valorizzato viene escluso e il suo carico non compare fra i versamenti — se vi comparisse, il movimento di mercato ne assorbirebbe l''importo col segno rovesciato, una perdita inventata con l''identita'' formalmente verde; il verdetto e'' parziale e il titolo e'' nominato; un titolo comprato dentro la finestra e regolarmente rilevato resta invece compreso; perimetro vuoto da'' non-disponibile con ragione distinta dalla soglia. Percentuale (criterio 3): base = valore iniziale + versato, esposta nell''esito con i suoi addendi; null e mai Infinity su base non positiva; variazione nulla da'' 0,00 % disponibile, perche'' lo zero misurato non e'' l''assenza.'
