schema: archetipo/plan/v2
spec_code: US-015
body: "# US-015: Mostrare il P&L del portafoglio accanto al suo grafico — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 13 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-006 — Grafico andamento del portafoglio\n**Priorità:** HIGH | **Punti:** 5\n**Bloccata da:** US-020 (in REVIEW, non ancora accettata: il selettore di scala, `calcolaFinestra`, `ritagliaSerie` e `coperturaPerimetroFinestra` esistono già e questa spec ne legge il ritaglio senza toccarlo — ma se la revisione rimandasse indietro US-020 la cucitura si sposterebbe, ed è un rischio da conoscere prima di cominciare)\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio vedere sotto il grafico quanto il portafoglio si è mosso nel periodo che sto guardando, distinto da quanto ci ho versato dentro, in modo da non scambiare un versamento per un guadagno (FR-011, FR-012).\n\n**Criteri di Accettazione**\n- [ ] Sotto il grafico compaiono, etichettate distintamente, la variazione del valore nella finestra selezionata e la sua scomposizione in capitale netto versato (carichi meno vendite cadute nella finestra) e movimento di mercato, ciascuna in €\n- [ ] Vale l'identità variazione del valore = capitale netto versato + movimento di mercato, verificata da un test\n- [ ] Il movimento di mercato è espresso anche in percentuale, e la base del rapporto è dichiarata a schermo\n- [ ] Il P&L complessivo mostrato nel Riepilogo resta quello del quadro del risultato (US-043) e non è ricalcolato qui: non dipende dall'orizzonte e non cambia al cambiare della scala\n- [ ] Una finestra con meno di due punti dichiara «dato non disponibile» per la variazione, mai zero, con la stessa soglia già in uso per il titolo\n- [ ] Una finestra in cui non tutti i titoli detenuti sono valorizzati dichiara la variazione parziale e nomina il perimetro su cui è calcolata\n- [ ] Test puri coprono i calcoli, incluso il caso di un carico e una vendita entrambi dentro la finestra\n\n---\n\n## Soluzione tecnica\n\nLa forma è quella già consegnata da US-038 — due metriche sotto il grafico, una che dipende dall'orizzonte e una che non ci dipende — ma il contenuto non è il suo gemello aggregato, ed è qui che sta l'intero peso della spec. Per un singolo titolo la differenza fra il primo e l'ultimo prezzo della finestra **è** il movimento del titolo: nessun evento dell'utente può cambiare un prezzo unitario. Per un portafoglio no: dentro la finestra possono cadere carichi e vendite, e il valore complessivo si muove anche quando il mercato è immobile. Scrivere quella differenza sotto l'etichetta «variazione» senza scomporla stamperebbe a schermo un rendimento falso — un bonifico letto come un guadagno, esattamente il difetto che la user story nomina.\n\nDa qui la scelta di fondo: **la scomposizione è un'identità, non tre misure indipendenti**. Il movimento di mercato si definisce come *residuo* — variazione del valore meno capitale netto versato — così l'identità del criterio 2 è vera per costruzione e non per una formula ripetuta bene in due punti. Un test la fissa comunque, perché è l'invariante che qualunque rifattorizzazione futura deve rompere rumorosamente.\n\n- **Un dato manca davvero, e va aggiunto: il prezzo di vendita.** `VenditaValore` è `Pick<Sale, 'saleDate' | 'quantity'>` — a `componiSerieValore` serviva solo la quantità per il gradino — e `GET /api/portfolios/:id/series` mappa esattamente quei due campi (`server/src/api/positions.ts`, ~550). Senza `salePrice` il denaro *uscito* dal portafoglio non è calcolabile. Si introduce `VenditaFlusso = Pick<Sale, 'saleDate' | 'quantity' | 'salePrice'>` in `shared/domain/serieValorePortafoglio.ts`, e `TitoloPortafoglio.sales` e `PortfolioSeriesEntry.sales` lo adottano. `VenditaValore` resta intatta: `quantitaDetenutaA` continua ad accettarla, e il tipo più largo le è assegnabile — nessun consumatore esistente cambia comportamento, e i pochi che *costruiscono* il payload li trova il compilatore.\n- **I flussi si valutano in cassa, non a prezzo di mercato.** Un carico entra per `loadPrice × quantity`, una vendita esce per `salePrice × quantity`: è il denaro che l'utente ha davvero mosso, ed è la lettura che il campo *Dimostra* chiede («un carico da 5.000 €» ⇒ «+5.000 € di capitale netto versato»). Ne segue una conseguenza da dichiarare e non da nascondere: il valore del punto usa l'ultimo prezzo *noto* (ADR-010), quindi lo scarto fra il prezzo pagato e la quotazione nota alla stessa data finisce dentro il movimento di mercato. È il prezzo del fatto che l'identità sia esatta al centesimo; l'alternativa — valutare i flussi al prezzo marcato — renderebbe «capitale netto versato» una cifra che non corrisponde ad alcun bonifico.\n- **I capi della finestra, e il flusso che non va contato due volte.** La variazione confronta il **primo** e l'**ultimo** punto del ritaglio (`ritagliaSerie(...).punti`, gli stessi che il grafico disegna). Un carico datato esattamente al primo capo è **già dentro** `valoreTotale` di quel punto — `quantitaDetenutaA` include i carichi con `loadDate <= at` — quindi contarlo fra i flussi lo conterebbe due volte e romperebbe l'identità. I flussi da sommare sono perciò quelli che cadono nell'intervallo **semiaperto** `(primo, ultimo]`. È il difetto più facile da introdurre e il più difficile da vedere a occhio: ha un test dedicato.\n- **Il perimetro si calcola prima delle cifre, e chi ne esce esce da entrambi i lati (criterio 6).** Un titolo è nel perimetro quando ha un prezzo noto a *ogni* punto della finestra in cui risulta detenuto; basta un punto scoperto perché ne esca. Quando esce, escono **insieme** il suo contributo al valore e i suoi flussi: se il suo carico contasse fra i versamenti mentre il suo valore non entra nella somma, il movimento di mercato ne assorbirebbe l'intero importo con il segno rovesciato — una perdita inventata di migliaia di euro, con l'identità formalmente verde. Ne segue che i due capi **non** si leggono da `valoreTotale` (che somma tutti i titoli valorizzati punto per punto) ma da una somma ristretta ai soli ISIN del perimetro, ricavata dai `contributi` che ogni `PuntoPortafoglio` già porta con sé.\n- **La soglia è quella del titolo, letta e non ricopiata (criterio 5).** `RILEVAZIONI_MINIME_VARIAZIONE = 2` vive in `shared/domain/metricheTitolo.ts` e si importa da lì: un secondo `2` scritto qui sarebbe due regole che possono divergere. Applicata ai **punti della finestra**, com'è scritto il criterio. Sotto soglia l'esito è `non-disponibile` e non si scrive alcuna cifra — nemmeno il capitale netto versato, che pure sarebbe calcolabile: esposto accanto a due caselle vuote si leggerebbe come una variazione, cioè lo scambio che la spec esiste per impedire. Le tre cifre stanno o cadono insieme perché sono un'identità sola.\n- **La base della percentuale è una somma scritta, non una cifra da indovinare (criterio 3).** Base = valore iniziale del perimetro **+** capitale netto versato, cioè il *capitale esposto* nella finestra. Non il solo valore iniziale: versare denaro a metà periodo gonfierebbe la percentuale senza che il mercato abbia fatto nulla — lo stesso errore della spec, spostato dal numeratore al denominatore. La resa scrive il conto per esteso (`+4,00 % = € 1.000,00 ÷ € 25.000,00, dove 25.000 = 20.000 + 5.000`) e dichiara il limite: non è un rendimento ponderato per il tempo, e un carico rimasto esposto mezza finestra vi pesa come se ci fosse stato dal primo giorno. `null` — mai `Infinity`, mai `0` — quando la base non è positiva.\n- **Il P&L complessivo non si tocca (criterio 4).** `QuadroRisultato` (US-043) resta l'unica lettura di realizzato + latente = totale, e questa spec **non aggiunge una seconda lettura**: la stanga lo *cita* dentro il proprio sigillo per contrasto, con la cifra presa dalla stessa fonte del quadro, e non ricalcola nulla. Il criterio si verifica in E2E confrontando le stringhe del quadro prima e dopo un cambio di scala.\n- **La cucitura è la render prop già inventata da US-038.** La scala vive come stato locale di `GraficoPortafoglio` (US-020 l'ha deciso, con motivazione: rientrare sul Riepilogo rimonta il componente e riporta alla predefinita). Il componente guadagna perciò `sottoIlGrafico?: (contesto: ContestoSottoIlGraficoPortafoglio) => ReactNode` — gemella di quella di `GraficoTitolo`, con `punti` (già ritagliati), `finestra`, `scala` e `copertura` — e `PortfolioDetailPage` le passa `<MetrichePortafoglio titoli={series} …>`. L'alternativa, far scendere il perimetro dentro un componente che già lo riceve, non guadagnerebbe nulla e `GraficoPortafoglio` è già a 1.600 righe.\n- **La prop va invocata in tutti i rami d'uscita tranne il primo.** `GraficoPortafoglio` esce da quattro punti: perimetro vuoto (~riga 507), nessun prezzo noto per alcun titolo (~riga 528), finestra senza punti (~riga 767) e il tracciato. I due rami di mezzo e il tracciato devono rendere la sezione — nel secondo e nel terzo con lo stato «dato non disponibile», che è precisamente ciò che i criteri 5 e 6 chiedono di vedere. Il primo no: senza un solo titolo iscritto non esiste né una finestra né un perimetro di cui scomporre alcunché, e il grafico lo dichiara già. Nessun criterio parla di questi rami, quindi la decisione va scritta qui.\n- **Nessuna nuova richiesta di rete, nessun nuovo endpoint.** `series` è già in mano alla pagina e la scomposizione è una funzione pura dei punti già ritagliati più i registri già letti. L'unico cambio lato server è il campo `salePrice` in una `map` già esistente.\n- **Superficie verificabile per attributi:** `data-testid=\"metriche-portafoglio\"` sul contenitore, con `data-scala` e `data-stato=\"disponibile|non-disponibile\"`; `variazione-valore`, `capitale-netto`, `movimento-mercato` sulle tre voci, con i figli `-valore` e (per il mercato) `-percentuale`; `base-rapporto`, `regolo-scomposizione`, `scomposizione-non-disponibile` sul timbro, `perimetro-scomposizione` sul riquadro del criterio 6, `rimando-quadro-risultato` sul sigillo. Le asserzioni cadono su questi e mai sulla geometria.\n- **Fuori scopo, dichiarato:** il P&L complessivo e la sua percentuale (già consegnati da US-043, non si ricalcolano), l'elenco titolo per titolo di ciò che manca (US-016), il rendimento ponderato per il tempo o per il denaro (TWR/MWR: richiede una serie continua che l'archivio osservazionale non possiede, FR-018), qualunque nuova rotta.\n- **Attenzione operativa:** `@portfolia/shared` si risolve su `shared/dist`, quindi il nuovo modulo di dominio non è visibile al client finché non gira `tsc --build` alla radice; `shared/types/index.ts` deve riesportarlo come già fa con `../domain/metricheTitolo.js`.\n\n---\n\n## Strategia di test\n\nIl peso dei criteri 2, 5, 6 e 7 lo portano **funzioni pure**, provate con Vitest in `server/tests/` accanto a quelle di US-019/US-020/US-038: sono aritmetica e casistica, e non hanno bisogno di un browser per essere messe alla prova. Il resto — che le tre cifre compaiano etichettate, che si aggiornino insieme al cambio di scala e che il quadro del risultato non si muova di un centesimo — è comportamento visibile e si prova con Playwright. Il server guadagna un campo in una rotta esistente, coperto dai suoi test d'integrazione.\n\n- **Unit sull'identità (criteri 2 e 7):** una finestra con **un carico e una vendita entrambi dentro** verifica `variazione = versato + mercato` al centesimo, con il versato negativo quando la vendita supera il carico; il caso senza flussi degrada a `mercato = variazione` e a un versato che è uno zero **misurato**.\n- **Unit sui capi:** un carico datato **esattamente al primo capo** non entra fra i flussi (è già dentro il valore del punto) mentre uno datato all'ultimo capo sì; invertire la convenzione rompe l'identità, ed è il test che lo dimostra.\n- **Unit sulla soglia (criterio 5):** zero o un punto in finestra ⇒ `non-disponibile` con il conteggio dei punti compresi e **nessuna cifra**, nemmeno zero; il valore della soglia si legge da `RILEVAZIONI_MINIME_VARIAZIONE` e non è riscritto nel test.\n- **Unit sul perimetro (criterio 6):** un titolo detenuto e mai valorizzato viene escluso, il suo carico **non** compare fra i versamenti, il verdetto è parziale e il titolo è nominato; un titolo comprato dentro la finestra e regolarmente rilevato resta invece nel perimetro; con perimetro vuoto l'esito è `non-disponibile` per una ragione distinta dalla soglia.\n- **Unit sulla percentuale (criterio 3):** base = valore iniziale + versato, dichiarata nell'esito insieme ai suoi addendi; `null` e mai `Infinity` su base non positiva; una variazione nulla dà `0,00 %` **disponibile** — lo zero misurato non è l'assenza, ed è il caso che una guardia scritta `if (!valore)` romperebbe in silenzio.\n- **Integrazione:** `GET /api/portfolios/:id/series` restituisce `salePrice` per ogni vendita, e i test esistenti della rotta restano verdi.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, spec in `e2e/`, fixture `archivio` di `e2e/support/`)\n**Registrazione video:** solo lo scenario dimostrativo (campo `Dimostra`), salvato in `docs/test-results/US-015/` con `page.video().saveAs()` dopo `page.close()`; gli altri scenari girano senza video\n\nVincoli della suite da rispettare: due file spec, ciascuno con le **proprie** chiavi dichiarate in `e2e/support/titoli.ts` (il campo `file` è il dato che `npm run check:chiavi` verifica, e più chiavi per lo stesso file sono lecite — è condividerle *fra* file che non lo è); le osservazioni si seminano con `archivio.seminaOsservazioni`, che *sostituisce* lo storico, così ogni spec possiede la premessa che asserisce invece di ereditarla dal backfill d'avvio; i titoli si seminano con `fetched_at` di adesso, perché un recupero reale registrerebbe un'osservazione a oggi e cambierebbe i punti compresi sotto i piedi proprio degli scenari dei criteri 5 e 6; la pulizia sta nella fixture e mai in un `finally`.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Un versamento non è un guadagno (dimostrativo, con video) | L'utente apre il Riepilogo di un portafoglio il cui valore è passato da 20.000 a 26.000 € su «ultimo anno», con un carico da 5.000 € caduto dentro la finestra: sotto il grafico compaiono le tre cifre etichettate — variazione +6.000 €, capitale netto versato +5.000 €, movimento di mercato +1.000 € — con il regolo che mostra a colpo d'occhio quanta parte della salita è denaro versato, e la base della percentuale scritta per esteso |\n| Cambiando scala si muovono le tre cifre, non il P&L | Dalla stessa pagina l'utente passa a un'altra scala: le tre cifre si aggiornano insieme, mentre le cifre del *quadro del risultato* restano **le stesse stringhe** di prima — realizzato, latente e totale — perché non dipendono dall'orizzonte e non sono ricalcolate qui |\n| Una finestra con un solo punto dichiara l'assenza | Scegliendo una scala che comprende un solo punto, la sezione porta il timbro «Dato non disponibile» e **nessun numero**: né la variazione, né il versato, né il mercato. La spiegazione dice quanti punti ha trovato, quanti ne servono e qual è il rimedio |\n| Un titolo senza prezzo restringe il perimetro, e lo dice | Con un titolo detenuto e mai rilevato nel portafoglio, le tre cifre compaiono dichiarate **parziali**, il riquadro del perimetro nomina il titolo escluso e dichiara su quanti titoli di quanti detenuti la scomposizione è calcolata; il carico di quel titolo non compare fra i versamenti |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-015/` — `index.html` mostra la «stanga a tre pesi» con l'equazione incisa, il regolo della scomposizione (campitura d'ottone per il denaro versato, pieno per il mercato) e la base della percentuale scritta con i suoi addendi; `casi-limite.html` mostra i criteri 5 e 6, cioè il timbro al posto delle cifre e il perimetro nominato titolo per titolo. `shared.css` è quello di US-020 copiato senza modifiche, e ogni aggiunta vive in `metriche.css`.\n\n_Piano generato con ARchetipo Planning — 13 agosto 2026_\n"
