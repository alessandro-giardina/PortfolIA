    description: 'Aggiungere a `shared/domain/serieValorePortafoglio.ts` la funzione pura `coperturaPerimetroFinestra(punti: readonly PuntoPortafoglio[])` che restituisce `{ verdetto: ''piena'' | ''parziale'' | ''senza-oggetto'', primaCoperturaPiena: number | null, puntiPieni: number, puntiParziali: number }`, calcolata **sui soli punti ritagliati** e non sulla serie intera. Documentare nel docblock perché il calcolo è relativo alla finestra (una `primaCoperturaPiena` globale può cadere prima di `finestra.da`, e la copertura può regredire quando un titolo mai rilevato entra a registro) e perché il terzo esito è `''senza-oggetto''` e non `''piena''` (con zero punti l''affermazione è vera solo vacuamente).'
