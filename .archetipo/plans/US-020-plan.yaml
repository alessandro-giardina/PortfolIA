schema: archetipo/plan/v2
spec_code: US-020
body: "# US-020: Selezionare la scala temporale del grafico del portafoglio — Piano di implementazione\n\n**Generato da:** Team di Pianificazione ARchetipo\n**Data:** 2026-08-13\n\n---\n\n## Spec\n\n**Epica:** EP-006 — Grafico andamento del portafoglio\n**Priorità:** HIGH | **Punti:** 3\n**Bloccata da:** US-019 (stato REVIEW — il componente `GraficoPortafoglio` e la serie aggregata sono già a codice)\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio cambiare la scala temporale del grafico del portafoglio fra ultimo mese, ultimo anno, ultimi 5 anni, ultimi 10 anni e tutto lo storico, in modo da analizzare l'andamento del conto sull'orizzonte che mi interessa (FR-016).\n\n**Criteri di Accettazione**\n1. Cinque scale — ultimo mese, ultimo anno, ultimi 5 anni, ultimi 10 anni, tutto lo storico — che sono la definizione condivisa già in uso nella scheda titolo, non una seconda copia\n2. «Tutto lo storico» è la scala predefinita all'apertura del Riepilogo\n3. Il grafico si aggiorna coerentemente con la scala selezionata\n4. Una scala priva di punti nell'intervallo dichiara «dato non disponibile» invece di mostrare un grafico vuoto (ADR-003)\n5. Una scala più lunga della storia disponibile dichiara da quando i dati esistono, senza lasciar intendere una copertura piena\n6. La copertura è dichiarata su entrambe le dimensioni — tempo e perimetro dei titoli — e i due verdetti restano leggibili separatamente\n\n---\n\n## Soluzione Tecnica\n\nLa spec è quasi tutta **riuso**, e ciò che non lo è vive in un punto solo: la copertura di un aggregato ha due dimensioni indipendenti. Nessun endpoint nuovo, nessuna migrazione, nessuna richiesta di rete in più — `GET /api/portfolios/:id/series` restituisce già l'intero perimetro, e cambiare scala è filtrare un array che sta in memoria.\n\n- **Le scale non si ridefiniscono.** `SCALE_TEMPORALI`, `SCALA_PREDEFINITA`, `definizioneScala` e `calcolaFinestra` (`shared/domain/serieTitolo.ts`, US-037) si importano così come sono. Il criterio 1 è soddisfatto *per costruzione*: una seconda costante con le stesse cinque etichette sarebbe la copia che la nota di scopo vieta, e il test la rileverebbe solo per coincidenza. Ne segue anche l'assenza del «giorno precedente» di FR-016, già motivata da US-037.\n- **Il ritaglio non richiede primitivi nuovi.** `ritagliaSerie<P extends PuntoSerie>` è già generica e `PuntoPortafoglio extends PuntoSerie`: il ritaglio conserva `valoreTotale`, `contributi` e `copertura` di ogni punto senza spogliarli. Anche `calcolaScalaSerie` accetta già `finestra` e `ancoraAZero`, che `GraficoPortafoglio` passa da US-019.\n- **La seconda dimensione è nuova, e si misura sui punti ritagliati.** `coperturaPerimetroFinestra(punti)` entra in `shared/domain/serieValorePortafoglio.ts` e restituisce `{ verdetto, primaCoperturaPiena, puntiPieni, puntiParziali }`, dove `verdetto` è `'piena' | 'parziale' | 'senza-oggetto'`. Il calcolo **relativo alla finestra** non è un raffinamento: oggi il componente legge `serie.primaCoperturaPiena`, calcolata sulla serie *intera*, e con una finestra stretta quell'istante può cadere prima di `finestra.da` — la banda campita nascerebbe a larghezza negativa — oppure essere smentito da una **regressione di copertura**, che accade ogni volta che un titolo nuovo e non ancora rilevato entra a registro dopo una copertura già piena.\n- **`'senza-oggetto'` è il terzo esito, e non è pedanteria.** A finestra vuota «ogni titolo detenuto ha un prezzo noto» è vero *vacuamente*, e un verdetto «piena» si leggerebbe come una rassicurazione sopra un riquadro che non mostra nulla. La prima dimensione è assente, la seconda è senza oggetto: due fatti diversi, due parole diverse.\n- **Il componente guadagna uno stato e tre rami.** `GraficoPortafoglio` apre uno `useState<ScalaTemporale>(SCALA_PREDEFINITA)`; il criterio 2 è vero per costruzione perché `PortfolioDetailPage` monta la scheda Riepilogo condizionalmente (`{scheda === 'riepilogo' && …}`, riga 823), quindi rientrare sulla linguetta rimonta il componente. La traversa riusa marcatura, classi e `data-testid` di US-037 (`scala-temporale`, `scala-<id>`, `finestra-attiva`, `data-scala`): stessi comandi, stessi attributi, un solo modo di interrogarli dai test.\n- **I due verdetti restano separati anche nella resa.** Due campiture deliberatamente diverse (puntinata in seppia per «fuori dall'archivio», obliqua in ottone per «perimetro incompleto») e due regoli, ciascuno col **proprio denominatore scritto**: i giorni della finestra chiesta per il tempo, i giorni coperti dall'archivio per il perimetro. I due numeri non si mediano — una media di frazioni con denominatori diversi non corrisponde ad alcun fatto — e i due rimedi sono opposti: una scala più stretta per il tempo, un aggiornamento dei prezzi (US-035) per il perimetro.\n- **La prosa già consegnata va corretta, non lasciata lì.** `GraficoPortafoglio.tsx` afferma in quattro punti che la finestra è «tutto lo storico» e che il selettore «arriva con US-020»: cartellino della cornice (riga 463), didascalia dell'asse dei tempi (riga 756), rimando dentro `.copertura-parziale` (riga 899) e docblock del modulo (riga 163). Con questa spec diventano tutte false, e un'affermazione falsa scritta accanto a un dato vero è il difetto che ADR-003 esiste per impedire.\n\n---\n\n## Strategia di Test\n\nIl dominio è puro e si prova con Vitest; la resa, l'interazione e i tre rami di stato si provano end-to-end, perché il progetto non ha test di componente lato client e non è questa la spec che deve introdurli.\n\n- **Unità (Vitest, `server/tests/serieValorePortafoglio.test.ts`)** — `coperturaPerimetroFinestra` sui casi che il difetto ha già prodotto altrove: finestra che comincia *dopo* la prima copertura piena della serie intera; **regressione di copertura** (piena → parziale → piena) con la finestra aperta sul secondo tratto; finestra senza punti (`'senza-oggetto'`); punti tutti a perimetro completo; punti tutti incompleti. Nessun test riscrive le scale: le legge da `SCALE_TEMPORALI`.\n- **Non regressione** — la suite esistente di `serieValorePortafoglio.test.ts` e `api.portfolios.serie.test.ts` deve restare verde senza modifiche: questa spec non tocca né l'aggregazione né l'endpoint.\n- **Premesse costruite, mai ereditate** — ogni scenario e2e semina i propri titoli e le proprie osservazioni con `archivio.seminaTitolo` / `archivio.seminaOsservazioni`, su chiavi ISIN riservate a un solo file. Il perimetro incompleto è una premessa da costruire (un titolo detenuto e mai rilevato), non una condizione che il database di sviluppo offra per caso.\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, fixture `archivio` di `e2e/support/fixtures.ts`)\n**Registrazione video:** solo lo scenario dimostrativo (campo `Dimostra` della spec), salvato in `docs/test-results/US-020/` con `page.video().saveAs(...)` dopo `page.close()`; gli altri scenari girano senza registrazione, in un file sorella (`launchOptions`/`slowMo` non sono scopabili a un `describe`).\n\n| Scenario | Flusso utente |\n|---|---|\n| Scala più lunga della storia (**dimostrativo, con video**) | L'utente apre un portafoglio con due titoli la cui storia comincia meno di un anno fa, entra sul Riepilogo e verifica che la scala attiva sia «Tutto lo storico»; sceglie «Ultimi 10 anni» e legge che il grafico dichiara *da quando* i dati esistono — l'asse resta lungo dieci anni e il primo regolo conta i giorni scoperti — mentre il secondo regolo dichiara separatamente da quando il perimetro è completo |\n| Finestra senza punti | Su un portafoglio la cui ultima rilevazione è di oltre un mese fa, l'utente sceglie «Ultimo mese»: al posto della cornice compare «dato non disponibile», con l'intervallo richiesto, il punto più recente fuori finestra e l'indicazione della scala più stretta che comprenda almeno un punto. Il secondo regolo dichiara «non misurabile», non «parziale» |\n| Le cinque scale sono quelle condivise | L'utente conta i bottoni della traversa e ne legge le etichette, che devono coincidere con quelle della scheda titolo: il test le deriva da `SCALE_TEMPORALI` invece di riscriverle, così una sesta scala o un'etichetta divergente lo fanno fallire |\n| Predefinita all'apertura del Riepilogo | L'utente apre il Riepilogo (scala «Tutto lo storico»), sceglie «Ultimo anno», passa a «Carico titoli» e torna al Riepilogo: la scala è di nuovo quella predefinita |\n| Il ritaglio non interroga la fonte | Con un `page.route` che fallisce ogni chiamata a `/api/securities/**`, l'utente commuta fra tutte e cinque le scale: il grafico si aggiorna e nessuna richiesta parte — cambiare scala *ritaglia*, non *infittisce* |\n| Le due dimensioni restano separate | Su un portafoglio con un titolo detenuto e mai rilevato, l'utente sceglie una scala coperta per intero nel tempo: il primo verdetto è pieno e il secondo parziale nello stesso istante, con i due denominatori distinti a schermo |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono in `docs/mockups/US-020/` — `index.html` (scala più lunga della storia, doppio regolo), `finestra-vuota.html` (criterio 4), `due-dimensioni.html` (i quattro incroci e il quinto caso), `README.md` (la ragione dei due denominatori).\n\n_Piano generato da ARchetipo Planning — 2026-08-13_"
