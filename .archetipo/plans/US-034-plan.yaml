    description: 'In e2e/support/titoli.ts aggiungere quattro costanti nuove, nessuna condivisa fra i due file spec: due per il file demo (il titolo che sarà seminato con fetched_at in una sessione passata e quello seminato adesso) e due per il file varianti (uno seminato fresco, uno che il file rimuove dalla cache). Documentare in commento la proprietà che rende gli scenari deterministici: un rilevamento «adesso» non può risultare obsoleto a nessuna ora, perché classifyRefetch(now, now) è ''intra-session'' o ''no-session'', mai ''none''.'
