  - id: TASK-07
    title: Mostrare il conteggio dei titoli da aggiornare sopra la tabella
    description: 'In client/src/pages/PortfolioDetailPage.tsx inserire fra il riquadro «Valore attuale totale» e `.tabella-scroll` un riquadro sempre presente con `role="status"` e `data-testid="conteggio-da-aggiornare"`. Testo secondo i quattro casi definiti nel piano (solo obsoleti / solo mai rilevati / entrambi / nessuno), con le forme singolari corrette. A zero il riquadro resta e dichiara che tutti i titoli sono allineati all''ultima sessione di borsa. Il conteggio si ottiene filtrando `enrichedPositions` su `freshness`: nessuna regola di orario di borsa nel client.'
    type: Impl
    status: DONE
    dependencies:
