schema: archetipo/plan/v2
spec_code: US-061
body: |-
  ## Technical Solution

  Il testo dei due pulsanti di commutazione design vive in punti diversi del codice perché ciascun design ha il proprio guscio: `Foglio.tsx` è il guscio condiviso da tutte le pagine del design Libro Mastro (righe 91-111), `Quadro.tsx` è il guscio condiviso da tutte le pagine del design Quadro Strumenti (righe 169-223, unico punto che renderizza `azioni-testata`). Non serve toccare le singole viste: entrambe le testate sono già centralizzate in questi due componenti.

  - In `Foglio.tsx` il pulsante `commutatore` (riga 91) ha un ternario su `design`: dentro il guscio Mastro `design === 'mastro'` è sempre vero, quindi solo il testo di riga 100 ("Quadro strumenti") è realmente visibile; il ramo di riga 108 ("Libro Mastro") è codice difensivo mai raggiunto in questo contesto ma va comunque allineato per coerenza semantica del componente.
  - In `Quadro.tsx` il pulsante `bottone nudo` (riga 215-221) mostra staticamente "Libro Mastro" (riga 220): unico punto da cambiare per il lato Quadro.
  - Il pulsante tema Day/Night adiacente (`icona-bottone`, `quadro.css` righe 501-514) ha un'altezza fissa esplicita `height: 36px`. Il pulsante `.bottone` (righe 473-487) non fissa l'altezza — la ottiene da `padding: 10px 16px` + `font-size` + `border`, che in pratica produce un'altezza vicina ma non garantita uguale a 36px su tutti i browser/font. `azioni-testata` (riga 184 di `Quadro.tsx`) è l'unico contenitore del genere nell'app (nessun'altra vista usa questa classe), quindi si può aggiungere una regola scoped `.azioni-testata .bottone.nudo { height: 36px; }` in `quadro.css` senza impattare altri pulsanti `.bottone`/`.bottone.nudo` usati altrove nel design Quadro.
  - I locator E2E esistenti usano regex case-insensitive senza ancoraggio (`/quadro strumenti/i`, `/libro mastro/i`), quindi il testo "Vista Quadro Strumenti"/"Vista Libro Mastro" continua a matchare senza modifiche ai locator — va solo aggiunta l'asserzione sull'altezza, non ancora presente.

  ## Test Strategy

  La modifica è interamente di superficie (testo statico + una regola CSS), niente stato server o dati: la suite E2E esistente basta a coprire il comportamento funzionale, va solo estesa con un'asserzione dimensionale per il criterio sull'altezza. Nessun dato di archivio è coinvolto: i test non toccano portafogli/titoli, quindi non serve la fixture `archivio`.

  ### E2E Tests — User Simulation

  **Framework:** Playwright (`e2e/*.spec.ts`, esistente nel progetto)
  **Video recording:** Nessuna nuova registrazione richiesta — lo scenario dimostrativo di commutazione design è già coperto dal video esistente di `e2e/demo__commuta-design.spec.ts` (US-050); il nuovo testo apparirà automaticamente nel prossimo run di quello spec, senza modifiche al file.

  | Scenario | User flow description |
  |---|---|
  | Commutazione a Quadro con testo aggiornato | L'utente nel design Mastro clicca il pulsante di commutazione (ora atteso mostrare ancora la sotto-stringa "quadro strumenti"), atterra nel design Quadro; il pulsante di ritorno mostra la sotto-stringa "libro mastro" — copre entrambi i lati del cambio testo senza toccare i locator esistenti |
  | Altezza pulsante commutazione = altezza pulsante tema | Nel design Quadro, dopo la commutazione, si confronta `boundingBox().height` del pulsante "Vista Libro Mastro" con quella del pulsante `data-testid="toggle-tema"`: devono coincidere |

  _Plan generated via ARchetipo Planning_
