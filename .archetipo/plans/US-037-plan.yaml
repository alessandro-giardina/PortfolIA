schema: archetipo/plan/v2
spec_code: US-037
body: "# US-037: Selezionare la scala temporale del grafico del titolo — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 11 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-007 — P&L e grafico del singolo titolo\n**Priorità:** HIGH | **Punti:** 2\n**Bloccata da:** US-036 (in REVIEW: la serie, la scala e il componente `GraficoTitolo` esistono già e questa spec ci lavora sopra)\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio cambiare la scala temporale del grafico del titolo fra ultimo mese, ultimo anno, ultimi 5 anni, ultimi 10 anni e tutto lo storico, in modo da analizzare l'andamento sull'orizzonte che mi interessa senza dover leggere l'intera serie (FR-016).\n\n**Criteri di Accettazione**\n- [ ] L'utente può scegliere fra cinque scale: ultimo mese, ultimo anno, ultimi 5 anni, ultimi 10 anni, tutto lo storico\n- [ ] «Tutto lo storico» — dal primo carico a oggi — è la scala predefinita all'apertura della scheda\n- [ ] Il grafico si aggiorna coerentemente con la scala selezionata\n- [ ] Una scala priva di dati nell'intervallo dichiara «dato non disponibile» invece di mostrare un grafico vuoto (ADR-003)\n- [ ] Una scala più lunga della storia disponibile dichiara da quando i dati esistono, senza lasciar intendere una copertura piena\n\n---\n\n## Soluzione tecnica\n\nQuesta spec **non aggiunge un solo dato**: le cinque scale sono un *ritaglio* della serie che US-036 già compone dai due elenchi che la scheda ha in mano (`detail.loads`, `detail.priceHistory`). Nessun endpoint, nessuna query, nessuna `fetch` — cambiare scala è filtrare un array già in memoria, e il criterio «il grafico si aggiorna» si soddisfa senza mai tornare al server. Questo era già previsto: US-036 ha messo la composizione della serie in `shared/domain/serieTitolo.ts` proprio perché il ritaglio dovesse potersi fare sul client.\n\nIl cuore della spec, però, non è il filtro — quello è banale. Sono i **due criteri sul vuoto** (4 e 5), perché con uno storico rado per costruzione e nato con l'app (ADR-008) il caso *ordinario* delle scale a 5 e 10 anni è precisamente la finestra scoperta. Un grafico che si restringesse in silenzio, o che disegnasse un riquadro vuoto, direbbe una cosa falsa proprio nel caso più frequente.\n\n- **Le scale sono dominio, non resa.** `SCALE_TEMPORALI` — identificativo, etichetta e durata — vive in `shared/domain/serieTitolo.ts` accanto a `componiSerieTitolo` e `calcolaScalaSerie`, non dentro il componente: l'elenco ordinato e le etichette sono un fatto solo, e US-039 (commutatore prezzo/valore) ricalcolerà sulla stessa finestra. La scelta di `shared` è la stessa di US-036 e per la stessa ragione: i test unitari del progetto vivono in `server/tests/` con Vitest e il client non ha infrastruttura di test, quindi una funzione pura in `shared` è l'unico posto dove una regola può essere insieme usata dal client e provata.\n- **`calcolaFinestra({ scala, punti, now })` fa aritmetica di calendario, non moltiplicazioni.** «Ultimo mese» significa *un mese civile indietro*, non trenta giorni: la differenza è visibile e l'utente la nota. Da qui la trappola che va disinnescata esplicitamente: in JavaScript `setMonth(m - 1)` sul 31 marzo produce il **3 marzo** (traboccamento sul mese corto), e `setFullYear(y - 1)` sul 29 febbraio produce il 1º marzo. Senza un *clamp* all'ultimo giorno del mese di destinazione, «ultimo mese» diventerebbe silenziosamente «ultimi 28 giorni più tre» un mese all'anno — un difetto che nessuno vede finché non gira il test il giorno giusto. Per «tutto lo storico» la finestra è `{ da: primo carico, a: now }`, cioè esattamente il dominio che US-036 già calcola: la scala predefinita non è un caso a parte, è il caso senza ritaglio.\n- **`ritagliaSerie({ punti, finestra })` restituisce anche un verdetto, non solo dei punti.** L'esito è `{ punti, copertura, primoDatoDisponibile }` con `copertura` in `'piena' | 'parziale' | 'assente'`: `assente` quando nessun punto cade nella finestra, `parziale` quando il primo punto d'archivio è **posteriore** all'inizio della finestra (cioè l'orizzonte richiesto supera la storia esistente), `piena` altrimenti. Il verdetto sta nel dominio e non nel componente perché è la parte che i criteri 4 e 5 mettono alla prova, ed è quindi la parte che va provata da test unitari. Gli estremi sono **chiusi** (`da <= at <= a`), dichiarato una volta per non lasciarlo all'implementazione.\n- **Niente riporto dell'ultimo prezzo noto.** Una finestra vuota preceduta da rilevazioni è la tentazione classica: ancorare a sinistra l'ultimo prezzo conosciuto perché «la linea deve partire da qualcosa». Sarebbe un valore timbrato a un istante in cui non è stato osservato — la stessa cosa che US-036 ha rifiutato per il punto sintetico a oggi, e che ADR-003 vieta. Finestra senza punti significa *dato non disponibile*, punto.\n- **`calcolaScalaSerie` guadagna una `finestra` opzionale.** Quando c'è, `xMin`/`xMax` sono i suoi estremi; quando manca, la funzione si comporta **esattamente come oggi**. È il modo per far entrare US-037 senza cambiare il comportamento di US-036, che è in revisione: il dominio Y continua a contenere sempre il prezzo medio e le ampiezze nulle continuano a ricevere il margine simmetrico, perché con una finestra decennale e un solo punto dentro i casi degeneri non spariscono — si moltiplicano.\n- **La finestra vuota si dichiara, non si disegna (criterio 4).** A `copertura === 'assente'` il componente degrada a una dichiarazione al posto della cornice, riusando l'idioma `avviso-rado` che US-036 ha già introdotto per la serie vuota: dice l'intervallo richiesto per esteso e **dove il dato è davvero** («il punto più recente in archivio è del …, fuori da questa finestra»). Non si disegna nemmeno la sola riga del prezzo medio: una cornice con una riga dentro si legge come un grafico, e sarebbe un grafico che non mostra nulla.\n- **La copertura parziale non accorcia l'orizzonte (criterio 5).** A `copertura === 'parziale'` l'asse copre **davvero** i dieci anni chiesti, e il lungo tratto iniziale senza dati è campito con la stessa campitura obliqua che US-036 usa per il tratto finale scoperto, con la dichiarazione di quando la copertura comincia. La tentazione opposta — far partire l'asse dal primo dato — è proprio ciò che il criterio vieta: un grafico che riempie la larghezza disponibile lascia intendere una copertura piena, e con lo storico osservazionale di ADR-008 mentirebbe quasi sempre.\n- **L'etichetta dell'estremo sinistro cambia natura con la finestra.** US-036 deduce il giorno di `xMin` cercando il punto che ci cade sopra, perché lì `xMin` *è* un punto (e un carico va letto in UTC, una rilevazione in locale). Con una finestra `xMin` è un istante reale calcolato da `now`, e va reso con `dataIstante`: la deduzione per coincidenza va **scavalcata** quando la finestra c'è, altrimenti un punto che casualmente cade sull'estremo lo farebbe leggere come una mezzanotte UTC.\n- **Lo stato del selettore vive in `GraficoTitolo`, e si azzera per ISIN.** `SchedaTitolo.tsx` è a 702 righe e il grafico è già un componente a sé apposta; lo stato non va sollevato. Ma il criterio 2 dice «all'apertura della scheda», e la scheda **non si rimonta** cambiando titolo (`PortfolioDetailPage` la monta con `isin={isinSelezionato}` e il refetch avviene in un effetto): senza intervento, la scala scelta su un titolo sopravvivrebbe all'apertura del successivo. Il montaggio diventa quindi `<GraficoTitolo key={detail.isin} … />` — una riga, e il criterio è vero per costruzione invece che per un effetto di azzeramento da ricordarsi.\n- **Il prezzo medio non si ricalcola per finestra.** Resta `detail.avgLoadPrice` così come il server lo produce, anche quando alcuni carichi cadono fuori dalla finestra: una media ricalcolata sui soli carichi visibili darebbe un numero diverso per ogni scala, e la stessa scheda direbbe cinque prezzi medi. La media della posizione è un fatto della posizione, non della finestra. (La lettura per finestra è materia di US-038/US-039, e va dichiarata lì.)\n- **Superficie verificabile per attributi.** Il gruppo `data-testid=\"scala-temporale\"` con un bottone `data-testid=\"scala-<id>\"` per scala e `aria-pressed` a marcare l'attiva; su `grafico-titolo` gli attributi `data-scala` e `data-copertura`; `data-testid=\"dato-non-disponibile\"` per il criterio 4 e `data-testid=\"dichiarazione-copertura\"` con `data-inizio-dati` per il criterio 5. Le asserzioni cadono su questo e mai sulla geometria, che cambia a ogni ritocco di stile senza che il comportamento cambi. I bottoni sono bottoni veri — attivabili da tastiera senza codice aggiuntivo — dentro un `role=\"group\"` con etichetta.\n- **Fuori scopo, dichiarato:** le metriche di P&L accanto al grafico (US-038), il commutatore prezzo/valore (US-039), il grafico del portafoglio intero (EP-006). Nessuna libreria di grafici entra nel progetto: l'SVG resta scritto a mano.\n- **Attenzione operativa:** `@portfolia/shared` si risolve su `shared/dist`, quindi le nuove funzioni non sono visibili al client finché non gira `tsc --build` alla radice.\n\n---\n\n## Strategia di test\n\nLe tre funzioni pure portano l'intero peso della correttezza e si provano con Vitest in `server/tests/`, accanto ai test di US-036; il selettore e i tre stati di copertura si provano dal lato utente con Playwright. Il server non cambia: nessuna nuova integrazione è dovuta.\n\n- **Unit su `calcolaFinestra`**: il 31 marzo meno un mese cade sul **28/29 febbraio** e non sul 3 marzo (clamp di fine mese); il 29 febbraio meno un anno cade sul 28 febbraio; le scale a 5 e 10 anni retrocedono di anni civili; «tutto lo storico» restituisce `{ primo carico, now }`; `now` arriva come argomento, quindi l'esito non dipende dall'orologio della macchina.\n- **Unit su `ritagliaSerie`**: una finestra senza punti dà `'assente'` **anche quando esistono punti prima della finestra** — è il caso che vieta il riporto dell'ultimo prezzo noto; una finestra che comincia prima del primo punto dà `'parziale'` con `primoDatoDisponibile` valorizzato; un punto esattamente su un estremo è **incluso**; la serie ritagliata conserva ordine e origini.\n- **Unit su `calcolaScalaSerie` con finestra**: `xMin`/`xMax` coincidono con gli estremi della finestra; nessuna coordinata è `NaN` o `Infinity` con un solo punto dentro una finestra decennale; il dominio Y contiene sempre il prezzo medio anche quando i punti visibili sono uno; **senza** finestra il risultato resta identico a quello di US-036 (test di regressione esplicito, perché quella spec è in revisione).\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, spec in `e2e/`, fixture `archivio` di `e2e/support/`)\n**Registrazione video:** solo lo scenario dimostrativo (campo `Dimostra`), salvato in `docs/test-results/US-037/` con `page.video().saveAs()` dopo `page.close()`; gli altri scenari girano senza video\n\nVincoli della suite da rispettare, e uno in più che questa spec introduce: ogni file riserva il **proprio** ISIN in `e2e/support/titoli.ts`; le osservazioni si seminano con `archivio.seminaOsservazioni`, che *sostituisce* quanto presente, così la spec possiede la propria premessa invece di ereditarla dal backfill d'avvio; i nuovi ISIN vanno aggiunti a `ISIN_CON_OSSERVAZIONI_E2E` per la bonifica di `globalSetup`; la pulizia sta nella fixture e mai in un `finally`. Il vincolo nuovo: il titolo va seminato con `fetched_at` **di adesso** (il default di `seminaTitolo`), perché è la guardia di buona cittadinanza a impedire un recupero reale — e un recupero registrerebbe un'osservazione a oggi, che riempirebbe da sola la finestra «ultimo mese» e smonterebbe in silenzio proprio lo scenario del criterio 4.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Il grafico si restringe e dichiara la copertura (dimostrativo, con video) | L'utente apre la scheda di un titolo con carichi e rilevazioni di quest'anno: il grafico si presenta su «Tutto lo storico», con tutti i punti. Sceglie «Ultimo mese» e il tracciato si restringe a quell'intervallo, con i soli punti che vi cadono. Sceglie «Ultimi 10 anni» e ottiene l'orizzonte pieno, con il tratto iniziale campito e la dichiarazione esplicita di quando la copertura dei dati comincia davvero |\n| Una finestra senza dati dichiara «dato non disponibile» | Su un titolo le cui rilevazioni sono tutte anteriori, la scelta di «Ultimo mese» sostituisce il grafico con la dichiarazione di dato non disponibile, che nomina l'intervallo richiesto e il punto d'archivio più recente rimasto fuori — nessun riquadro vuoto e nessun prezzo trascinato dentro la finestra |\n| «Tutto lo storico» è il default a ogni apertura | Alla prima apertura la scala attiva è «Tutto lo storico»; dopo averla cambiata, chiudere la scheda e aprire quella di un altro titolo riporta la scala al default invece di ereditare la scelta precedente |\n| Cambiare scala non chiede nulla al server | Contando le richieste della pagina dopo il caricamento della scheda, la selezione di tutte e cinque le scale non genera **alcuna** chiamata verso `**/api/**`: il ritaglio avviene sui dati che la pagina ha già |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-037/` — `index.html` mostra il selettore in testa al grafico con «Tutto lo storico» attivo; i due stati che i criteri 4 e 5 mettono alla prova (finestra vuota, copertura parziale) sono descritti qui sopra e vanno letti insieme al linguaggio visivo già fissato in `docs/mockups/US-036/`.\n\n_Piano generato con ARchetipo Planning — 11 agosto 2026_\n"
