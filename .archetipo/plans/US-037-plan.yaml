    body: 'Nel componente: a copertura ''assente'' sostituire la cornice con la dichiarazione «dato non disponibile» (data-testid="dato-non-disponibile"), che nomina l''intervallo richiesto e il punto d''archivio piu'' recente rimasto fuori — senza disegnare nemmeno la sola riga del prezzo medio, che si leggerebbe come un grafico vuoto; a copertura ''parziale'' tenere l''asse sull''orizzonte richiesto per intero, campire il tratto iniziale scoperto con la campitura obliqua gia'' esistente e aggiungere data-testid="dichiarazione-copertura" con data-inizio-dati. Esporre su grafico-titolo gli attributi data-scala e data-copertura, e adattare alla finestra le didascalie e l''etichetta dell''estremo sinistro, che con una finestra e'' un istante reale (dataIstante) e non un punto: la deduzione per coincidenza di US-036 va scavalcata. avgLoadPrice non si ricalcola mai per finestra.'
    ref: TASK-09
