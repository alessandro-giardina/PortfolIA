schema: archetipo/plan/v2
spec_code: US-035
body: "# US-035: Aggiornare in un colpo solo i titoli obsoleti del portafoglio — Piano di implementazione\n\n**Prodotto da:** Team di Pianificazione ARchetipo\n**Data:** 2026-08-10\n\n---\n\n## Spec\n\n**Epic:** EP-005 — Visualizzazione dei titoli\n**Priorità:** HIGH | **Punti:** 5\n**Bloccata da:** US-034\n\n**User Story**\nCome Alessandro, investitore-proprietario,\nvoglio lanciare dal riepilogo un unico comando che aggiorni tutti i titoli con rilevamento obsoleto, vedendo a che punto è il lavoro,\nin modo da riallineare il portafoglio senza aprire una scheda titolo alla volta e senza chiedere alle fonti dati che non possono essere cambiati.\n\n**Criteri di Accettazione**\n- Nel riepilogo un comando «Aggiorna i titoli obsoleti (N)» avvia il lavoro; a N = 0 è inattivo e ne dichiara la ragione\n- Sono interrogati soltanto i titoli dichiarati obsoleti o mai rilevati: nessuna richiesta parte per un titolo rilevato nella sessione corrente, e nessun recupero è forzato oltre la guardia di buona cittadinanza\n- I titoli sono aggiornati uno alla volta, in sequenza: in nessun istante due richieste alla stessa fonte sono in volo insieme\n- Il recupero riusa la catena esistente — fonte primaria, poi backup, con l'ordine dedotto dalla fonte già registrata per l'ISIN — senza una seconda implementazione del fetch\n- Durante il lavoro la pagina dichiara che il sistema sta lavorando: titolo in corso, avanzamento sul totale, e la nota che la fonte di backup può richiedere una decina di secondi per titolo\n- Prezzo, valore attuale, differenza della riga e valore totale del portafoglio si aggiornano dopo ogni titolo rilevato, senza attendere la fine del lavoro\n- Un titolo che nessuna fonte trova, o per cui nessuna fonte risponde, non interrompe il lavoro: è registrato come non aggiornato e si passa al successivo\n- Al termine un consuntivo dichiara quanti titoli sono stati aggiornati e quali no, con il relativo ISIN e la ragione\n- L'utente può interrompere il lavoro in corso: l'interruzione si ferma al titolo corrente e i titoli già aggiornati conservano i valori appena rilevati\n- Lasciando il portafoglio, o cambiandolo, mentre il lavoro è in corso il lavoro si interrompe e nessuna risposta in volo scrive sulla vista di un altro portafoglio o di un altro titolo\n- Rientrando nel riepilogo il conteggio dei titoli obsoleti è ricalcolato e riflette quanto era stato completato: quanto resta da fare si legge senza confrontare le date a mano\n- Il comando non è avviabile due volte in parallelo\n- Un test E2E copre la corsa completa e l'interruzione per cambio di portafoglio, senza dipendere dalla rete reale\n\n---\n\n## Soluzione Tecnica\n\nQuesta spec **non aggiunge un solo endpoint né una sola riga di logica di recupero**. Tutto ciò che serve esiste già e va soltanto messo in fila: `GET /api/securities/:isin` è la catena completa (guardia → ordine dei tentativi dedotto dalla fonte registrata → fonte primaria → backup → scrittura in archivio), `GET /api/portfolios/:id/positions/enriched` ricalcola prezzi, valori, differenze e `freshness` a ogni chiamata. Il lavoro nuovo è un **ciclo sequenziale nel client**, con la sua macchina a stati e i suoi presidi contro le risposte tardive.\n\n### L'identità che regge tutto il disegno\n\nDue criteri sembrano richiedere un controllo esplicito — «solo i titoli obsoleti sono interrogati» e «nessun recupero è forzato oltre la guardia» — e invece sono **veri per costruzione**, grazie a US-034:\n\n```\nfreshness === 'stale'  ⟺  classifyPriceFreshness(...) === 'stale'\n                       ⟺  classifyRefetch(...).kind === 'none'\n                       ⟺  GET /api/securities/:isin interroga la fonte senza chiedere conferma\n```\n\nLa prima equivalenza è la definizione di `classifyPriceFreshness` (`server/src/domain/marketHours.ts`), che delega a `classifyRefetch`; la terza è il ramo `classification.kind !== 'none'` di `server/src/api/securities.ts`. Ne segue che:\n\n- **la lista di lavoro e l'autorizzazione a contattare la fonte sono la stessa frase**, letta due volte. Un titolo `current` non entra nella lista, quindi nessuna richiesta parte per lui; un titolo `stale` entra nella lista *ed è esattamente* quello per cui la guardia lascia passare il recupero.\n- **`?force=true` non compare da nessuna parte.** Non serve, e usarlo violerebbe il criterio. Il ciclo chiama l'endpoint nudo, come fa già la scheda titolo al primo tentativo.\n\nQuesta identità è l'assunto portante dell'intera spec, ed è anche l'unico punto in cui una modifica futura la romperebbe in silenzio: da qui il test di equivalenza sul server (TASK-01), che la fissa come contratto invece di lasciarla come coincidenza fortunata.\n\n### L'unica crepa nell'identità: `never-fetched` con riga in cache\n\nC'è un caso, e va gestito dichiarandolo, non aggirandolo. L'endpoint arricchito classifica come `never-fetched` anche una riga presente in cache con `fetched_at` valorizzato ma `price` nullo (`server/src/api/positions.ts`: `istante` è `null` quando manca il prezzo). Per quella riga la guardia vede un `fetched_at` recente e può rispondere `intra-session`/`no-session`: l'endpoint restituisce **200 con `confirmation`, senza aver contattato la fonte**.\n\nLa tentazione è ripetere con `?force=true`. Il criterio lo vieta: «nessun recupero è forzato oltre la guardia di buona cittadinanza». Il ciclo quindi **registra quel titolo come non aggiornato**, con la ragione «l'archivio ha risposto senza contattare la fonte», e passa al successivo. È l'esito onesto: il prezzo non è stato rilevato e il consuntivo non finge il contrario. L'utente che voglia forzare ha già la strada di sempre — la scheda titolo, dove la guardia chiede e lui risponde (US-030).\n\n### Dove vive il ciclo, e perché lì\n\nNella scheda **Riepilogo**, in un componente dedicato (`client/src/components/AggiornaObsoleti.tsx`), non dentro `PortfolioDetailPage.tsx` — che è già a 1250 righe e ospiterebbe male una macchina a stati. Il componente riceve la lista dei titoli da aggiornare e un callback di ricalcolo; restituisce comando, riga di avanzamento e consuntivo. Vive dentro il ramo `scheda === 'riepilogo'`, quindi **si smonta da solo** quando l'utente cambia linguetta o lascia il portafoglio: la sospensione alla navigazione è una conseguenza del montaggio, non un meccanismo in più da ricordare.\n\nQuattro presidi, ciascuno per un fallimento preciso:\n\n1. **Lista congelata all'avvio.** Il ciclo itera su una copia della lista scattata al clic, non sulla prop viva. Il motivo è che dopo ogni titolo si ricalcola l'endpoint arricchito, che *cambia la prop* — un titolo appena aggiornato smette di essere `stale` e sparisce dalla lista. Iterare sulla prop viva significherebbe iterare su un array che si accorcia sotto i piedi: indici saltati, avanzamento «2 di 3» che diventa «2 di 1». Il totale del progresso resta quello dello scatto iniziale, ed è l'unico numero che l'utente possa seguire.\n2. **Guardia anti-doppio-avvio su `useRef`, non su stato.** `useState` è asincrono: due clic ravvicinati leggerebbero entrambi `inCorso === false`. Il `disabled` del bottone è la difesa visibile, il `ref` è quella vera.\n3. **`portafoglioMostrato` — il riferimento di US-030, promosso da titolo a portafoglio.** È il precedente che la spec stessa indica: `isinMostrato` in `client/src/components/SchedaTitolo.tsx` esiste perché una risposta può impiegare una decina di secondi, abbastanza perché l'utente sia altrove quando arriva. Qui il rischio è lo stesso e la cura è la stessa: alla risposta si confronta il riferimento e, se il portafoglio è cambiato, la risposta viene **lasciata cadere** — niente `setState`, niente ricalcolo, niente consuntivo scritto sulla vista di un altro conto.\n4. **Sequenzialità per costruzione.** Un `for...of` con `await` su ogni titolo: non c'è un `Promise.all` da cui possa nascere una seconda richiesta in volo. È il criterio più facile da soddisfare e il più facile da rompere per distrazione, quindi l'E2E lo misura contando le richieste in volo (vedi Strategia di test).\n\n### L'interruzione: cooperativa, non brutale\n\n«L'interruzione si ferma al titolo corrente» ammette due letture, e ne scegliamo una sola. Il comando «Interrompi» alza una bandierina (`ref`) che il ciclo controlla **prima di iniziare il titolo successivo**: la richiesta già in volo arriva a destinazione e il suo esito viene registrato. Il motivo è di onestà del dato: il server, una volta partito, scrive comunque in archivio l'anagrafica appena rilevata, e abortire il solo lato client produrrebbe un titolo aggiornato in archivio ma dichiarato «non interrogato» nel consuntivo — cioè una bugia recuperabile solo ricaricando la pagina.\n\nPerché l'attesa non sembri un comando ignorato, l'interfaccia risponde **subito**: la riga di stato passa a «Interruzione richiesta — si attende la risposta del titolo in corso», e il consuntivo finale distingue i titoli conclusi da quelli mai interrogati. La stessa scelta vale per lo smontaggio: la richiesta in volo non viene abortita, ma il suo esito viene lasciato cadere dal presidio (3) — il vincolo del criterio è che «nessuna risposta in volo scriva sulla vista di un altro portafoglio», non che il socket venga chiuso.\n\n### Un solo recupero, condiviso con la scheda titolo\n\nIl criterio «senza una seconda implementazione del fetch» si soddisfa in modo verificabile estraendo in `client/src/domain/recuperoTitolo.ts` la funzione che interroga la fonte per un ISIN e **classifica** l'esito in un'unione discriminata:\n\n| Risposta del server | Esito |\n|---|---|\n| 200 senza `confirmation` | `aggiornato` (con la fonte che ha risposto) |\n| 200 con `confirmation` | `guardia` — l'archivio ha risposto, la fonte non è stata contattata |\n| 404 | `non-trovato` |\n| 502 | `fonte-muta` |\n| altro / rete assente | `errore` |\n\nLa classificazione è condivisa, **le frasi no**: la scheda titolo dice «I dati in scheda restano quelli in archivio», il consuntivo dice «nessuna fonte ha trovato il titolo». Sono due registri diversi per due contesti diversi, e fonderli produrrebbe una frase giusta in nessuno dei due. `SchedaTitolo.aggiornaDati` viene riscritta per consumare il classificatore mantenendo intatte le proprie frasi e il proprio comportamento — la suite `US-030__*` è la rete che lo verifica.\n\n### Il ricalcolo dopo ogni titolo, senza far sparire la tabella\n\n`fetchEnriched` oggi alza `enrichedLoading`, e il riepilogo sostituisce l'intera tabella con «Caricamento titoli…». Chiamarla dopo ogni titolo farebbe **lampeggiare via la tabella** una volta per titolo: l'opposto del criterio «si aggiornano dopo ogni titolo rilevato». La funzione prende quindi un parametro `silenzioso`: stessa lettura, senza alzare il flag. Il ciclo la chiama in modalità silenziosa; il caricamento iniziale resta com'è.\n\nSulla stessa funzione poggia anche il criterio del rientro. Oggi il ricalcolo scatta al montaggio della pagina, non al ritorno sulla linguetta Riepilogo — che non smonta nulla. Basta un effetto che rilegga in modalità silenziosa quando `scheda` torna a `'riepilogo'`: il conteggio è ricalcolato in entrambi i modi di rientrare, e il titolo la cui risposta era stata lasciata cadere allo smontaggio riappare con il valore che il server ha comunque scritto.\n\n### Cosa il server *non* fa\n\nNessuna modifica ad `server/src/api/securities.ts`, `server/src/api/positions.ts`, `shared/types/index.ts` o allo schema. Nessun endpoint di batch: la decisione presa in analisi — il lavoro vive nel client e muore con la navigazione — è ciò che rende superfluo un job lato server, la sua persistenza, il suo recupero dopo un riavvio e la sua concorrenza fra più schede del browser. Il prezzo di quella decisione è che il lavoro non sopravvive al cambio pagina; il conteggio ricalcolato di US-034 è ciò che lo rende recuperabile con un secondo clic invece che con un'indagine sulle date.\n\n---\n\n## Strategia di Test\n\nIl progetto non ha un runner di test unitari per il client (`npm run test` esegue Vitest nel solo workspace `server`), e introdurne uno in questa spec sarebbe uno scopo che nessun criterio chiede. La copertura si distribuisce di conseguenza: **un test unitario sul server per l'invariante che regge il disegno**, e **l'E2E per tutto il resto**, con l'accortezza di rendere osservabili dal browser i comportamenti che altrove sarebbero interni.\n\n- **Unitario (server).** In `server/tests/marketHours.test.ts`, l'equivalenza «`stale` ⟺ la guardia non chiede conferma» su tempi deterministici, nei quattro casi già coperti dal file. È il contratto su cui il client si appoggia per non forzare mai un recupero: se un domani `classifyPriceFreshness` smettesse di delegare, questo test cade prima che il difetto arrivi in pagina.\n- **Nessun test sul percorso di recupero reale.** Vale la nota in testa a `e2e/support/titoli.ts`: la copertura degli adapter vive nei test unitari di `server/tests/` e nello smoke manuale `server/scripts/morningstar-smoke.ts`.\n- **Regressione della scheda titolo.** L'estrazione del classificatore non deve cambiare nulla di visibile: le suite `US-030__aggiorna-dati-titolo.spec.ts` e `US-030__aggiorna-dati-titolo-varianti.spec.ts` coprono già i sei stati della riga di provenienza e sono la verifica dell'estrazione.\n\n### Test E2E — Simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts`, suite in `e2e/`, fixture `archivio` da `e2e/support/fixtures.ts`)\n**Registrazione video:** solo lo scenario demo (`docs/test-results/US-035/`), salvato con `page.video().saveAs()` in un `afterEach` dopo `page.close()`; gli altri scenari girano senza video, in un file fratello, perché `launchOptions: { slowMo }` non è scopabile in un `describe`.\n\n**Come si resta fuori dalla rete reale.** Tutti gli scenari intercettano `**/api/securities/**` con `page.route(...)` e rispondono con `route.fulfill()`: il server non contatta mai Borsa Italiana né MorningStar. Perché il ricalcolo successivo mostri davvero un prezzo nuovo, lo scenario **semina in archivio** il valore aggiornato prima di servire la risposta stub — è il pattern già collaudato in `e2e/US-030__aggiorna-dati-titolo-varianti.spec.ts`, dove lo stub serve il lookup e `archivio.seminaTitolo` scrive la riga che il server avrebbe scritto.\n\n**Come si misura la sequenzialità.** Il gestore di rotta tiene un contatore delle richieste in volo: lo incrementa all'ingresso, attende un ritardo simulato, lo decrementa all'uscita, e registra il massimo raggiunto. A fine corsa il test asserisce che il massimo sia **1**. È il criterio «in nessun istante due richieste in volo» reso eseguibile, senza ispezionare lo stato interno del componente. Il gestore registra anche l'ordine degli ISIN richiesti: serve ad asserire che nessun titolo `current` sia mai stato chiesto.\n\n**Il budget di tempo.** `playwright.config.ts` non fissa un `timeout` di test, quindi vale il predefinito di 30 secondi. Lo scenario demo somma `slowMo: 300`, tre titoli con ritardo simulato e le pause che rendono leggibile il video: il ritardo dello stub va tenuto sotto il mezzo secondo per titolo e, se il conto non torna, si alza il tetto con `test.setTimeout()` nel solo file demo — non nella configurazione condivisa, dove allenterebbe la rete di tutti.\n\n**Costanti ISIN.** Un insieme riservato per file, come impone `e2e/support/titoli.ts`: i file di US-035 seminano e rimuovono, ed è la stessa pila di undo che rende la condivisione fra file irrecuperabile. Il file demo ne riserva quattro (tre obsoleti + uno rilevato adesso), il file varianti i propri.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| **Demo — la corsa completa** (con video) | Alessandro apre un portafoglio con 4 titoli, 3 dei quali con rilevamento obsoleto. Il riquadro di conteggio dichiara «3 titoli su 4 con rilevamento obsoleto» e offre il comando «Aggiorna i titoli obsoleti (3)». Lo clicca: la riga di stato dichiara l'ISIN in corso e «1 di 3», poi «2 di 3», poi «3 di 3»; la nota avverte che la fonte di backup può richiedere una decina di secondi. Dopo il primo titolo il prezzo di quella riga e il valore totale sono già cambiati, senza che la tabella sparisca. Il secondo titolo non è trovato da nessuna fonte (404) e il lavoro prosegue. Al termine il consuntivo dichiara «Aggiornati 2 titoli su 3» ed elenca l'ISIN non aggiornato con la ragione; il conteggio in cima è sceso e le postille «da aggiornare» sono sparite dalle righe aggiornate. Il titolo rilevato nella sessione corrente non è mai stato chiesto alla fonte, e il massimo delle richieste in volo è rimasto 1. |\n| **Interruzione per cambio di portafoglio** | Con la corsa avviata su un portafoglio e uno stub lento, Alessandro torna all'elenco e apre un secondo portafoglio. Il lavoro non prosegue: nessuna richiesta parte per i titoli rimasti, e il riepilogo del nuovo portafoglio non mostra né riga di avanzamento né consuntivo del lavoro abbandonato. I titoli già aggiornati conservano i valori appena rilevati, e rientrando nel primo portafoglio il conteggio riflette quanto era stato completato. |\n| **Interruzione richiesta dall'utente** | A corsa avviata Alessandro clicca «Interrompi»: la riga di stato dichiara subito l'interruzione richiesta, il titolo in corso arriva a conclusione e il consuntivo distingue i titoli conclusi da quelli rimasti non interrogati. |\n| **Nessun titolo da aggiornare (N = 0)** | In un portafoglio i cui titoli sono tutti allineati all'ultima sessione, il comando è presente ma inattivo e ne dichiara la ragione. Nessuna richiesta parte, nemmeno cliccandolo. |\n| **La guardia risponde dall'archivio** | Un titolo classificato «mai rilevato» ma con una riga in cache recente e prezzo nullo: la risposta porta `confirmation`, il ciclo non forza il recupero e lo registra fra i non aggiornati con la ragione dichiarata. Nessuna richiesta con `?force=true` è mai partita. |\n| **Doppio avvio** | Due clic ravvicinati sul comando: il gestore di rotta conta le richieste per ISIN e nessuna risulta duplicata; il comando è disabilitato dal primo clic in poi. |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono in `docs/mockups/US-035/`\n\n_Piano generato da ARchetipo Planning — 2026-08-10_\n"
