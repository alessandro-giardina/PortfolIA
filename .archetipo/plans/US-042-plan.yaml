schema: archetipo/plan/v2
spec_code: US-042
body: "# US-042: Registrare la vendita parziale o totale di una posizione con attribuzione LIFO — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 12 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-008 — Vendite e posizioni chiuse\n**Priorità:** HIGH | **Punti:** 5\n**Bloccata da:** — (è la spec che sblocca US-043, US-044 e US-045)\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio registrare la vendita di una parte o di tutta la quantità posseduta di un titolo, in modo da tenere il portafoglio allineato alle operazioni realmente eseguite senza falsificare i carichi passati (FR-022, FR-023, FR-024, ADR-009).\n\n**Criteri di Accettazione**\n- [ ] Dal Registro carichi è possibile registrare una vendita indicando data, prezzo di vendita e quantità\n- [ ] La vendita è registrata come nuova iscrizione: nessun carico esistente viene modificato o cancellato\n- [ ] La quantità residua per ISIN è Σ carichi − Σ vendite, e il prezzo medio del residuo è ricalcolato consumando i lotti in ordine LIFO (prima i carichi con data più recente fra quelli non successivi alla data di vendita)\n- [ ] Una vendita di quantità superiore a quella disponibile alla data indicata è rifiutata con messaggio esplicito, e la quantità residua non è mai negativa\n- [ ] Una vendita con data anteriore al carico che dovrebbe consumare è rifiutata\n- [ ] La rimozione di un carico già consumato, anche solo in parte, da una vendita è impedita con un messaggio che distingue la correzione di un'iscrizione errata dalla vendita\n\n---\n\n## Soluzione tecnica\n\nLa spec introduce **una seconda specie di iscrizione** nel registro, non una modifica della prima. Da qui discendono, in ordine, tutte le decisioni che seguono: una vendita è una riga nuova in una tabella nuova; nessuna riga di `positions` viene mai toccata; e ogni grandezza che *sembra* essere stata cambiata dalla vendita — la quantità posseduta, il prezzo medio di carico — non è memorizzata da nessuna parte, ma **derivata rigiocando le vendite sui carichi**. È l'ADR-009 preso alla lettera: «un valore salvato può divergere dal registro che dovrebbe riassumere».\n\nIl difetto che questa spec esiste per rendere impossibile è la scorciatoia ovvia: *decrementare `positions.quantity` all'atto della vendita*. Costa poche righe, dà numeri plausibili e distrugge il fatto — dopo la vendita nessuno può più sapere a che prezzo e in che data le quote erano state comprate, e il P&L realizzato di US-043 diventerebbe incalcolabile per costruzione.\n\n### Il fatto nuovo: la tabella `sales`\n\nNuova tabella con migrazione Drizzle (`0006_*`), gemella di `positions`:\n\n| Colonna | Tipo | Nota |\n|---|---|---|\n| `id` | INTEGER PK | |\n| `portfolio_id` | INTEGER NOT NULL | FK su `portfolios.id` **ON DELETE CASCADE** |\n| `isin` | TEXT NOT NULL | |\n| `sale_date` | TEXT NOT NULL | ISO-8601 `YYYY-MM-DD`, come `load_date` |\n| `sale_price` | REAL NOT NULL | |\n| `quantity` | INTEGER NOT NULL | |\n| `created_at` | INTEGER NOT NULL | `unixepoch()` |\n\n`ON DELETE CASCADE` non è una scelta di stile: la fixture `archivio` degli E2E smonta i portafogli di prova con una DELETE, e senza cascade ogni test che registra una vendita lascerebbe righe orfane — o farebbe fallire la teardown sul vincolo di chiave esterna.\n\n**Nessun campo calcolato è persistito.** Non `realized_pnl`, non `cost_basis`, non la quantità residua del lotto. Sono tutti derivabili dal registro, e ADR-009 li vuole derivati.\n\n### Il dominio: `shared/domain/lottiLifo.ts`\n\nModulo puro, come i tre fratelli già in `shared/domain/` (`serieTitolo`, `metricheTitolo`, `serieValore`): nessuna rete, nessun archivio, nessun orologio. Si affaccia da `shared/types/index.ts` come gli altri, perché client e server devono leggere lo stesso criterio.\n\nIl cuore è **una sola funzione di rigiocata**, non una collezione di formule indipendenti:\n\n`rigiocaRegistro({ carichi, vendite })` → `RegistroRigiocato`\n\n- ordina le vendite per `(saleDate, id)` crescente — l'attribuzione dipende dall'ordine, e due vendite dello stesso giorno devono consumare nell'ordine in cui sono state iscritte;\n- per ciascuna, consuma i lotti con `loadDate ≤ saleDate` in ordine di `(loadDate, id)` **decrescente** — è la definizione operativa di LIFO del criterio 3, con il pari merito fra due carichi dello stesso giorno sciolto dall'id (l'ultimo iscritto è il più recente);\n- attinge dalla **quantità residua** del lotto, non dalla sua quantità nominale: un lotto già consumato da una vendita precedente non può essere consumato due volte;\n- restituisce, per ogni lotto, la quantità residua; per ogni vendita, l'elenco delle attribuzioni `{ lottoId, quantita, prezzoCarico }` e il costo attribuito totale; e l'eventuale **scoperto**, cioè la quantità che nessun lotto ha potuto coprire.\n\nAttorno a essa, tre funzioni che la interrogano e non ricalcolano nulla per conto proprio:\n\n- `quantitaDisponibileA(carichi, vendite, data)` = Σ carichi con `loadDate ≤ data` − Σ vendite con `saleDate ≤ data`;\n- `verificaVendita({ carichi, vendite, nuova })` → `EsitoVerifica`, uno fra `ok`, `quantita-eccedente` (con la quantità disponibile) e `anteriore-al-carico` (con la disponibile *alla data* e il totale). **Sono due esiti distinti e non uno**: quando la quantità totale basterebbe ma quella alla data no, la premessa saltata è la data, e il criterio 5 chiede che il rifiuto lo dica;\n- `residuoPerIsin({ carichi, vendite })` → `{ quantitaCaricata, quantitaVenduta, quantitaResidua, prezzoMedioResiduo, costoResiduo, costoAttribuito }`.\n\nDue proprietà del dominio sono **invarianti da testare**, non commenti: `quantitaResidua ≥ 0` sempre (l'API rifiuta prima di scrivere, quindi il registro non può contenere uno scoperto), e `costoAttribuito + costoResiduo = Σ (loadPrice × quantity)` di tutti i carichi. La seconda è la base di percentuale che US-043 userà, e conviene che sia già vera e già coperta qui.\n\n### `prezzoMedioResiduo` è nullable, e questa è la modifica che tocca più file\n\nCon residuo 0 non esiste un prezzo medio: scrivere `0` sarebbe un valore inventato, e ADR-003 lo vieta esattamente come per un prezzo di mercato mancante. `prezzoMedioResiduo` è perciò `number | null`, e la nullabilità **risale** fino ai tipi condivisi: `PositionSummary.avgLoadPrice`, `EnrichedPositionSummary.avgLoadPrice` e `PositionDetail.avgLoadPrice` diventano `number | null`, con i valori derivati (`totalLoadValue`, `difference`, `differencePercent`) coerenti. I tre punti di resa che oggi fanno `avgLoadPrice.toFixed(4)` mostrano `–` con la classe `dato-mancante` già in uso.\n\nCosto accettato e deliberato: è un cambio di firma che il compilatore segnala ovunque, ed è preferibile alla variante silenziosa in cui uno zero finto attraversa il riepilogo e finisce sommato in un totale.\n\n### Le tre viste aggregate passano dal dominio\n\n`GET /positions/summary`, `GET /positions/enriched` e `GET /positions/:isin/detail` calcolano oggi la quantità con `SUM(quantity)` e il prezzo medio con una media ponderata in SQL. **Nessuna delle due sa fare LIFO**, e nessuna delle due può sottrarre le vendite. Le tre rotte leggono quindi le righe di `positions` e `sales` e delegano al dominio, esattamente come US-038 ha già spostato il P&L da carico fuori dalla rotta.\n\nConseguenze da conoscere, tutte volute:\n\n- `totalQuantity` diventa la **quantità residua**. È la cifra che la tabella dei titoli chiama «Quantità» ed è ciò che FR-010 vuole nel valore attuale: il portafoglio vale i titoli posseduti, non quelli venduti. Si aggiungono `loadedQuantity` e `soldQuantity`, così nulla è nascosto dietro un solo numero;\n- `avgLoadPrice` diventa il medio **dei soli lotti non consumati** — il criterio 3 alla lettera;\n- un ISIN interamente venduto **resta elencato con quantità 0** e contribuisce 0 al valore attuale. Toglierlo dalla tabella ed elencarlo fra le posizioni chiuse è **US-044**, e anticiparlo qui significherebbe consegnare metà di quella spec senza la sezione che la rende leggibile. Una riga a zero è un'informazione vera; una riga sparita senza spiegazione no.\n\n`PositionDetail.loads` porta in più, per ogni carico, la `residualQuantity` del lotto: è ciò che l'interfaccia usa per marcare il lotto esaurito e per impedirne la rimozione.\n\n### API\n\n| Rotta | Esito |\n|---|---|\n| `POST /api/portfolios/:id/sales` | `201` con la vendita creata; `400` con messaggio distinto per ciascuna delle due premesse violate; `404` portafoglio inesistente |\n| `GET /api/portfolios/:id/sales` | elenco per `(sale_date, id)` |\n\nLe vendite stanno sotto `/sales` e non sotto `/positions/...` di proposito: quel prefisso ospita già cinque rotte con vincoli d'ordine di registrazione delicati (`/enriched` e `/summary` prima di `/:isin/detail`, tutte prima della GET generica), e infilarci una sesta è una fonte di conflitti gratuita. Sono inoltre due specie diverse di iscrizione, e l'indirizzo lo dice.\n\nValidazione del `POST`, nell'ordine: portafoglio esistente → ISIN formalmente valido → data ISO → prezzo finito e positivo → quantità intera positiva → **verifica di dominio** (`verificaVendita`). Solo l'ultimo controllo può produrre i due messaggi del criterio 4 e del criterio 5; i precedenti riusano parola per parola quelli già scritti per il carico.\n\n### La guardia sul carico consumato\n\n`DELETE` e `PATCH` di `/api/portfolios/:portfolioId/positions/:positionId` rigiocano il registro e, se il lotto ha `residualQuantity < quantity`, rispondono **`409 Conflict`** con il messaggio che distingue le due operazioni:\n\n> Questo carico è già stato consumato, anche solo in parte, da una vendita: non può essere rimosso. La rimozione di un carico è la correzione di un'iscrizione errata e cancella il carico come se non fosse mai avvenuto; per ridurre la posizione a seguito di un'operazione realmente eseguita si registra una vendita.\n\n`409` e non `400`: la richiesta è ben formata, è lo **stato del registro** a renderla impossibile.\n\nIl criterio 6 nomina la sola rimozione, ma FR-024 vieta anche la modifica — e per la stessa ragione: cambiare prezzo o data di un lotto già consumato riscriverebbe a posteriori il costo attribuito a una vendita già iscritta. La guardia copre quindi entrambi i verbi; è l'unico punto in cui il piano va oltre la lettera dei criteri, e lo fa restando dentro il requisito funzionale citato dalla spec.\n\n### Interfaccia\n\nIl modulo di scarico vive nella linguetta **Carico titoli**, sotto quello di carico, come chiede il criterio 1 («dal Registro carichi»). `PortfolioDetailPage.tsx` è già a 1271 righe: le due parti nuove nascono come componenti propri invece di allungarla ancora.\n\n- `client/src/components/ModuloScarico.tsx` — il modulo (titolo con la sua giacenza, data, prezzo, quantità), i due banner di rifiuto e l'invio;\n- `client/src/components/FasciaLifo.tsx` — la fascia dei lotti dei mockup: barre proporzionali disposte **dal più recente al più antico**, quota consumata tratteggiata in carminio, quota residua piena in ottone. Non è decorazione: LIFO *è* un ordine, e un ordine si mostra disponendo le cose. Il lotto successivo alla data di vendita compare tratteggiato e dichiarato fuori data, non scompare — sparire direbbe «non esiste», il tratteggio dice la cosa vera;\n- il **registro unificato** in pagina: carichi e scarichi nella stessa tabella, in ordine di data, distinti da una marca in prima colonna. Due tabelle affiancate direbbero che i due fatti vivono in libri separati, che è la tesi opposta a quella di ADR-009;\n- sul carico consumato «Modifica» e «Rimuovi» **restano visibili**, inerti e tratteggiati, con la ragione scritta sotto (`.bottone.impedito` / `.perche`). Un bottone scomparso non spiega perché è scomparso, e il criterio 6 chiede proprio quella spiegazione;\n- il riquadro del residuo mostra quantità residua e prezzo medio ricalcolato **accanto al valore che aveva prima**: il ricalcolo è il fatto, non l'assestamento di una cifra qualunque.\n\nGli stili nuovi vanno in coda a `client/src/ledger.css`, riprendendo `docs/mockups/US-042/shared.css` senza riscrivere alcuna regola esistente.\n\n### Fuori perimetro\n\n- Il **P&L realizzato** e la sua separazione dal latente: **US-043**. Qui compare il solo *costo attribuito*, che è ciò che LIFO produce.\n- La sezione **Posizioni chiuse** e la scomparsa del titolo azzerato dalla tabella: **US-044**.\n- La **quantità detenuta a una data** nel grafico del valore: **US-045**. La funzione `quantitaDisponibileA` introdotta qui è però esattamente il predicato che quella spec userà.\n- Nessun **saldo di liquidità** (ADR-009 §3): l'incasso della vendita non entra nel valore del portafoglio. La dichiarazione esplicita all'utente è un criterio di US-043; qui compare come nota nel modulo, dove è il posto naturale per non fraintendere l'operazione mentre la si registra.\n- Nessuna modifica agli adapter di mercato, alla cache prezzi o allo storico osservazionale.\n\n### Assunzioni e questioni aperte\n\n1. **Una vendita non è cancellabile.** Nessun criterio lo chiede e il piano non lo aggiunge, ma la conseguenza va detta: una vendita iscritta per errore non è correggibile e blocca in permanenza la rimozione del carico che ha consumato. Vale la pena valutarne una spec dedicata in EP-008 (una vendita si annulla con una **storno** — un'altra iscrizione — non con una DELETE, se si vuole restare dentro ADR-009).\n2. **Un carico inserito a posteriori con data anteriore a una vendita già iscritta** cambia retroattivamente l'attribuzione LIFO di quella vendita — è il rovescio della scelta «derivare invece di memorizzare». Non è coperto dai criteri e non viene impedito da questo piano; diventa rilevante quando US-043 congelerà il realizzato, e va sollevato lì.\n3. **Le quantità restano intere**, come per i carichi (`quantity: integer`). Le frazioni di quota degli ETF non sono supportate oggi e questa spec non cambia la regola.\n\n---\n\n## Strategia di test\n\nIl peso sta sui **test unitari del dominio**: LIFO è un ordine, e un errore di ordine produce cifre plausibili — un medio residuo sbagliato di pochi centesimi non si nota a occhio in nessuna schermata. Le rotte si testano per gli esiti e i messaggi; l'interfaccia per il flusso.\n\n- `server/tests/lottiLifo.test.ts` (nuovo): consumo del lotto più recente per primo; consumo che attraversa più lotti; consumo parziale con lotto a metà; due vendite in sequenza dove la seconda non riconsuma il primo lotto; pari merito fra due carichi dello stesso giorno sciolto dall'id; lotti successivi alla data di vendita esclusi dall'attribuzione; `quantitaDisponibileA` prima, fra e dopo le iscrizioni, con l'estremo incluso; `prezzoMedioResiduo` ricalcolato sui soli lotti non consumati e **`null`** a residuo 0; i due esiti di `verificaVendita` distinti (quantità totale sufficiente ma non alla data → `anteriore-al-carico`); le due invarianti (`quantitaResidua ≥ 0`, `costoAttribuito + costoResiduo = costo dei carichi`); registro senza vendite che restituisce esattamente la media ponderata di prima.\n- `server/tests/api.sales.test.ts` (nuovo): `201` con la riga creata e i carichi **immutati** (riletti e confrontati campo per campo — è il criterio 2, e va asserito, non dedotto); i due `400` con i rispettivi messaggi; `404` su portafoglio inesistente; le validazioni di formato; `GET` ordinato; `summary`/`enriched`/`detail` che dopo la vendita riportano quantità residua, medio ricalcolato e i nuovi campi.\n- `server/tests/api.positions.consumati.test.ts` (nuovo): `DELETE` e `PATCH` di un lotto consumato → `409` con il messaggio che distingue errata e vendita; `DELETE` di un lotto **non** consumato → `204` come prima; consumo anche solo parziale che basta a impedire.\n- **Regressione**: `api.positions.summary.test.ts`, `api.positions.enriched.test.ts`, `api.positions.detail.test.ts` devono passare invariati quando non esiste alcuna vendita — il passaggio dal SQL al dominio non deve muovere di un centesimo i valori esistenti.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`playwright.config.ts` alla radice, spec in `e2e/`, fixture `archivio` obbligatoria — mai `try/finally`).\n**Registrazione video:** solo lo scenario dimostrativo (campo *Dimostra* della spec), salvato con `page.video().saveAs('docs/test-results/US-042/demo-vendita-lifo.webm')` in un `afterEach` dopo `page.close()`; gli altri scenari girano senza video, in un file sorello (regola della coppia `US-026__*`, perché `launchOptions.slowMo` non è limitabile a un `describe`).\n**Dati:** una nuova costante `TITOLO_US_042` in `e2e/support/titoli.ts`, ISIN mai usato altrove e di proprietà del file dimostrativo, con il file delle varianti dichiarato in `lettoDa` **solo se** non semina né rimuove — altrimenti chiave propria (`npm run check:chiavi` lo verifica prima ancora che i test partano). Le vendite si creano via API dentro il portafoglio della fixture e spariscono con esso per cascade: nessuna nuova primitiva in `e2e/support/archivio.ts`. Date di carico e di vendita espresse in **giorni indietro da adesso**, mai fisse.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Vendita parziale e poi totale (**demo**) | L'utente apre un portafoglio con 1.000 quote di un ISIN iscritte in due carichi (600 e 400, il secondo più recente e più caro), va su *Carico titoli* e legge quantità 1.000 con il medio ponderato. Compila il modulo di scarico con 400 quote a 12,5000: il registro mostra una nuova riga di **scarico**, i due carichi sono ancora lì, la quantità residua passa a **600** e il prezzo medio del residuo diventa quello del solo primo carico. Registra poi le restanti 600: la quantità residua diventa **0**, il prezzo medio è dichiarato assente e nessuna riga di carico è stata cancellata. |\n| Il rifiuto per quantità eccedente | Con residuo 600, una vendita di 700 quote è rifiutata con il messaggio che nomina la quantità disponibile; nessuna iscrizione compare a registro e la quantità residua resta 600. |\n| Il rifiuto per data anteriore al carico | Una vendita di 800 quote datata prima del secondo carico è rifiutata con il messaggio **distinto** dal precedente (la quantità totale basterebbe, quella alla data no); si verifica che i due testi non coincidano. |\n| Il carico consumato non si rimuove | Sul lotto consumato dalla prima vendita i comandi «Modifica» e «Rimuovi» sono inerti e mostrano la ragione; il tentativo via API risponde `409`. Sul lotto non consumato la rimozione funziona ancora. |\n| Il valore del portafoglio segue il residuo | Dopo la vendita parziale, il valore attuale del titolo nel riepilogo è calcolato sulle 600 quote residue e non sulle 1.000 caricate; l'incasso non compare in alcun totale. |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono in `docs/mockups/US-042/` — `index.html` (vendita parziale con la fascia dei lotti e il riquadro del residuo), `vendita-totale.html` (residuo azzerato, prezzo medio dichiarato assente), `rifiuti.html` (i tre rifiuti con tre messaggi distinti), con `README.md` che ne motiva le scelte.\n\n_Piano generato con ARchetipo Planning — 12 agosto 2026_\n"
