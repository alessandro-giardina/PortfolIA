schema: archetipo/plan/v2
spec_code: US-018
body: "# US-018: Visualizzare il dettaglio completo di un titolo — Piano di implementazione\n\n**Prodotto da:** Squadra di Pianificazione ARchetipo\n**Data:** 07 agosto 2026\n\n---\n\n## Spec\n\n**Epic:** EP-005 — Visualizzazione dei titoli\n**Priorità:** MEDIUM | **Punti:** 3\n**Bloccata da:** US-017 (DONE — la tabella titoli esiste e diventa il punto di ingresso del dettaglio)\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio cliccare su un titolo della tabella e vederne tutti i dati disponibili, in modo da approfondire l'anagrafica completa quando mi serve (FR-014).\n\n**Criteri di Accettazione**\n- [ ] Il dettaglio del titolo mostra i dati di posizione (quantità, valore attuale, valore medio di carico, differenza)\n- [ ] Il dettaglio mostra i dati anagrafici: ticker, tipo strumento, commissioni annue, valuta, emittente, segmento, politica dividendi\n- [ ] Il dettaglio indica la fonte dei dati (Borsa Italiana primaria o MorningStar di backup), in coerenza con FR-021\n- [ ] I campi non disponibili sono dichiarati \"dato non disponibile\" senza valori inventati\n\n---\n\n## Soluzione Tecnica\n\nIl dettaglio è una **vista di sola lettura** che compone in un'unica risposta ciò che il database già contiene: l'aggregato di posizione (tabella `positions`), l'anagrafica completa (cache `securities`) e i carichi individuali di quell'ISIN. Non contatta mai la fonte esterna — un recupero a freddo costa 8-12 secondi e aggirerebbe la guardia di buona cittadinanza di `GET /api/securities/:isin`: quando l'anagrafica non è in archivio la scheda lo dichiara e rimanda alla ricerca titoli, che è il percorso previsto per popolarla.\n\n- **Tipo condiviso `PositionDetail`** in `shared/types/index.ts`: aggregato di posizione (`totalQuantity`, `avgLoadPrice`, `totalLoadValue`, `currentPrice`, `currentValue`, `difference`, `differencePercent`), anagrafica completa (`name`, `ticker`, `instrumentType`, `totalAnnualFees`, `currency`, `issuer`, `segment`, `dividendPolicy`), provenienza (`dataSource`, `fetchedAt`) ed elenco `loads: Position[]`. Ogni campo derivato dalla cache è `null`-abile: `null` significa \"dato non disponibile\", mai zero e mai un valore stimato.\n\n- **Migrazione additiva `securities.data_source`** (TEXT nullable). Questo è il requisito implicito che il criterio sulla fonte porta con sé: la provenienza oggi vive solo nella risposta di un fetch fresco (`fetchWithFallback` in `server/src/api/securities.ts`) e non viene persistita, quindi per un titolo già in archivio è informazione perduta. La colonna viene scritta da `upsertSecurity`; le righe preesistenti restano `null` e la scheda le dichiara **\"fonte non registrata\"** invece di attribuirle d'ufficio a Borsa Italiana — la stessa disciplina di onestà del criterio 4. Nella stessa modifica `GET /api/securities/:isin` inizia a servire `dataSource` anche sulle risposte da cache, dove oggi è assente: la pagina di ricerca dichiara quindi \"Borsa Italiana\" anche per un titolo trovato via MorningStar, e questo chiude la divergenza.\n\n- **Endpoint `GET /api/portfolios/:id/positions/:isin/detail`** in `server/src/api/positions.ts`: aggregazione per ISIN (somma quantità e media ponderata, come `/enriched`) in LEFT JOIN sulla cache `securities`, più la lista dei carichi ordinata per `load_date`. Restituisce 400 su ISIN malformato (`isValidIsin`), 404 se il portafoglio non esiste o se quell'ISIN non ha carichi nel portafoglio. Va registrato con le altre GET a percorso specifico — prima di `GET /positions` — seguendo la convenzione già annotata nel file.\n\n- **Frontend: la linguetta \"Scheda titolo\"**, oggi presente e `disabilitata` in `client/src/pages/PortfolioDetailPage.tsx`, diventa la casa del dettaglio. Le righe della tabella di riepilogo diventano cliccabili (classe `cliccabile` già in `ledger.css`, più `role=\"button\"`, `tabIndex` e attivazione da tastiera con Enter/Spazio); il click memorizza l'ISIN selezionato e attiva la linguetta, che resta disabilitata finché nessun titolo è selezionato. Il dettaglio vive in un componente dedicato `client/src/components/SchedaTitolo.tsx`, non inline: `PortfolioDetailPage` supera già le mille righe.\n\n- **Tre sezioni, come da mockup**: cartellino \"Posizione a conto\" a quattro caselle (quantità, valore medio di carico, valore attuale, differenza con percentuale), \"Anagrafica ufficiale\" a due colonne di definizioni, \"Carichi registrati\" come tabella `mastro`. Fra anagrafica e carichi, la riga di provenienza con timbro — primaria, di backup o non registrata — e la data di rilevazione.\n\n### Decisioni e assunzioni\n\n- **Linguetta, non rotta dedicata.** Il dettaglio è uno stato di `PortfolioDetailPage`, coerente con le schede introdotte da US-026 e col mockup di inception `docs/mockups/libro-mastro/titolo.html`. Costo accettato: il dettaglio non è indirizzabile via URL. Se in futuro servisse condividere il link di un titolo, la conversione in rotta `/portfolios/:id/titoli/:isin` è locale al componente.\n- **I carichi individuali sono inclusi** pur non essendo richiesti dai criteri: il dato è già disponibile senza costo aggiuntivo e la sezione è parte del mockup di riferimento. È la sola aggiunta rispetto alla lettera dei criteri.\n- **Nessun ricalcolo lato client.** `currentValue`, `difference` e `differencePercent` arrivano già calcolati dal server, come per `/enriched`: un solo luogo dove la formula può sbagliare.\n\n---\n\n## Strategia di Test\n\nLa verifica insiste sui due assi che questa spec può sbagliare: la **fedeltà dei numeri** (media ponderata, differenza, percentuale) e l'**onestà sui dati assenti** (nessun valore inventato, fonte dichiarata correttamente o dichiarata ignota).\n\n- **Vitest — persistenza della provenienza**: `upsertSecurity` scrive `data_source` sia in inserimento sia in aggiornamento; `GET /api/securities/:isin` la restituisce sulle risposte da cache; una riga preesistente senza colonna popolata resta `null` e non viene reinterpretata.\n- **Vitest — integrazione sull'endpoint di dettaglio**: anagrafica completa in cache (tutti i campi valorizzati, `dataSource` corretta), ISIN senza riga in cache (anagrafica e valori correnti tutti `null`, `dataSource` `null`), carichi multipli sullo stesso ISIN (media ponderata corretta, `loads` completo e ordinato), differenza negativa (segno e percentuale), ISIN valido ma non presente nel portafoglio (404), ISIN malformato (400), portafoglio inesistente (404).\n- **Nessun test tocca la fonte reale**: gli scenari E2E seminano l'archivio o intercettano la rotta API, come impone la disciplina descritta in `e2e/support/titoli.ts`.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`e2e/`, fixture `archivio` da `e2e/support/fixtures.ts`)\n**Registrazione video:** solo lo scenario dimostrativo (campo `Dimostra` della spec), salvato in `docs/test-results/US-018/` via `page.video().saveAs()` in `afterEach`; gli altri scenari girano senza video. I due scenari vivono in **file separati** perché `test.use({ launchOptions: { slowMo } })` non è scopabile a un `describe`, e ciascun file riserva il **proprio ISIN** seminabile secondo la regola un-ISIN-per-file.\n\n| Scenario | Percorso utente |\n|---|---|\n| Dettaglio di un titolo con anagrafica completa (demo, con video) | Dato un portafoglio con tre carichi dello stesso ISIN creati via API e l'anagrafica seminata in archivio con fonte Borsa Italiana, l'utente apre il portafoglio, clicca la riga del titolo nella tabella di riepilogo, la scheda titolo si apre e mostra quantità totale, valore medio di carico, valore attuale e differenza coerenti coi carichi; l'anagrafica riporta ticker, tipo strumento, commissioni, valuta, emittente, segmento e politica dividendi; la riga di provenienza dichiara Borsa Italiana; i tre carichi individuali sono elencati. |\n| Dettaglio di un titolo la cui anagrafica non è in archivio | Dato un portafoglio con un carico su un ISIN rimosso dalla cache, l'utente apre il dettaglio dalla tabella di riepilogo e vede i dati di posizione calcolati dai soli carichi, ogni campo anagrafico dichiarato \"dato non disponibile\", valore attuale e differenza dichiarati non disponibili e la provenienza dichiarata non registrata — nessun valore inventato in pagina. |\n| Apertura da tastiera della scheda titolo | L'utente raggiunge la riga del titolo con Tab e la attiva con Enter: la scheda si apre come col click, e la linguetta Scheda titolo risulta attiva. |\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono disponibili in `docs/mockups/US-018/` (`index.html` — dato completo con fonte primaria; `dati-mancanti.html` — variante con anagrafica assente e fonte non registrata)\n\n_Piano prodotto con ARchetipo Planning — 07 agosto 2026_\n"
