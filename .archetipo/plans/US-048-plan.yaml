schema: archetipo/plan/v2
spec_code: US-048
body: |-
  # US-048: Registrare uno scarico con quantità frazionaria — Piano di implementazione

  **Generato da:** Team di Pianificazione ARchetipo
  **Data:** 2026-08-17

  ---

  ## Spec

  **Epic:** EP-008 — Vendite e posizioni chiuse
  **Priorità:** HIGH | **Punti:** 5

  **User Story**
  Come Giulia, investitrice prudente,
  voglio vendere la quantità esatta di quote che ho dismesso, decimali compresi, fino a chiudere del tutto la posizione,
  in modo che il residuo a registro sia quello vero e non un avanzo che nessuna vendita riesce a estinguere (FR-022).

  **Criteri di Accettazione**
  - [ ] Il modulo di scarico accetta una quantità venduta con decimali, digitata con la virgola o con il punto
  - [ ] Client e server rifiutano entrambi, nominando il limite, una quantità nulla, negativa, non numerica o con più di sei decimali
  - [ ] La vendita dell'intera quantità frazionaria detenuta porta il residuo **esattamente** a zero: il titolo esce dai posseduti, compare fra le posizioni chiuse e il suo P&L latente è 0 — nessun residuo dovuto alla virgola mobile
  - [ ] FR-024 resta vero sui decimali in entrambe le direzioni: una vendita che eccede il disponibile anche di una sola quota millesimale è rifiutata, e una vendita capiente non è mai rifiutata per un errore di rappresentazione
  - [ ] L'attribuzione LIFO su quantità frazionarie restituisce quantità residua e costo attribuito corretti per ogni lotto, coperta da test puri sul caso «un lotto consumato per intero e il precedente in parte»
  - [ ] Ogni punto che mostra una quantità venduta o residua la rende in it-IT con i soli decimali presenti: «Registro delle iscrizioni», residuo dopo lo scarico, l'avviso «consumato in parte (X quote su Y)» e le posizioni chiuse
  - [ ] Le vendite già in archivio con quantità intera restano invariate in valore dopo la migrazione dell'archivio
  - [ ] Test E2E su due scenari: uno scarico parziale frazionario e uno scarico totale frazionario che chiude la posizione

  ---

  ## Soluzione Tecnica

  L'intervento si articola in due direzioni: (a) replicare il pattern di US-047 sullo scarico — schema, validazione server, parsing client, resa a schermo — e (b) risolvere il problema specifico dello scarico che non esiste nel carico: il residuo di virgola mobile dopo una vendita totale frazionaria.

  ### 1. Migrazione dello schema (`sales.quantity` da `integer` a `real`)

  - In `server/src/db/schema.ts`, la colonna `quantity` della tabella `sales` (riga 96) passa da `integer('quantity')` a `real('quantity')`. Con US-047 già fatto, `positions.quantity` è già `real`.
  - SQLite non supporta `ALTER COLUMN`: Drizzle-kit genera la sequenza standard *create temp → copy → drop → rename* che preserva dati, indici e FK. I valori interi già in archivio passano a `real` senza perdita.
  - La migrazione si genera con `npx drizzle-kit generate` e viene applicata automaticamente al prossimo avvio da `runMigrations()`.

  ### 2. Robustezza virgola mobile in `rigiocaRegistro` (`shared/domain/lottiLifo.ts`)

  È il cuore di questa spec e ciò che la distingue da US-047. Il problema:

  ```
  // Carico 1: 12,345 quote.  Carico 2: 7,5 quote.
  // Vendita 1: 5,005 quote. LIFO prende da carico 2: 7,5 − 5,005 = 2,495 (residuo).
  // Vendita 2: 14,84 quote. LIFO prende 2,495 dal carico 2, poi 12,345 dal carico 1.
  // Ma: 14,84 − 2,495 = 12,344999999999999 in IEEE 754, non 12,345.
  // Quindi: 12,345 − 12,344999999999999 = 1,77635684e-15, non 0.
  // La posizione non risulta chiusa.
  ```

  **Soluzione: arrotondamento a 6 decimali alla sorgente.** Si aggiunge una funzione `round6` in `lottiLifo.ts` e la si applica nei due punti in cui `rigiocaRegistro` esegue una sottrazione di quantità:

  ```ts
  /** Arrotonda a 6 decimali: il limite di precisione delle quantità (US-048). */
  function round6(v: number): number {
    return Math.round(v * 1e6) / 1e6;
  }
  ```

  Punti di applicazione in `rigiocaRegistro`:
  - riga 237: `residuo.set(carico.id, round6(disponibile - presa));`
  - riga 238: `daCoprire = round6(daCoprire - presa);`

  Perché è corretto:
  - Il vincolo di business è «al più 6 decimali»: arrotondare a 6 decimali dopo ogni sottrazione preserva la semantica.
  - Su quantità intere (tutti i dati preesistenti), `round6` è un no-op: un intero arrotondato a 6 decimali resta esattamente se stesso in IEEE 754.
  - Tutti i confronti a valle (`totalQuantity === 0`, `totalQuantity > 0`, `quantita > disponibileTotale`) funzionano senza modifiche, perché i residui da cui sono calcolati sono già puliti.

  Alternative scartate:
  - **Epsilon ai siti di confronto** (`Math.abs(x) < 1e-9` al posto di `=== 0`): i confronti sono in 8+ punti del codice (client e server), e ogni nuovo confronto dovrebbe ricordarsi dell'epsilon. Fragile.
  - **Aritmetica in interi** (moltiplicare per 1e6): invasivo, richiede conversione a ogni I/O.

  ### 3. Validazione server (POST `/api/portfolios/:id/sales`)

  In `server/src/api/sales.ts` riga 83, la guardia `!Number.isInteger(quantity) || quantity <= 0` diventa:

  ```ts
  typeof quantity !== 'number' || !Number.isFinite(quantity) || quantity <= 0 || Math.round(quantity * 1e6) / 1e6 !== quantity
  ```

  Il messaggio di errore cambia da `'La quantità venduta deve essere un intero positivo.'` a `'La quantità venduta deve essere un numero positivo con al più sei decimali.'`.

  ### 4. Parsing e validazione client (`ModuloScarico.tsx`)

  **Input:** L'`<input type="number" min="1" step="1">` (riga 248) diventa `type="text" inputMode="decimal"` con placeholder `"es. 5,005"` — lo stesso pattern di US-047 nel carico.

  **Sotto-etichetta:** da `"numero intero di quote"` (riga 240) a `"numero positivo, al più 6 decimali"`.

  **Validazione (`validaForma`, riga 101):** `parseInt(quantity, 10)` diventa:
  1. Normalizzazione virgola → punto.
  2. `parseFloat`.
  3. Controllo: `isNaN`, `<= 0`, più di 6 decimali.
  4. Messaggio di errore aggiornato.

  **Invio (`iscrivi`, riga 120):** `parseInt(quantity, 10)` diventa `parseFloat(normalizzato)` nel payload.

  ### 5. Resa a schermo delle quantità vendute e residue

  I punti da aggiornare sono meno numerosi di US-047 perché la maggior parte delle quantità a schermo è già stata convertita a `quantita()` dal carico frazionario. Restano:

  | Dove | Attuale | Dopo |
  |---|---|---|
  | `ModuloScarico.tsx` riga 184: `{scelto?.residuo ?? 0}` | numero grezzo | `quantita(scelto?.residuo ?? 0)` — importare `quantita` da `Foglio.tsx` |
  | `PortfolioDetailPage.tsx` riga 1534: `ultimaVendita.quantity` nell'avviso successo | numero grezzo nel `<b>` | `quantita(ultimaVendita.quantity)` |
  | `PortfolioDetailPage.tsx` riga 1199: `ep.soldQuantity.toLocaleString('it-IT')` nelle posizioni chiuse | `toLocaleString('it-IT')` (max 3 decimali default) | `quantita(ep.soldQuantity)` |

  I seguenti punti sono già stati aggiornati da US-047:
  - Registro: `quantita(vendita.quantity)` (riga 1752) — ✅ già fatto
  - Riquadro residuo: `quantita()` su `totalQuantity`, `loadedQuantity`, `soldQuantity` — ✅ già fatto
  - Messaggio consumo parziale: `quantita()` — ✅ già fatto

  ### 6. Formattazione messaggio impedimento server

  In `server/src/api/positions.ts` riga 169, il messaggio di impedimento mostra:
  ```ts
  `in parte (${lotto.quantitaConsumata} quote su ${lotto.quantita})`
  ```

  Con quantità frazionarie mostrerebbe float brutti (es. `2.4950000000000001`). Va formattato con `toLocaleString('it-IT', { maximumFractionDigits: 6 })` o con la funzione `quote()` esportata da `lottiLifo.ts`. La funzione `quote()` è attualmente privata: la si esporta come `formatQuote` (o si duplica il formatter inline). La stessa formattazione va applicata a `lotto.quantita` nella stessa stringa.

  ---

  ## Strategia di Test

  I test coprono i tre livelli: dominio puro (Vitest), integrazione server (Vitest + Fastify inject), E2E (Playwright).

  ### Test puri del dominio (Vitest)

  - **`lottiLifo.test.ts`:** Nuovi casi con quantità frazionarie sullo scarico:
    - **Caso critico — vendita totale frazionaria con residuo esatto a zero.** Due carichi (12,345 + 7,5 = 19,845 quote), vendita di 5,005 (LIFO: dal carico di 7,5, residuo 2,495), poi vendita di 14,84: il `quantitaResidua` del registro rigiocato deve essere **esattamente** `0`, non `~1e-16`. `totalQuantity === 0` vero.
    - Vendita parziale frazionaria: su 19,845 quote residue, vendita di 5,005 → `quantitaResidua = 14,84`, `costoAttribuito` e `costoResiduo` corretti per ogni lotto.
    - `verificaVendita` accetta una vendita di quantità esattamente uguale alla giacenza frazionaria (14,84 su 14,84): esito `ok`.
    - `verificaVendita` rifiuta una vendita di 14,841 su 14,84: esito `quantita-eccedente`.
    - `residuoPerIsin` a residuo zero dopo vendite frazionarie: `totalQuantity === 0`, `avgLoadPrice === null`, `latentPnl === 0` (zero misurato).

  ### Test di integrazione server (Vitest)

  - **`api.sales.test.ts`:** Nuovi casi per POST:
    - Accettazione: `quantity: 5.005` → 201.
    - Accettazione: `quantity: 7.5` → 201.
    - Rifiuto: `quantity: 5.0051234` (più di 6 decimali) → 400 con messaggio che nomina il limite.
    - Rifiuto: `quantity: 0` → 400.
    - Rifiuto: `quantity: -1.5` → 400.
    - I casi interi preesistenti restano verdi.
    - Vista riepilogo dopo vendita frazionaria totale: `totalQuantity === 0`, posizione chiusa.

  ### Test E2E — Simulazione utente

  **Framework:** Playwright (già configurato nel progetto)
  **Video:** Demo scenario registrato — il campo `Dimostra` descrive un flusso filmabile.

  | Scenario | Flusso utente |
  |---|---|
  | Scarico parziale frazionario | L'utente crea un portafoglio, iscrive due carichi di 12,345 e 7,5 quote (già possibili da US-047), poi registra una vendita di 5,005 quote. Verifica: residuo 14,84, il lotto più recente consumato in parte (2,495 su 7,5), la quantità venduta formattata con la virgola nel Registro e nel riquadro del residuo. |
  | Scarico totale frazionario che chiude la posizione | L'utente vende le restanti 14,84 quote. Verifica: il titolo esce dai posseduti, compare in «Posizioni chiuse» con residuo zero, P&L latente 0, e la quantità venduta nella sezione chiuse è formattata correttamente. |
  | Validazione client — quantità errate | L'utente tenta di iscrivere una vendita con 7+ decimali, con 0, con testo non numerico: verifica messaggi di errore client. |

  **Chiave ISIN:** Nuova costante `TITOLO_US_048` in `e2e/support/titoli.ts`, riservata a `US-048__scarico-frazionario.spec.ts`.
  **Video:** Salvato in `docs/test-results/US-048/demo-scarico-frazionario.webm`.

  ---

  _Piano generato via ARchetipo Planning — 2026-08-17_
