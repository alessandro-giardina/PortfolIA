schema: archetipo/plan/v2
spec_code: US-043
body: "# US-043: Mostrare il P&L realizzato congelato accanto al P&L latente — Piano di implementazione\n\n**Generato da:** ARchetipo Planning Team\n**Data:** 12 agosto 2026\n\n---\n\n## Spec\n\n**Epica:** EP-008 — Vendite e posizioni chiuse\n**Priorità:** HIGH | **Punti:** 6\n**Bloccata da:** US-042 (DONE) — la tabella `sales` e il dominio `rigiocaRegistro`/`residuoPerIsin` esistono già e restano il solo punto in cui LIFO è calcolato.\n\n**User Story**\nCome Alessandro, investitore-proprietario, voglio vedere separati il guadagno già incassato con le vendite e quello ancora sulla carta, in modo da sapere quanto ho realmente realizzato e quanto dipende ancora dal mercato (FR-025, ADR-009).\n\n**Criteri di Accettazione**\n- [ ] Il riepilogo del portafoglio mostra P&L realizzato, P&L latente e P&L totale, con il totale pari alla somma dei due\n- [ ] Il P&L realizzato di una vendita è calcolato all'atto della registrazione come (prezzo di vendita − costo LIFO attribuito) × quantità venduta e non varia al sopraggiungere di nuove rilevazioni di prezzo\n- [ ] Il P&L latente è calcolato sulla sola quantità residua, e vale 0 — non \"dato non disponibile\" — quando la quantità residua è 0\n- [ ] Un test copre l'invariante P&L realizzato + P&L latente = P&L totale, prima e dopo una vendita a prezzo di mercato invariato\n- [ ] La percentuale del P&L totale ha per base il costo di tutti i carichi, lotti venduti inclusi, e un test verifica che costo dei lotti consumati + costo dei lotti residui = costo complessivo dei carichi\n- [ ] Il riepilogo dichiara esplicitamente che l'incasso delle vendite non è trattenuto come liquidità nel portafoglio: il valore attuale comprende i soli titoli posseduti, mentre il risultato dell'operazione è nel P&L realizzato\n\n---\n\n## Soluzione tecnica\n\nUS-042 ha lasciato deliberatamente fuori il prezzo di vendita dall'attribuzione LIFO: `VenditaLotto` non lo porta, per rendere impossibile calcolare per sbaglio un risultato realizzato in quella spec. È esattamente il punto da cui questa spec riparte: il prezzo di vendita entra ora nel dominio, e il P&L realizzato si ottiene componendolo con il costo attribuito che `rigiocaRegistro` già calcola — non da una seconda formula, dalla stessa rigiocata.\n\n### Il dominio: `shared/domain/lottiLifo.ts`\n\nNessun nuovo modulo: il P&L realizzato è un sottoprodotto della stessa rigiocata che già produce il costo attribuito, e tenerlo altrove significherebbe leggere il registro due volte con due criteri che potrebbero scollarsi.\n\n- `VenditaLotto` acquisisce `salePrice` (`Pick<Sale, 'id' | 'saleDate' | 'quantity' | 'salePrice'>`). Era assente per costruzione in US-042; qui la sua assenza cesserebbe di essere una garanzia e diventerebbe un ostacolo.\n- `VenditaAttribuita` acquisisce due campi: `ricavo` (`salePrice × quantity` della vendita) e `pnlRealizzato` (`ricavo − costoAttribuito`). È il criterio 2 alla lettera: il costo viene da LIFO, il ricavo dal prezzo scritto sull'iscrizione, nessuno dei due dal prezzo corrente.\n- `RegistroRigiocato` acquisisce `pnlRealizzato`, la somma dei `pnlRealizzato` delle vendite. È il realizzato dell'ISIN, e **non menziona il prezzo corrente in nessun punto della sua catena di calcolo**: è la proprietà da cui discende il congelamento, non un vincolo aggiunto a parte.\n- `residuoPerIsin` acquisisce tre campi nuovi, senza toccare quelli esistenti (nessuna modifica ai numeri che i test di regressione di US-042 già fissano al centesimo):\n  - `realizedPnl` = `registro.pnlRealizzato`. Mai `null`: non dipende dal prezzo corrente, quindi è sempre calcolabile, incassi o no.\n  - `latentPnl` = `totalQuantity === 0 ? 0 : difference`. Qui sta il criterio 3, e la ragione per cui non è semplicemente un alias di `difference`: a residuo nullo il latente è **zero misurato** — zero quote valgono zero indipendentemente dal fatto che il prezzo corrente sia in cache o no — mentre `difference` resterebbe `null` se `currentPrice` fosse assente, perché per quantità positive quella nullità è genuina (il prezzo manca davvero e il latente è sconosciuto). La differenza è visibile nel caso limite del titolo interamente venduto senza prezzo mai rilevato: `currentPrice` è `null`, ma `latentPnl` è `0`, non \"dato non disponibile\".\n  - `totalLoadCost` = `registro.costoAttribuito + registro.costoResiduo`. È il costo di **tutti** i carichi, lotti venduti inclusi — la base della percentuale del criterio 5 — e coincide per costruzione con Σ(`loadPrice × quantity`) di tutti i carichi, proprietà che era già un'invariante testata di US-042 e che qui diventa anche un valore esposto.\n  - `totalPnl` = `latentPnl !== null ? realizedPnl + latentPnl : null` (qui `latentPnl` non è mai `null` quando `totalQuantity === 0`, quindi l'unico caso di `null` è quota residua positiva e prezzo corrente assente — coerente con `difference`).\n\nCome già per `avgLoadPrice`/`totalLoadValue`/`difference`, l'ordine delle operazioni non si \"semplifica\": `totalPnl` si scrive come somma dei due addendi già calcolati, mai ricalcolato da `currentValue` e `totalLoadCost` con una formula alternativa che divergerebbe di un centesimo in virgola mobile.\n\n### Tipi condivisi\n\n`PositionSummary`, `EnrichedPositionSummary` e `PositionDetail` acquisiscono gli stessi quattro campi (`realizedPnl`, `latentPnl`, `totalPnl`, `totalLoadCost`), con la stessa docstring di `residuoPerIsin`: le tre viste aggregate leggono lo stesso dominio e non devono poter raccontare tre numeri diversi per lo stesso ISIN.\n\n### Server: le tre viste aggregate\n\n`GET /positions/summary`, `GET /positions/enriched` e `GET /positions/:isin/detail` chiamano già `residuoPerIsin`; l'unica modifica è propagare i quattro campi nuovi negli oggetti di risposta. `toVenditaLotto` in `positions.ts` acquisisce `salePrice: row.sale_price` — l'unico punto server-side che costruisce `VenditaLotto` dalle righe di `sales`, usato sia da `leggiRegistriPortafoglio` che da `leggiRegistroIsin`, quindi la propagazione è automatica su tutte e tre le viste da un solo punto.\n\n**Nessuna nuova rotta.** Il totale di portafoglio (le tre cifre e la percentuale che il criterio 1 chiede nel riepilogo) non nasce da un endpoint dedicato: si somma lato client sugli `EnrichedPositionSummary` già in mano, esattamente come oggi \"Valore attuale totale\" e il totale della colonna Differenza sono già `reduce` inline in `PortfolioDetailPage.tsx`. Introdurre un endpoint di aggregazione per un semplice `Σ` su un array già scaricato duplicherebbe una rotta senza motivo architetturale: la vista arricchita resta la sola fonte, letta una volta.\n\n### Interfaccia\n\nNuovo componente `client/src/components/QuadroRisultato.tsx`, montato nella linguetta **Riepilogo** subito sotto `riquadro-valore-totale` e sopra `AggiornaObsoleti`/la tabella titoli — la posizione che il mockup motiva con tre argomenti (valore attuale e risultato sono la stessa grandezza letta due volte; la discrepanza fra i due — l'incasso \"scomparso\" dal valore attuale dopo una vendita totale — va spiegata proprio lì; la tabella sottostante ne è la verifica, perché il suo totale di colonna *Differenza* coincide al centesimo con il P&L latente del quadro).\n\nRiceve `enrichedPositions: EnrichedPositionSummary[]` e calcola, con lo stesso stile `reduce` già in uso nel resto della pagina (nessuna nuova funzione di dominio per questo, per lo stesso motivo per cui non nasce una rotta):\n\n- `realizedTotal = Σ ep.realizedPnl` — sempre completo, mai \"parziale\": non dipende da alcun prezzo.\n- `conLatente = enrichedPositions.filter(ep => ep.latentPnl !== null)`; `latentTotal = Σ conLatente.latentPnl`; `mancanti = enrichedPositions.length − conLatente.length`.\n- `totalPnl = realizedTotal + latentTotal` — \"parziale\" quando `mancanti > 0`, con la stessa dicitura già in uso per \"Valore parziale\" nel riquadro sopra.\n- `totalLoadCost = Σ ep.totalLoadCost` — sempre completo.\n- `percentuale = mancanti === 0 && totalLoadCost !== 0 ? (totalPnl / totalLoadCost) × 100 : null`.\n\nIl quadro riusa dal mockup `docs/mockups/US-043/` (indice, `nuova-rilevazione.html`, `casi-limite.html`, con `README.md` che motiva ogni scelta) le classi CSS del blocco stabile: `.quadro-risultato`, `.somma`/`.voce-pl`/`.operatore` (la somma scritta, non sottintesa: realizzato + latente ═ totale, con la casella del totale oltre la doppia riga verticale che riprende `.mastro tfoot`), `.cifra-pl`, `.verdetto` (guadagno/perdita ridondanti su segno+parola+colore, mai il solo colore), `.percentuale` + `.base-percentuale` (la base scritta sotto, mai una percentuale senza unità dichiarata), `.postilla-liquidita` (il testo del criterio 6, a piena larghezza in fondo al quadro), `.zero-misurato` (Playfair nero, cifra vera) contro `.dato-mancante` (corsivo seppia, già in uso altrove nella pagina).\n\n**Non vengono portati** `.sigillo` (il bollo datato \"congelato il ...\") e `.moto` (le strisce prima/dopo) né `.trittico`/`.caso`: sono chrome narrativo delle pagine di mockup, costruite per illustrare un singolo evento di vendita isolato e la sua invarianza a una singola rilevazione successiva; il quadro reale aggrega più ISIN e più vendite in date diverse, e una data singola sul bollo racconterebbe una cosa falsa. Il congelamento del criterio 2 si comunica invece con una chiosa statica sotto la cifra del realizzato (\"non varia al sopraggiungere di nuove rilevazioni di prezzo\"), verificabile dal test E2E confrontando due letture della pagina, non da un widget che tiene uno stato prima/dopo.\n\n`data-testid` per i test: `quadro-risultato`, `pnl-realizzato`, `pnl-latente`, `pnl-totale`, `pnl-percentuale`, `pnl-postilla-liquidita`.\n\nStili in coda a `client/src/ledger.css`, a partire dal sottoinsieme di `docs/mockups/US-043/shared.css` sopra elencato, senza riscrivere alcuna regola preesistente — la stessa disciplina già seguita per `US-042/shared.css`.\n\n### Fuori perimetro\n\n- Colonna \"Realizzato\" per singolo titolo nella tabella (US-043 chiede le tre cifre nel riepilogo *di portafoglio*, non per riga).\n- Sezione **Posizioni chiuse** (US-044): un titolo interamente venduto resta a riepilogo con quantità 0 e il suo realizzato entra regolarmente nel quadro.\n- Quantità detenuta a una data ed effetti sul grafico (US-045).\n- Saldo di liquidità: resta fuori perimetro per ADR-009 §3; qui compare solo la dichiarazione testuale (criterio 6), non un saldo calcolato.\n\n---\n\n## Strategia di test\n\nIl peso sta di nuovo sul **dominio**: il congelamento e lo zero misurato sono proprietà che un test visivo non distingue da un numero quasi giusto.\n\n- `server/tests/lottiLifo.test.ts` (esteso): `pnlRealizzato` di una singola vendita = `(salePrice − costoAttribuito/quantità) × quantità` su un caso a un solo lotto e su un caso che attraversa due lotti; `registro.pnlRealizzato` come somma su più vendite; **congelamento** — due chiamate a `residuoPerIsin` con lo stesso registro e due `currentPrice` diversi restituiscono lo stesso `realizedPnl` al bit; **zero misurato** — `latentPnl === 0` (non `null`) quando `totalQuantity === 0`, anche con `currentPrice: null`; **l'invariante del criterio 4** — `residuoPerIsin` sul registro *prima* di una vendita (`realizedPnl = 0`, `latentPnl = difference`) confrontato con *dopo* una vendita eseguita esattamente al prezzo corrente (`realizedPnl > 0`, `latentPnl` ridotto): `totalPnl` è identico prima e dopo; **la base del criterio 5** — `totalLoadCost === costoAttribuito + costoResiduo === Σ carichi(loadPrice × quantity)` su un registro con più lotti e più vendite parziali.\n- `server/tests/api.positions.summary.test.ts`, `api.positions.enriched.test.ts`, `api.positions.detail.test.ts` (estesi): dopo una vendita registrata via `POST /sales` (stesso scenario di US-042: 1.000 quote in due carichi, vendita di 400), le tre viste riportano `realizedPnl`, `latentPnl`, `totalPnl`, `totalLoadCost` coerenti con i numeri del dominio; regressione — un ISIN senza vendite riporta `realizedPnl: 0` e `latentPnl` identico a `difference`.\n\n### Test E2E — simulazione utente\n\n**Framework:** Playwright (`e2e/`, fixture `archivio` obbligatoria — mai `try/finally`, come da `CLAUDE.md`).\n**Registrazione video:** solo lo scenario dimostrativo, salvato con `page.video().saveAs('docs/test-results/US-043/demo-pnl-realizzato-latente.webm')` in un `afterEach` dopo `page.close()`.\n**Dati:** una nuova costante in `e2e/support/titoli.ts`, ISIN di proprietà del file dimostrativo (mai riusato altrove), verificata da `npm run check:chiavi`. I carichi e la vendita si registrano via API dentro il portafoglio della fixture; le date sono espresse in giorni indietro da adesso, mai fisse.\n\n| Scenario | Descrizione del flusso utente |\n|---|---|\n| Vendita parziale, poi nuova rilevazione (**demo**) | Portafoglio con due carichi (600 quote più vecchie a prezzo più basso, 400 più recenti a prezzo più alto). L'utente registra la vendita di 400 quote a un prezzo di vendita superiore al carico consumato: il riepilogo mostra le tre cifre — realizzato, latente sulle 600 residue, totale come somma — e la postilla sulla liquidità. L'utente apre poi la scheda titolo e provoca una nuova rilevazione di prezzo (ricerca/aggiornamento): tornato al riepilogo, il latente e il totale sono cambiati, il realizzato è **identico al centesimo** a quello letto prima. |\n| Vendita totale → latente zero misurato | Vendendo l'intera quantità residua, il riepilogo mostra P&L latente **€ 0,00** (non \"dato non disponibile\") e il realizzato pari al guadagno complessivo. |\n| Prezzo mancante su una posizione detenuta | Con un secondo titolo caricato ma senza prezzo corrente in cache, il quadro dichiara il totale e la percentuale come parziali/assenti, senza inventare un rapporto sul dato incompleto. |\n| Dichiarazione sulla liquidità | Il testo del criterio 6 (l'incasso non è trattenuto come liquidità) è visibile nel riepilogo. |\n\nGli scenari senza video vivono in un file sorello dello scenario dimostrativo se la configurazione del video a livello di `test.use()` lo richiede (stessa regola della coppia `US-026__*`), altrimenti nello stesso file.\n\n---\n\n> \U0001F3A8 I mockup di questa spec sono già in `docs/mockups/US-043/` — `index.html` (quadro dopo la vendita), `nuova-rilevazione.html` (il latente si muove, il realizzato no), `casi-limite.html` (nessuna vendita, vendita totale, prezzo mancante) — con `README.md` che motiva ogni scelta di disegno. Verificati in fase di pianificazione: completi e coerenti con lo stile del mastro già in uso; l'implementazione ne riusa il sottoinsieme di classi CSS stabile (vedi \"Interfaccia\" sopra) e non ne replica il chrome scenario-specifico (`.sigillo`, `.moto`, `.trittico`/`.caso`).\n\n_Piano generato con ARchetipo Planning — 12 agosto 2026_\n"
