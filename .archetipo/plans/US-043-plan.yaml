    body: 'Nuovo client/src/components/QuadroRisultato.tsx: riceve enrichedPositions e calcola con reduce (stesso stile del riquadro-valore-totale gia'' in PortfolioDetailPage.tsx, nessuna nuova funzione di dominio) realizedTotal = somma realizedPnl (sempre completo), latentTotal sui soli ep con latentPnl non-null con conteggio dei mancanti, totalPnl = realizedTotal + latentTotal (parziale se mancanti > 0), totalLoadCost = somma totalLoadCost, percentuale = null se mancanti > 0 o totalLoadCost === 0. Rende le tre caselle (realizzato + latente = totale, operatori veri, doppia riga sul totale), la percentuale con base dichiarata sotto, la postilla sulla liquidita'' (criterio 6) a piena larghezza, le convenzioni zero-misurato (Playfair nero) vs dato-mancante (corsivo seppia, classe gia'' in uso). data-testid: quadro-risultato, pnl-realizzato, pnl-latente, pnl-totale, pnl-percentuale, pnl-postilla-liquidita. Montato in PortfolioDetailPage.tsx nella linguetta Riepilogo, subito sotto riquadro-valore-totale e sopra AggiornaObsoleti/la tabella titoli, quando ci sono posizioni. Non riproduce .sigillo/.moto/.trittico del mockup (chrome narrativo di un singolo evento di vendita, non generalizzabile a piu'' ISIN/vendite): il congelamento del criterio 2 si comunica con una chiosa statica sotto la cifra del realizzato.'
